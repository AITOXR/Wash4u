{% extends "layout.html" %}
{% block guest_content %}
<div class="login-wrap">
  <form class="login-card" method="post" action="/admin/change-password">
    <h1 style="margin-top:0">Set a new password</h1>
    <p>{% if forced %}For your security, you need to set your own password before continuing.{% endif %}</p>
    {% if error %}<div class="flash flash--error">{{ error }}</div>{% endif %}
    <label class="form__field"><span>Current password</span><input type="password" name="current_password" required></label>
    <label class="form__field"><span>New password</span><input type="password" name="new_password" required minlength="10"></label>
    <label class="form__field"><span>Confirm new password</span><input type="password" name="confirm_password" required minlength="10"></label>
    <button class="btn btn--primary" type="submit" style="width:100%">Save password</button>
  </form>
</div>
{% endblock %}
