{% extends "layout.html" %}
{% block guest_content %}
<div class="login-wrap">
  <form class="login-card" method="post" action="/admin/forgot-password">
    <h1 style="margin-top:0">Reset password</h1>
    {% if sent %}
    <p>If that email has an account, a reset link has been sent.</p>
    {% else %}
    <label class="form__field"><span>Email</span><input type="email" name="email" required></label>
    <button class="btn btn--primary" type="submit" style="width:100%">Send reset link</button>
    {% endif %}
    <p style="margin-top:1rem"><a href="/admin/login">Back to login</a></p>
  </form>
</div>
{% endblock %}
