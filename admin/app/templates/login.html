{% extends "layout.html" %}
{% block guest_content %}
<div class="login-wrap">
  <form class="login-card" method="post" action="/admin/login">
    <h1 style="margin-top:0">Wash4You Admin</h1>
    {% if error %}<div class="flash flash--error">{{ error }}</div>{% endif %}
    <label class="form__field"><span>Email</span><input type="email" name="email" required autofocus></label>
    <label class="form__field"><span>Password</span><input type="password" name="password" required></label>
    <button class="btn btn--primary" type="submit" style="width:100%">Log in</button>
    <p style="margin-top:1rem"><a href="/admin/forgot-password">Forgot password?</a></p>
  </form>
</div>
{% endblock %}
