{% extends "layout.html" %}
{% block guest_content %}
<div class="login-wrap">
  <form class="login-card" method="post" action="/admin/reset-password">
    <h1 style="margin-top:0">Set a new password</h1>
    {% if error %}<div class="flash flash--error">{{ error }}</div>{% endif %}
    <input type="hidden" name="token" value="{{ token }}">
    <label class="form__field"><span>New password</span><input type="password" name="new_password" required minlength="10"></label>
    <button class="btn btn--primary" type="submit" style="width:100%">Save password</button>
  </form>
</div>
{% endblock %}
