  since most towers restrict personal deliveries at the security desk.
- Weekday pickup windows are set for before work or after 7pm; midday slots rarely suit anyone in this
  catchment. Weekend collections are the other common choice.
- Shirt volume dominates the basket here — wash-and-press with collar and cuff attention, plus treatment
  for antiperspirant build-up on white shirts, is the most requested service in this area.
- Suits, structured blazers, wool trousers, silk ties and winter overcoats are the high-value items we
  handle most from Cyber City; overcoats typically come in once at the end of the cold weeks to be cleaned
  before storage.
- Shared flats are common in this catchment, so each customer's order is counted at the door, packed separately
  from every other order, and covered by a written receipt at pickup.
- Neither Wash4You shop is inside Cyber City. The nearest walk-in counter is Vyapar Kendra — Gate No.
  3, Shop No. 180, GF Shushant, Vyapar Kendra Rd, Block C, Sushant Lok Phase I, Sector 43, Gurugram 122009.
faqs:
- q: Do you have a shop inside Cyber City?
  a: No — Cyber City is an office district rather than a retail one, so neither of our two shops is located
    inside it. We serve the area entirely through free doorstep pickup and delivery. If you would rather
    hand your clothes over in person, our Vyapar Kendra counter at Gate No. 3, Shop No. 180, GF Shushant,
    Vyapar Kendra Rd, Block C, Sushant Lok Phase I, Sector 43 is open to walk-ins, and our second shop
    is at AG-75, Ground Floor, Block-A, Unitech Arcadia, Sector 49.
- q: I'm at my desk all day. When can you collect?
  a: We set the window around you rather than around us. For working customers in and around Cyber City
    that usually means an early-morning slot before you leave, an evening slot after office hours, or
    a weekend collection. Message us on WhatsApp at +91 63 67 600 500 with the time that works and we
    will confirm it.
- q: Can you pick up from my office building instead of my flat?
  a: Most corporate towers in the district run visitor and security protocols that make leaving personal
    parcels at reception impractical, so we normally collect from your residence. If your building genuinely
    allows it and you can meet us at the desk, tell us when you book and we will work with that.
- q: I share a flat with two other people. Will our clothes get mixed up?
  a: No. Every order is counted with the customer at the door at the time of pickup, packed separately
    from every other customer's order, and acknowledged with a written receipt. Each flatmate books and
    receives their own order, so nothing is bundled together.
- q: How should I send formal shirts — wash or dry clean?
  a: Most cotton and cotton-blend formal shirts are better off with a proper wash and press than with
    dry cleaning, and that is what we would normally recommend. Suits, structured blazers, wool trousers,
    silk ties and overcoats are the pieces that genuinely need dry cleaning. If you are unsure about a
    particular garment, send us a photo on WhatsApp and we will tell you honestly which it needs.
- q: Do you handle shoes and bags as well as clothes?
  a: Yes. Sneaker and shoe cleaning is one of the things customers come back to us for — we have handled
    suede and mesh uppers that owners had written off — along with leather and fabric bags. It is a common
    request from commuters here, and the results are visible in our before-and-after work.
- q: There is a coffee stain on my shirt that I already tried to wash out. Is it too late?
  a: 'Not necessarily. A good share of what we treat has already been attempted at home first — one of
    our customers put it plainly: "I tried at home and the stain didn''t go. Wash4You removed it completely."
    We can''t promise every stain on every fabric, but tell us what caused it and what you have already
    used on it, because that genuinely changes how we treat it.'
