faqs:
- q: Do you cover the whole Golf Course Extension Road stretch, including Sectors 65 to 69?
  a: Yes. Free doorstep pickup and delivery covers this corridor, and our Sector 49 Arcadia store is the
    closer of our two shops to it. If you are unsure whether your tower is on the run, send your society
    name and sector on WhatsApp to +91 63 67 600 500 and we will confirm before you book.
- q: My society will not let delivery staff past the lobby. How does pickup work?
  a: Our rider registers at the main gate desk like any other visitor and comes up to your flat door wherever
    the society allows it. If your tower restricts entry to the lobby, we collect there instead — the
    order is still counted in front of you and you still get a written receipt at the point of pickup.
- q: We both work full time. Can you pick up outside office hours?
  a: That is the normal request on this stretch. Ask for an early-morning slot before the office run,
    an evening slot, or a weekend pickup when you book, and we plan the route around it. You can also
    name a family member or house-help on the booking to hand over on your behalf.
- q: We have just furnished a new flat. Can you clean the sofa and mattress at home?
  a: Yes — fabric sofa and mattress cleaning is one of the services newly possessed flats here ask for
    most, along with curtains that pick up dust from nearby construction. Message us photos of the piece
    and its fabric on WhatsApp so we can advise on the right treatment before scheduling.
- q: How do I know my clothes will not get mixed up with another flat's?
  a: Every order is counted with you at the door, packed separately from every other customer's order,
    and acknowledged with a written receipt at pickup. In a large tower where everyone owns similar linen,
    that separation is the whole point.
- q: Do you do regular weekly laundry as well as dry cleaning?
  a: Both. Most households on this corridor run a weekly wash-and-fold for bedsheets, towels, gym wear
    and everyday clothes, and use dry cleaning for suits, sarees, blazers and winter woollens. You can
    combine both in a single pickup.
