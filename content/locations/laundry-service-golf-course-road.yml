body: |-
  **Our Sector 43 store sits at the top of the corridor.** Wash4You's Vyapar Kendra shop — Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Rd, Block C, Sushant Lok Phase I, Sector 43 — is on the Golf Course Road side of Gurugram, which is why this stretch has been part of our regular pickup beat since we started. Our second store at Unitech Arcadia, Sector 49, backs it up. Golf Course Road is not a single neighbourhood so much as a spine of gated high-rises: DLF Aralias, Magnolias and Park Place, Central Park, and the towers and condominiums strung between them. Households here are senior corporate professionals, founders, consultants, expat families and retired couples — people with large wardrobes, long working hours, and very little patience for a garment coming back with a snagged sequin.

  **What the wardrobes here actually need.** Compared with the rest of the city, the mix on this road skews heavily towards things you cannot put in a washing machine. Suits and structured blazers for the office. Silk and chiffon sarees, lehengas and sherwanis with zardozi, mirror-work, sequins and delicate beading that come out for the wedding season. Pashmina, cashmere and merino for the four cold weeks. Evening dresses. Full-length curtains and drapes from double-height living rooms, and fabric sofas that get used hard by kids and dogs. Sneakers too — our before-and-after work on suede uppers like the Nike SB Dunk and cushioned runners like the Hoka Bondi lands well with a household that owns six pairs and wears three. Nazuk kapde, extra care: embellished and hand-finished pieces are inspected, spot-treated and processed separately, never bundled into a general load.

  **Pickup that works with a gate desk, not against it.** Doorstep collection in a tower is a different exercise from a plotted house. Our rider carries the booking name and flat number to the guard desk, waits for the resident or the household staff to approve entry on the visitor app or intercom, uses the service lift where the RWA requires it, and collects at the flat door. If you are at the office, a helper or family member can hand over just as easily, because the count is the safeguard: every order is counted with whoever is at the door, packed separately from every other customer's order, and acknowledged with a written receipt at pickup. Nothing is pooled, nothing is guessed at later. Weekday mornings suit staffed homes; evenings and weekends suit couples who want to hand things over themselves.

  Free pickup and delivery, no minimum drama. WhatsApp or call **+91 63 67 600 500**, or write to **care@wash4you.in**.
faqs:
- q: Do you cover the whole Golf Course Road corridor, including DLF Aralias, Magnolias, Park Place and
    Central Park?
  a: Yes. Free doorstep pickup and delivery runs across Gurugram, and this corridor is served from our
    Vyapar Kendra store in Sushant Lok Phase I, Sector 43, with our Sector 49 Arcadia store as backup.
    Send your society name, tower and flat number on WhatsApp at +91 63 67 600 500 and we will confirm
    a slot.
- q: My tower requires visitor registration. How does your rider get in?
  a: The rider reports to the guard or concierge desk with your booking name and flat number and waits
    for you or your household staff to approve entry on the visitor app or intercom, exactly as any other
    delivery. Where the RWA requires the service lift, we use it. If your society has a rule you would
    like us to follow, tell us when you book and we will brief the rider.
- q: Can my house help hand over the clothes if I am at work?
  a: Yes, and this is how a large share of Golf Course Road pickups happen. The order is counted item
    by item with whoever is at the door, and a written receipt is given at that moment, so you have a
    record even if you were in a meeting when the bag left.
- q: I have a lehenga with sequins and zardozi. Is it safe with you?
  a: Embellished and hand-finished garments are inspected before processing, spot-treated where needed,
    and handled separately rather than being put through a general load. Safe on Fabric is one of our
    four promises and it is the whole reason delicate occasion wear is a core part of what we do. Bring
    it in or send photos on WhatsApp and we will tell you honestly what we can and cannot do with it.
- q: Will my clothes get mixed up with someone else's?
  a: No. Every order is packed separately from every other customer's order from the moment it is counted
    at your door, and it stays that way through processing and delivery.
- q: Do you clean curtains, sofas and sneakers as well as clothes?
  a: Yes. Fabric sofas, curtains and drapes, and sneaker cleaning including suede uppers are all part
    of our specialist care work, alongside laundry and dry cleaning. These are common requests from larger
    apartments on this stretch.
- q: Is there a store I can walk into?
  a: 'Two. Vyapar Kendra: Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Rd, Block C, Sushant Lok
    Phase I, Sector 43, Gurugram 122009. Arcadia: AG-75, Ground Floor, Block-A, Unitech Arcadia, Sector
    49, Gurugram 122018.'
