body: |-
  ## Laundry and dry cleaning along the MG Road corridor

  MG Road is where Gurugram started behaving like a city. It is the old spine — the metro running overhead, the retail stretch below, and behind both, sectors of plotted houses and builder floors that were built long before the glass towers went up further south. Households here are not one type. You have families who have lived on the same street for two decades, professionals renting a floor because the metro puts Delhi within reach, and a steady rotation of consultants and project staff in service apartments who are in town for six weeks and have no interest in finding a dhobi. Of our two stores, the Vyapar Kendra shop in Sushant Lok Phase I is the one that sits on this side of Gurugram and handles the MG Road runs. Pickup and delivery is free, so the practical difference for you is only that the shop is close enough to be a real place you could walk into.

  **If you're in a service apartment or short-stay rental**, the usual problem is a washing machine you don't trust, no iron worth using, and a front desk that will happily accept a bag on your behalf. We don't work that way. Our rider asks for you, counts the items with you at the door, and hands over a written receipt before leaving. Your order is packed separately from every other customer's, so there is no shared drum with a stranger's clothes. Weekly wash-and-fold plus steam ironing covers most of what this group needs; add dry cleaning when there is a suit or a jacket involved.

  **If you're in one of the older houses or builder floors**, the load looks completely different. Long-settled homes accumulate soft furnishings — heavy curtains, floor carpets, fabric sofas, and a cupboard of razai and blankets that come out once a year and go back smelling of storage. That seasonal work is worth handing over rather than attempting at home; a quilt that doesn't dry properly is worse than a dirty one. We also take on stain removal that has already been tried at home and failed, plus sneaker and leather cleaning — the commute here involves real walking, between the metro exit, the service road and the market stretch, and shoes show it.

  Timing is the one thing worth planning. The corridor is slowest when the retail stretch is busiest, which is evenings and weekends; weekday mid-morning is the easiest window for a rider to reach you. Tell us what suits your day when you book and we'll agree a window rather than guess. Call or WhatsApp **+91 63 67 600 500**, or email **care@wash4you.in**.
faqs:
- q: Do you pick up from service apartments on MG Road, or do I have to hand things in at a store?
  a: 'We pick up from your door. Free doorstep pickup and delivery covers the MG Road corridor, and it
    works the same for service apartments as for houses. One thing to expect: our rider will ask for you
    rather than leaving the bag with the front desk, because every order is counted with the customer
    at the door and acknowledged with a written receipt. It takes two minutes and it is why disputes about
    item counts don''t happen.'
- q: Which Wash4You store handles MG Road?
  a: Our Vyapar Kendra store — Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Rd, Block C, Sushant
    Lok Phase I, Sector 43, Gurugram 122009. It is the closer of our two shops to this side of Gurugram.
    You never need to visit it, since pickup and delivery are free, but you are welcome to.
- q: Can you collect quilts, blankets and curtains from an older builder-floor flat with no lift?
  a: Yes, and it is a large part of what we do in the older MG Road sectors. Bulky items like razai, blankets,
    curtains and carpets are exactly the things that are hard to manage at home. Tell us at booking that
    it is a walk-up and roughly what the load is, so the rider comes prepared rather than making two trips.
- q: What's the best time to book a pickup here?
  a: Weekday mid-morning is usually the smoothest window on this stretch, because the retail traffic along
    MG Road builds through the evening and peaks at weekends. If you work office hours, an evening or
    weekend slot is completely fine — just tell us your preference and we will confirm a window with you
    instead of guessing.
- q: I already tried removing a stain at home and made it worse. Is it too late?
  a: Not necessarily. A good share of the stain work we take on has already been attempted at home — that
    is one of the most common things customers tell us. Don't apply anything further, don't put it through
    a hot wash, and let us see it as it is. We will tell you honestly what we think can be recovered before
    we start.
- q: Is the cleaning safe for sensitive skin and for delicate fabrics?
  a: 'That is the whole basis of how we work: safe on fabric, gentle care, and eco-friendly processes
    that are safe for the planet. Silks, wools, embroidered ethnic wear and anything you would hesitate
    to machine-wash at home go through our specialist and dry cleaning process rather than a standard
    wash.'
