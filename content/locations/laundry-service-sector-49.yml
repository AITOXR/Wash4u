- q: Do you collect from high-rise flats, or only from the society gate?
  a: We come to your door. Share your tower or block and flat number when you book. If your society prefers
    that handovers happen at the guard desk, just tell us at booking and we will collect and deliver there.
- q: How do I know my clothes won't get mixed with someone else's?
  a: Your order is counted with you at the door, packed separately from every other customer's order,
    and acknowledged with a written receipt at pickup. Nothing goes into a shared bag.
