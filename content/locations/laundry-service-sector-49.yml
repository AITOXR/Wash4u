    useful in a rented Sector 49 flat where the upholstery came with the place.
- q: Is the pickup and delivery really free?
  a: Yes. Free doorstep pickup and delivery across Gurugram, Sector 49 included. You pay for the cleaning,
    not for the trip.
- q: Can I get everyday laundry ironed as well as washed?
  a: Yes. Steam ironing is one of the most-used services in this sector, mostly for office shirts and
    trousers. You can send items for washing and ironing together, or for ironing alone.
