body: |-
  **One rug, no free evening**

  Most carpet enquiries we get from Cyber City come from the flats and serviced apartments packed around the towers — single professionals, couples on deputation, expat tenants on two-year leases. Usually it's one rug, not five. A hand-knotted wool piece bought on a weekend trip, a silk runner, a Persian carried over from a previous posting, or a machine-made shag under a work-from-home desk that has taken the brunt of coffee and chair castors.

  The problem is never willingness. It's that a rug is the one thing you cannot drop off on your way to work. It doesn't fit in a cab boot alongside a laptop bag, and nobody wants to roll five kilos of wool through a lobby at 9am. So it stays down, gets vacuumed around, and the grit that comes in off the road and the construction dust settles deeper into the pile until the colours go flat.

  **How we work around office hours**

  We collect free of charge across Gurugram, and for Cyber City that usually means a weekday morning slot before you leave, an evening slot after you're back, or a weekend if you'd rather be there while the rug is lifted and the floor underneath is dealt with. If your building needs a visitor pass or the guard desk wants a name in advance, tell us when you book and we'll give you the collection person's details beforehand.

  **What actually happens to it**

  Wool, silk and hand-knotted rugs are treated by hand and by fibre, not put through a general machine cycle — nazuk cheezein, extra care. Machine-made and synthetic rugs take a different, firmer process. We count the pieces with you at the door, keep your order packed separately from everyone else's, and hand you a written receipt at pickup.
faqs:
- q: Can you collect from my building in Cyber City if I'm at work all day?
  a: Yes. Tell us a weekday morning or post-office evening slot, or a weekend if you'd prefer to be present.
    If your society or building requires a visitor pass or a name at the guard desk, share that when you
    book and we'll pass on our collection person's details in advance.
- q: I have one hand-knotted Persian rug, not a houseful. Is that worth booking?
  a: It is — single-rug jobs are most of what we do around Cyber City. Pickup and delivery are free across
    Gurugram whether it's one runner or several pieces.
- q: Will a silk or wool rug be washed the same way as a synthetic one?
  a: No. Wool, silk and hand-knotted rugs are handled by hand and treated according to the fibre and the
    dyes. Machine-made and synthetic rugs go through a firmer, different process. If you're unsure what
    yours is, send us a photo of the front and the reverse on WhatsApp at +91 63 67 600 500 and we'll
    tell you.
- q: I'm on a short posting and the rug isn't mine — it came with the flat. Can I still get it cleaned?
  a: Yes, tenants book with us regularly. Every order is counted with you at the door and acknowledged
    with a written receipt, so you have a record of exactly what left the flat and what came back.
