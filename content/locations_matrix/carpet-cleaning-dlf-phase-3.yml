body: |-
  Most carpet and rug enquiries we get from DLF Phase 3 arrive on a deadline that has nothing to do with the rug. Somebody is handing back a builder floor, a landlord is turning a unit around between tenants, or three flatmates sharing a professional rental are splitting up and nobody wants to argue about the state of the drawing-room rug in front of the security deposit. Being ten minutes from Cyber City means this happens constantly here — the churn is the whole story.

  So we plan around the move, not around the rug. Tell us your handover date and we collect early enough that the rug comes back before the packers arrive, not after. If you are already out and the landlord is holding the keys, we can collect from one address in DLF Phase 3 and deliver to another. Pickup and delivery are free, the count is done with you at the door, your order is packed separately from every other customer's, and you get a written receipt — useful when the person paying isn't the person handing it over.

  The rugs themselves split sharply by street. The older plotted houses bring us the real thing: wool, silk and hand-knotted Persian pieces that have been down for years, where colour bleed and fringe damage are the actual risks and the cleaning has to be gentle and dry-side. The builder floors and PGs bring machine-made polypropylene and viscose — spills, chai, dust from a road that never stops, shoe traffic through a shared hallway. Different fibres, different chemistry, same principle: safe on fabric, and eco-friendly solutions that won't leave residue in a room you sleep in.

  Third-floor walk-up with no lift? Say so when you book. We bring the rug down ourselves. Nazuk kapde ho ya bhaari carpet — the care is the same.
faqs:
- q: I'm vacating my DLF Phase 3 builder floor. Can you collect and then deliver to my new address?
  a: Yes. Give us the collection address and the delivery address when you book on +91 63 67 600 500 and
    we'll handle both. Plenty of DLF Phase 3 orders are collected from an old flat and returned to a new
    one, sometimes in a different sector entirely. Free pickup and delivery across Gurugram either way.
- q: My flat is on the third floor with no lift. Do I need to carry the rug down?
  a: No. Just mention it when you book so we send the right help. Rolled carpets are heavy and awkward
    on a narrow builder-floor staircase, and we'd rather do the carrying than have you drag it down alone.
- q: Do you handle hand-knotted Persian and silk rugs, or only machine-made ones?
  a: Both. Wool, silk, hand-knotted Persian and machine-made rugs are all cleaned here, but not by the
    same method. Silk and hand-knotted pieces need gentle, low-moisture handling to protect the dyes and
    the fringe; machine-made polypropylene and viscose can take a more thorough wash. Tell us what you
    have — or send a photo on WhatsApp — and we'll tell you what we'll do to it.
- q: I'm a landlord turning over a unit between tenants. Can the rug be collected when I'm not there?
  a: Yes, as long as someone can hand it over. We count the items at the door with whoever is present
    and issue a written receipt, so there's a record of exactly what was collected. That receipt tends
    to settle any later disagreement between outgoing tenant and landlord about condition.
