body: |-
  Most of the rug work we collect from Sectors 65 to 69 comes from flats that are still being settled into. A tower gets possession, families move in over a few months, and the fit-out work continues on floors above and below for a year afterwards. Fine civil dust travels. It gets into a new wool rug the way sand gets into a car mat, and because the flats are sealed and air-conditioned, it stays there instead of blowing out. The rug still looks fine. Then someone walks on it barefoot after a shower and the pile feels gritty.

  That is the single most common reason a Golf Course Extension Road rug reaches us, and it is why we dry-vacuum both faces before any water touches the rug. Washing a construction-dust rug without lifting the grit first just turns it into mud in the foundation.

  The second reason is material mismatch. A newly furnished flat here usually has one large machine-made rug in the living room — polypropylene or viscose from a furniture showroom — plus something older and better: a Persian, a wool dhurrie, a silk piece that came as a wedding gift or from a parent's house. These do not get treated alike. Viscose greys and stiffens if it is over-wetted. Silk and hand-knotted wool are washed by hand with the pile direction and dried flat, never hung.

  Collection is the practical part. High-rise pickup means a service lift, not a passenger lift, so we fix a slot with you rather than just a time window. A rolled 8x10 rug plus a sofa or mattress job on the same visit is a single lift booking instead of two. Our Sector 49 shop at Unitech Arcadia is the closer of our two Gurugram stores to this corridor. Pickup and delivery are free.
faqs:
- q: My flat was handed over recently and the builder's dust is everywhere. Should I wait until the fit-out
    work in my tower finishes before cleaning my rugs?
  a: If the drilling and civil work is still going on around you, yes — clean the rugs once the dust has
    stopped being generated, otherwise you will be doing it twice. In the meantime, keep the rug rolled
    rather than laid out, and avoid vacuuming aggressively with a beater brush, which pushes grit deeper
    into the pile. Once your floor is settled, send them across.
- q: How do you handle the big machine-made rug from the living room versus a Persian?
  a: Differently, and they are never processed together. Machine-made polypropylene and viscose rugs are
    the ones most likely to be damaged by well-meaning over-washing — viscose in particular goes grey
    and brittle if soaked. Hand-knotted Persian and wool pieces are washed by hand, with the pile, and
    dried flat. Every rug is tagged and kept separate from every other customer's order.
- q: I live on a high floor. How does pickup actually work?
  a: We coordinate a service lift slot with you rather than turning up in a window and hoping. Rugs are
    rolled at your door, counted with you, and you get a written receipt before anything leaves the flat.
    If you are also sending a sofa or mattress, tell us at booking and we do it in one visit — one lift
    booking, one gate entry.
- q: Can you do the sofa and mattress at the same time as the rugs?
  a: Yes, and for newly furnished flats on this stretch it is usually the sensible order — sofa and mattress
    on site, rugs taken away for a proper wash and controlled drying. Rugs are only returned once fully
    dry, because a rug that goes back damp into a closed, air-conditioned flat will smell within a week.
