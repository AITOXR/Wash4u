body: |-
  **The rug is the problem, not the room.** In a Golf Course Road apartment there is nowhere to clean a large rug properly. A hand-knotted Persian or a Kashmiri silk piece needs to be dusted dry, washed flat, rinsed until the water runs clear, then dried in controlled conditions before the pile is groomed back. None of that happens on a balcony or in a bathroom, and a rented steam machine run over wool by house help usually makes things worse — the pile mats, the dyes move, and the smell that follows a damp wool rug through a closed, air-conditioned flat is worse than the stain that started it.

  So we collect. Wash4You picks up from your door, free, and the rug is cleaned off site where it can be handled flat and dried fully.

  **What we actually see here.** Dining-room rugs with a slow ring of spills near one chair. Silk with a shine gone flat where a sofa leg sat. Fringes greyed while the field is still clean. Pale wool in a west-facing living room that has quietly turned the colour of the air outside. Machine-made polypropylene runners in the entrance foyer that take everything the lift lobby brings in. Each of these is a different job — silk and wool are not treated the same way, and we say so before we take the rug, not after.

  **Getting it out of the building.** Most towers here want the service lift, a gate pass and a name at the desk. Tell us the tower and we coordinate with your concierge or gate desk directly, so nobody needs to be chased. The rug is counted with you at the door, kept separate from every other customer's order, and you get a written receipt at pickup. *Nazuk kapde, extra care* — the same applies to what's on your floor.
faqs:
- q: Can you clean a silk or Kashmiri rug, or only wool?
  a: Both, but not in the same way. Silk is far more sensitive to water temperature, agitation and dye
    movement than wool, so it is handled separately and more gently. Tell us what the rug is — or let
    us look at it at pickup — and we will confirm what we can safely do before anything starts.
- q: Do you clean the rug in my flat?
  a: No. A rug cleaned in place cannot be rinsed properly or dried flat, and a Golf Course Road apartment
    has neither the drainage nor the floor space for it. We collect the rug, clean it off site and return
    it to your door.
- q: My tower needs a gate pass and the service lift booked. Will you handle that?
  a: Yes. Share the tower and your flat number when you book and we will coordinate with the gate desk
    or concierge for the pass and the service lift slot. Our team carries ID and works to whatever timing
    your building allows.
- q: The rug smells musty after the monsoon. Is that fixable?
  a: Usually, yes — that smell is moisture and soil trapped deep in the pile and backing, which surface
    vacuuming never reaches. It needs a full wash and, more importantly, a properly controlled dry. That
    is exactly why the rug has to leave the flat.
