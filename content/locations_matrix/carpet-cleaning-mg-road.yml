body: |
  **Two very different rugs come out of MG Road flats.**

  The first belongs to households who moved into the older blocks along this stretch decades ago, and the rug moved in with them — a Kashmiri wool piece, a silk-on-cotton Persian bought on one trip and never replaced, sometimes a family rug that predates the address entirely. These have hand-knotted foundations and natural dyes. They are the ones people are most nervous about handing over, and rightly so: the risk with an old wool or silk rug is never the dirt, it's dye bleed, a shrunk foundation, or fringes that come back frayed. We identify the pile and the backing before anything touches it, treat colour-fastness as a question to be answered rather than assumed, and clean silk and wool by hand.

  The second is the machine-made carpet in a service apartment or a let flat — polypropylene, wall-to-wall or large loose-laid, taking the foot traffic of a corridor that never stops. That work is usually triggered by a tenancy change, and it is a different job: grit lifted out of the pile, traffic lanes evened out, odour dealt with at the base rather than sprayed over.

  **Collection here needs planning, not just a slot.** A rolled 8x10 does not fit in an older lift, and the service lanes off the metro corridor are not places to stand a vehicle while somebody works out a route down four floors. So we agree the carry route and a fixed time before the pickup, not on the doorstep. Your rug is counted with you, tagged, kept separate from every other customer's order, and you get a written receipt before it leaves.

  Wool ho ya silk — the same rule applies: if we are not confident a rug will survive a process, we say so before we take it.
faqs:
- q: I have an old Kashmiri silk rug and I'm worried the colours will run. Will you take it?
  a: We test colour-fastness on the rug itself before cleaning, not on assumption. Silk and old wool are
    cleaned by hand. If the dyes are unstable enough that we can't clean it without risk, we tell you
    that instead of taking the job — an honest no is better than a ruined rug.
- q: The rug is on the fourth floor and won't fit in the lift. Is that a problem?
  a: No, but tell us when you book. Older blocks along MG Road commonly have lifts too small for a rolled
    large rug, so we plan the stairwell carry and fix a collection time in advance rather than working
    it out at your door. Parking on the service lanes is tight, so a fixed slot matters for both of us.
- q: We're changing tenants in a service apartment. Can you handle the wall-to-wall carpet?
  a: Yes. Heavy-traffic machine-made carpet is a different job from a hand-knotted rug — the focus is
    lifting embedded grit, evening out traffic lanes and dealing with odour at the base of the pile. Tell
    us the approximate area and whether it's fixed or loose-laid when you call.
- q: Do you collect rugs from MG Road, or do I bring them in?
  a: We collect. Free doorstep pickup and delivery covers Gurugram, including the MG Road corridor. If
    you'd rather hand it over in person, our Sushant Lok Phase I store at Vyapar Kendra, Sector 43, is
    the closer of our two counters.
