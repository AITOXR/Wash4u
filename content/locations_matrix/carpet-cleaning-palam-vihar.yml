body: |-
  **Palam Vihar is a house township, not a tower township** — and that changes what a rug means here. In a flat, a rug is decor. In a plotted house with a ground-floor drawing room, a staircase landing and bedrooms above, it is floor covering that lives under everything: shoes at the gate, children, a dog, and the ground-floor damp that creeps up through the slab every monsoon. By the time most Palam Vihar homes call us, the rug has already been beaten on the terrace and vacuumed twice, and the smell is still there. Beating does not fix damp. Washing does.

  **We sort by what the rug actually is before anything touches it.** A hand-knotted wool carpet — Kashmiri, Persian, Bhadohi — is checked for dye bleed on the reds and indigos first, because wool that felts or bleeds cannot be undone. Silk goes to solvent, never a wet wash. Machine-made polypropylene and viscose runners take a proper wet clean and come back genuinely bright. Wool is dried flat and slowly, so the weave does not distort; nobody should promise you a rug back overnight.

  **The practical bit: our stores are in Sector 43 and Sector 49, right across town from you.** So Palam Vihar collections are scheduled, not casual. Rolled carpets are bulky, and we send help to lift them out — you should not be dragging a 8x10 wool carpet to the gate yourself. Everything is counted with you at the door, packed away from every other customer's order, and you get a written receipt before the van leaves.

  **Most Palam Vihar households give us the whole room at once**, and that is the sensible way to do it: carpet, the long curtains that plotted houses have, sofa covers, blankets and heavy bedsheets, all collected on one trip. Ghar ke bhaari kapde, ek hi baar mein.
faqs:
- q: Will my hand-knotted wool carpet shrink or lose colour?
  a: That is exactly why we test first. Before any water, we check the dyes on the deepest colours for
    bleed and confirm the pile is wool rather than a wool-look blend. If a rug fails the bleed test, we
    tell you and clean it dry instead. Wool is then dried flat and slowly so the weave does not pull or
    shrink — rushed drying is what distorts a carpet, not washing.
- q: My rug smells damp after the monsoon even though it looks clean. Can that be fixed?
  a: Usually yes, and it is one of the most common things we collect from Palam Vihar. Ground-floor rooms
    in plotted houses hold moisture, and the smell sits in the backing and foundation threads where vacuuming
    and terrace-beating never reach. It needs a full wash and controlled drying right through the base,
    not a surface clean.
- q: The carpet is huge and heavy. Do I have to get it to the gate myself?
  a: No. Tell us the approximate size when you book and we send someone to help roll and lift it out.
    Free doorstep pickup and delivery covers all of Gurugram, Palam Vihar included.
- q: Can you take the curtains and sofa covers on the same trip?
  a: Yes, and most households here do. Long curtains, sofa covers, blankets and bedsheets can all go with
    the carpet in one collection. Everything is counted with you at the door and listed on your receipt,
    and your order is packed separately from every other customer's.
