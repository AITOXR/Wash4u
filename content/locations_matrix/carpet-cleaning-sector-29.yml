body: |-
  Sector 29 is where Gurugram goes out, and that shows up in its rugs. The floor coverings that suffer most here aren't the ones in quiet bedrooms — they're the ones in living rooms that host, in the entrance lobbies of the buildings around the market, and in the flats of people who come home at midnight and only see the red wine ring the next afternoon. Add the food that defines the area: oil-heavy gravies, turmeric, chilli, dropped canapés. A wool rug absorbs all of it and holds the smell long after the stain has faded.

  Fibre decides the method, not the stain. Hand-knotted wool needs a low-moisture approach and controlled drying, because saturating the foundation is what makes a rug go stiff and smell musty weeks later. Silk is tested first for dye bleed — the deep reds and indigos in a lot of Persian pieces will run into the ivory field if someone treats them like a bath mat, and that damage cannot be reversed. Machine-made polypropylene and viscose runners tolerate a heavier clean and often just need honest deep extraction and fringe attention.

  Collection here is a scheduling problem more than a distance problem. Around the market, evenings mean parking chaos and gridlock; mornings are quiet. So we pick up rugs in daylight hours, when your building's lift isn't competing with a Friday crowd. Rugs are rolled, tagged, and counted with you at the door, packed separately from every other customer's order, and you get a written receipt at pickup — because a rug is not something you want mixed up with anyone else's.

  Pickup and delivery are free across Gurugram. If you're hosting for a festival or a birthday and want the rug back before guests arrive, tell us when you book so we plan around your date rather than around ours.
faqs:
- q: My rug got soaked in red wine at a house party. Can it still be saved?
  a: Usually, yes — but the sooner we see it the better. Blot with a clean white cloth, don't scrub, and
    don't pour salt or soda on wool. Tannin stains set as they dry, and on a light wool field a fresh
    spill responds far better than one that has been walked on for a fortnight.
- q: Do you clean silk and Persian rugs, or only machine-made ones?
  a: Both. Silk and hand-knotted wool are handled differently from machine-made polypropylene or viscose
    — we test for dye bleed first and use a low-moisture method with controlled drying, so the foundation
    isn't saturated. Machine-made rugs and runners take a more thorough extraction.
- q: When can you collect from Sector 29? Evenings are impossible around the market.
  a: That's exactly why we prefer daytime collection here. Mornings and early afternoons are far easier
    for parking and lifts than a Friday or Saturday evening. Tell us your building and we'll suggest a
    slot that avoids the crowd.
- q: I have a large rug and a couple of small runners. Do they have to go together?
  a: No. Send whatever you want cleaned. Everything is counted with you at the door, tagged, and packed
    separately from other customers' orders, so a set stays together and comes back together with a written
    receipt from pickup to match against.
