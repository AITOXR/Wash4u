body: |-
  **Our Arcadia store is in Sector 49 itself** — AG-75, Ground Floor, Block-A, Unitech Arcadia. That matters more for rugs than for anything else we clean. A rug is the one item a laundry customer can't hand over at the door in a bag; it has to be rolled, carried down in the service lift, and signed out at the gate. Being a few minutes away on the Sohna Road side means we come to you for that, roll it and count it in front of you, and give you a written receipt before it leaves the building.

  Most of the work we see here comes from flats, not villas. In the mid and high-rise condominiums around Sector 49 and towards Uniworld Gardens and Nirvana Country, the rug is usually a 5x8 or 6x9 under a dining table or in front of a sofa — which means the damage is concentrated: chai and coffee rings, a toddler's food patch, oil marks near the kitchen edge, and pet traffic in one corner. Wool takes these differently from silk, and a machine-made polypropylene rug takes them differently again, so we test the pile and the dye before anything wet touches it.

  The other big trigger in Sector 49 is tenancy. This is a rental-heavy pocket, and rugs get cleaned at move-in, at move-out, or when a flat has been shut with the AC off through the monsoon and the pile has gone musty from underneath. Hand-knotted wool and Persian pieces are cleaned gently by hand and dried flat, never hung by the fringes. Machine-made rugs get a firmer treatment because they can take it. Nazuk kapde, extra care — the same rule applies to a silk rug.
faqs:
- q: Do I have to bring the rug to your Sector 49 store myself?
  a: No. We collect from your flat free of charge — that is the whole point of us being based in Unitech
    Arcadia. Our team rolls the rug at your door, counts it with you and hands over a written receipt
    before carrying it out. If your condominium requires a gate pass or a visitor entry for taking an
    item out of the block, tell us when you book and we will come with time in hand for it.
- q: My rug is under the dining table and only one patch is dirty. Is a full clean worth it?
  a: 'Usually yes, and here is why: spot-treating one area of a wool rug can leave that patch visibly
    cleaner and brighter than the rest of the pile, which looks worse than the stain did. We assess it
    when we collect. If a targeted treatment genuinely is the right call, we will say so.'
- q: Can you clean a hand-knotted Persian or silk rug?
  a: Yes. Those are handled separately from machine-made rugs — cleaned by hand, with the dyes tested
    first because natural dyes on older pieces can bleed, and dried flat rather than hung, so the foundation
    and fringes are not strained by the weight of water.
- q: I am moving out of my flat in Sector 49 and the landlord wants the rug cleaned. Can you return it
    to a different address?
  a: Yes, tell us at pickup. Move-in and move-out jobs are common around here, and we can return the rug
    to your new address in Gurugram or leave it at the old flat, whichever the handover needs.
