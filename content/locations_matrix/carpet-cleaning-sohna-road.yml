body: |-
  Most of the rugs we collect along the Sohna Road corridor come out of high-floor flats in the Sector 47–49 condominium belt, and almost none of them are rolled up and ready when we arrive. They are under a dining table, half beneath a sofa, or laid over vitrified tile in a living room that also gets the full dust load of a road that has been under construction, in one form or another, for years. That dust is the actual problem. Fine grit works down past the pile and sits at the base of the knots, where a vacuum never reaches it, and every footstep grinds it against the fibre. A wool rug that looks merely "dull" is usually a rug being sanded from underneath.

  So the first thing we do is dry-soil extraction before any water touches it — because wetting a dusty wool rug turns that grit into mud you then have to pull back out. Hand-knotted Persian and silk pieces are washed by hand, colour-tested first at the fringe, and dried flat rather than hung, so the foundation doesn't pull out of square. Machine-made and synthetic rugs take a more straightforward wet clean. Pet-owning households in the towers here are our most repeat customers, and for those the odour work matters more than the visible stain.

  Practically: our Sector 49 store is at AG-75, Unitech Arcadia, so we are already inside this corridor. Pickup is free and at your door. We count and photograph the rug with you before it leaves, note existing wear and any pre-existing damage on the receipt, and your pieces stay packed separately from every other customer's throughout. For tower flats, tell us the service-lift situation when you book — a 8x10 wool rug is a two-person carry and we'd rather plan it than negotiate it at your gate.
faqs:
- q: Do you collect rugs from high-rise flats in the Sector 47–49 condominiums?
  a: 'Yes, that is most of what we do on this stretch. Pickup is free and at your door. Two things help
    us: let us know at booking whether the tower allows service-lift use for large items, and clear whatever
    furniture is standing on the rug before we arrive. Our team rolls and wraps it in your home, not in
    the lobby.'
- q: My rug is Persian and I don't know if it's hand-knotted or machine-made. Does it matter?
  a: It changes the whole method, so yes. We check the back of the rug and the fringe at pickup — on a
    hand-knotted piece the fringe is the foundation of the rug itself, on a machine-made one it is stitched
    on. Hand-knotted wool and silk are hand-washed with colour-fastness tested first; machine-made rugs
    take a standard wet clean. You don't need to identify it yourself.
- q: Will you get the road dust out, or just the surface?
  a: The dust is the point of the job. We do dry-soil extraction before any water goes near the rug, because
    washing a grit-loaded wool rug just turns the grit to mud inside the pile. If your rug feels gritty
    when you press your palm into it, that is what needs removing and it is why the colour has gone flat.
- q: Do you handle rugs and carpets for offices along Sohna Road?
  a: Yes — the corridor is mixed commercial and we do collect from offices as well as homes. Loose rugs
    and runners come to us; tell us the size and material when you call. Everything is counted with you
    at collection and acknowledged with a written receipt, so there is a record on both sides.
