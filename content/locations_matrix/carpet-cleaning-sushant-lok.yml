body: |-
  **Our Vyapar Kendra store is inside Sushant Lok Phase I** — Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Rd, Block C, Sector 43. For most of Phase I that means your carpet does not go on a long ride to an unknown facility. You can walk in, unroll it on our counter, point at the patch that bothers you, and see the same piece again when it comes back.

  Sushant Lok is an old colony by Gurugram standards, and it shows in what people here actually own. Alongside the machine-made rugs from furniture showrooms, we see hand-knotted wool, Kashmiri and Persian silk, and dhurries that have been in the same builder floor or independent house for two or three decades. These are not the same job. Wool takes water and agitation very differently from silk, and an old vegetable-dyed border can bleed into an ivory field if someone treats it like a bedsheet. So we test colourfastness on a hidden corner before anything else, work dry-side on silk, and keep pile direction in mind while drying — dena hai toh poora dhyan se.

  The other Sushant Lok pattern is seasonal. Rugs come down from lofts and almirah tops when the weather turns, carrying storage creases, dust and a shut-cupboard smell, and go back up again in spring. That is the sensible time to get them cleaned — before storage, not after. Book early in the season rather than in the first cold week when everyone remembers at once.

  Collection is free and we handle the lift-less staircase problem ourselves: two people, rolled properly, counted with you at the door, packed separately from every other customer's order, written receipt in your hand. Fabric sofas and floor cushions in the same room can go along with it.
faqs:
- q: Can you clean a hand-knotted Persian or Kashmiri silk rug?
  a: Yes. Silk and hand-knotted wool are handled separately from machine-made rugs — we check the foundation
    and the dyes for colourfastness on a hidden corner first, and work dry-side on silk rather than soaking
    it. If a piece is too fragile or already damaged to clean safely, we will tell you that instead of
    taking it.
- q: I live on the third floor of a builder floor with no lift. Is that a problem?
  a: No. A rolled 8x10 wool carpet is a two-person job and we plan for it. Our team rolls it at your door,
    carries it down, and brings it back up the same way. You do not need to move it to the gate yourself.
- q: Should I clean the carpet before putting it away for the summer, or after taking it out?
  a: Before storing it. Dust and body soil left in the pile through months in a loft is what causes that
    shut-cupboard smell and attracts insects. Cleaning it on the way out of use is better for the rug
    than cleaning it on the way back in.
- q: Can I bring the rug to the shop myself instead of booking a pickup?
  a: Yes — the Vyapar Kendra store is in Sushant Lok Phase I, Sector 43, so many residents simply carry
    smaller rugs across. Either way you get a written receipt. Pickup and delivery are free across Gurugram
    if you would rather not handle it.
