body: |-
  Curtains in and around Cyber City work harder than curtains anywhere else in Gurugram. A lot of the flats here are rented by people on US and UK shifts — logging off at 4am and then trying to sleep through a Gurugram morning behind floor-to-ceiling glass. The blackout layer is doing a real job, and when it goes grey and starts smelling of dust and cooking, you notice it at 9am with the sun coming through.

  That is most of what we collect here: heavy blackout drapes, the sheer under-layer, and the odd set of office-style panels from a small studio or co-working floor. Blackout fabric is coated on the back. Wash it wrong and the coating cracks, goes patchy, and stops blocking light — which is the whole reason you bought it. We treat it as a specialist item, not a bedsheet, and we say so before we take it down. Sheers are the opposite problem: light, easy to distort, easy to hem-shrink. Different handling, same booking.

  Takedown and rehang is included, and that is the part that actually needs planning in Cyber City. Most tenants here are not home between 9 and 8, and a hook-by-hook rehang is not something to leave to a security guard. We fix an early-morning slot before you leave for the office, or a weekend window. The panels are counted with you at the door, packed separately from every other customer's order, and you get a written receipt — which matters when a set has four or six panels and two rods.

  The other reason people call us here is a lease ending. Expat and single-professional tenants moving out want curtains handed back clean for the deposit conversation. Book that before the packers come, not after the rods are already down.

  Free pickup and delivery, across Gurugram.
faqs:
- q: Can you clean blackout curtains without ruining the coating?
  a: Yes — blackout panels are handled as a specialist item because the light-blocking layer is a coating
    on the reverse, and the wrong process cracks or patches it. We check the backing and the label with
    you at pickup and tell you honestly if a panel is already failing before we take it.
- q: Nobody is home during office hours. How does takedown work?
  a: We fix an early-morning slot before you leave for work, or a weekend window. Takedown and rehang
    are done by our team, hook by hook, with you or your help present — we do not leave rods and panels
    for a guard or a neighbour to sort out.
- q: I'm moving out of my Cyber City flat. When should I book?
  a: Before the packers arrive, while the curtains are still up and we can measure and take them down
    properly. Once everything is off the rods and stuffed in a carton, panels get creased and mixed up,
    and it is harder to hand a clean set back for the deposit check.
- q: Can you do sheers and heavy drapes in the same order?
  a: Yes, and they are processed separately because they need different handling — sheers distort and
    shrink easily, heavy drapes need weight-appropriate care. Both are counted with you at the door and
    returned in the same delivery, with a written receipt listing every panel.
