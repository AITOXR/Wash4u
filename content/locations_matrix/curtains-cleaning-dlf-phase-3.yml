body: |-
  Most curtain enquiries from DLF Phase 3 start with a date rather than a stain. Somebody is moving out of a builder floor, a new tenant is moving in next week, or a shared flat is changing one occupant — and the curtains are the one thing in the house nobody has taken down since they were hung. Because so much of Phase 3 is rented in and out around Cyber City job cycles, curtains here often outlast three sets of tenants. They are usually far dirtier than anyone expects until they are off the rod.

  Two things show up again and again. Sheers on the front-facing rooms go grey rather than stained, from steady road dust off the roads feeding Cyber City. And blackout curtains take a beating in flats where somebody works a US or UK shift and sleeps through the day — heavy fabric, drawn constantly, holding smells from a kitchen that is rarely more than a few feet away. Older plotted houses in the same blocks are a different job again: long, lined drapes that are genuinely heavy once dropped.

  Practically, we take them down and rehang them ourselves, which matters when the rod is above a stairwell landing or a tall builder-floor window with no lift in the block. Hooks, rings and runners are counted with you at the door and go back the way they came. Everything is bagged separately from other customers' orders and you get a written receipt at pickup — useful when the handover is being coordinated with a landlord, a caretaker or a flatmate rather than you.

  One honest thing to plan for: your windows are bare while the curtains are with us. In ground-floor and first-floor flats here, pick a stretch where that suits you. Do read our curtain cleaning policy page before booking.
faqs:
- q: Do you take the curtains down and put them back up?
  a: Yes. Takedown and rehang are part of the job. In DLF Phase 3 a lot of blocks are walk-ups with high
    windows or rods over a stairwell landing, so this is not something we expect you to manage yourself.
    We just need someone to let us in at both ends.
- q: I'm moving out and the curtains belong to the landlord. Can they be handed over separately?
  a: Yes, and it happens often here. Tell us at pickup who is receiving them. Your order is counted with
    you, packed separately from every other customer's, and acknowledged with a written receipt, so a
    landlord, caretaker or incoming tenant can take delivery without confusion.
- q: Will heavy blackout curtains be treated differently from sheers?
  a: They have to be. Blackout linings and light sheers behave nothing alike in cleaning, and lined drapes
    from the older plotted houses in Phase 3 are heavier again. We assess each set on collection and tell
    you what we can and cannot do before it leaves your house.
- q: What happens to hooks, rings and the runners?
  a: They are counted with you at the door and returned the same way, so the set goes back on the rod
    exactly as it came off. If anything is already broken or missing when we take the curtains down, we
    flag it then rather than at delivery.
