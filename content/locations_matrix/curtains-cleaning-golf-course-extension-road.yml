body: |-
  **The curtains in most flats here have never been washed.** Golf Course Extension Road is a possession corridor — Sectors 65 to 69 are full of towers handed over in the last few years, where an interior contractor hung the drapes on day one and nobody has taken them down since. Two or three years of that, plus the fine grey dust that drifts off the sites still under construction along the road, and the bottom eighteen inches of a cream sheer tells the whole story.

  We take them down ourselves. Double-height living rooms in these towers mean tracks well above ladder-reach, eyelet panels heavy enough to need two people, and blackout linings in the kids' room that have to come off the hooks without tearing the header tape. Each panel is counted with you at the door, tagged by room, and packed separately from every other customer's order — so the four sheers from the living room don't come back mixed with the study's.

  **Sheers, blackouts and heavy drapes are not one job.** Polyester sheers with sewn-in lead weights, cotton-blend curtains that will shrink and hang short if handled carelessly, and lined blackouts that must not lose their coating — we sort and treat these separately, and we tell you upfront if a fabric shouldn't be washed at all rather than returning it ruined. Our curtain care policy covers what we will and won't take on.

  Pickup and rehang are free, anywhere along the Extension Road stretch. Most families here are two working adults, so we work around that — we'll come when someone is actually home, clear the gate pass with your tower's security, and put everything back on the track ourselves. If your sofa and mattress are also on their first clean since possession, say so at pickup and we'll do the room in one visit.

  *Naye ghar ka pehla proper clean.*
faqs:
- q: Do you take the curtains down and put them back up yourselves?
  a: Yes. Takedown and rehang are part of the service and are included in the pickup. High tracks in double-height
    living rooms are common in these towers, so we come with the right ladder and enough hands to lift
    heavy eyelet and blackout panels without dragging them off the hooks.
- q: My curtains have not been washed since possession. Can they still be saved?
  a: Usually, yes. Settled construction dust and street grime along the Extension Road corridor sit on
    the surface of the fabric far more than they stain it. Bring us one panel first if you'd rather see
    the result before committing the whole flat — we're happy to do that.
- q: Will my curtains shrink and end up hanging short?
  a: That's the main risk with cotton-blend and lined drapes, which is why we sort by fabric and lining
    before anything is processed. If a panel is not safe to wash, we will tell you at pickup rather than
    return it shorter than the window. Our curtain cleaning policy page sets out what we accept.
- q: Both of us work. When can you collect?
  a: Tell us the slot that works and we'll plan around it, including evenings and weekends. We'll also
    sort out the gate pass with your tower's security in advance so the team isn't held up at the lobby.
    Call or WhatsApp +91 63 67 600 500.
