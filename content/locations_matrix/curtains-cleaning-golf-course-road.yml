body: |-
  Almost every curtain job we take on Golf Course Road starts the same way: a living room with glass running from floor to ceiling, sometimes double height, dressed in a lined blackout drape with a sheer behind it. Nobody in a tower like that takes their own curtains down. The track sits well above head height, the panels are heavy once lined, and one wrong pull on a pelmet means a carpenter, not a laundry.

  So the work is really two jobs. First the takedown — our team brings its own ladder, unhooks panel by panel, and photographs how each one sits on the track before anything moves, because a master bedroom bay and a guest room window are rarely hung the same way. Panels are counted with you at the door, tagged by room, and packed separately from every other customer's order. You get a written receipt at pickup, which matters when eighteen panels leave a flat at once.

  Then the cleaning itself. Sheers, tissue-thin and often silk or a fine polyester voile, are handled quite differently from a rubber-backed blackout or a heavy embellished drape with beadwork or a tasselled lead edge. Nazuk kapde, extra care — that applies as much to a ₹-serious drapery panel as to a saree. Blackout backing is the one that punishes a careless process; treat it like a normal curtain and it cracks.

  Rehang is included and booked as a second visit, so your windows aren't bare for long. Practically, high-rise work here means we coordinate with the gate desk and the estate office, register the team, and book the service lift in advance rather than turning up and hoping. Quiet, uniformed, in and out. Free pickup and delivery across Gurugram, and both our stores — Sushant Lok Phase I and Unitech Arcadia, Sector 49 — are a short run from the corridor.
faqs:
- q: Do you take the curtains down and put them back up yourselves?
  a: Yes. Takedown and rehang are both part of the service and both are done by our team, with our own
    ladder. In high-rise flats on Golf Course Road the tracks are usually well out of reach, so this isn't
    something we expect you to handle. We photograph how each panel is hung before it comes down and tag
    it by room, so it goes back exactly as it was.
- q: How do you handle the society gate and the service lift?
  a: We ring ahead and coordinate with the gate desk or estate office, share the team's details for registration,
    and book a service lift slot where the building requires one. Most towers along the corridor need
    entry logged in advance; we'd rather arrange that than have a team turned away at the boom barrier.
- q: My sheers and my blackout drapes are hung together. Can they be cleaned at the same time?
  a: They come away together and come back together, but they are not processed together. A fine sheer
    and a rubber-backed blackout panel need different handling — blackout backing in particular can crack
    or peel if it is treated like an ordinary curtain. We separate them at the counting stage and process
    each on its own.
- q: Some of my drapes have beadwork and tassels. Is that a problem?
  a: No, but tell us at pickup and we'll note it on the receipt. Embellished panels, beaded lead edges
    and tasselled tiebacks are inspected and handled by hand rather than run through anything that would
    stress the trim. If a panel has an embellishment we don't think will survive cleaning, we'll say so
    before we take it, not after.
