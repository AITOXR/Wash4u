body: |-
  **Curtains on the MG Road corridor collect road, not just dust.**

  This is one of the oldest continuously built-up stretches in Gurugram, and it is a working road: metro traffic overhead, retail frontage at ground level, and flats and service apartments sitting directly above and behind it. Windows here face moving vehicles all day. What settles on a sheer isn't household dust — it's fine grey road soot, and it greys the fabric evenly, so people usually don't notice until they take one panel down and hold it against a fresh one.

  Two kinds of homes call us from here. The older established flats, where heavy lined drapes have hung on the same rods for years and have gone stiff and heavy at the hem. And the service apartments along the corridor, where blackout curtains take a beating from constant opening and closing between guests and need turning around as a set, not panel by panel.

  We handle the takedown and the rehang ourselves. Hooks, rings and runners come off, get counted with you, and go back the same way they came down — nobody in a fourth-floor flat should be on a stool with an armful of wet drape. Sheers, cotton, blackout linings and heavy lined drapes are each treated to their own method, because a sheer that's been washed like a drape comes back with a puckered header.

  One local note: kerbside stopping near the metro stations and market frontage is tight. We fix a pickup slot with you rather than turning up, so the van isn't parked while someone hunts for the right gate. Our Sector 43 store at Vyapar Kendra is a short run from the corridor, which makes the takedown and rehang visits easy to schedule close together.

  Free pickup and delivery, and a written receipt at the door.
faqs:
- q: Do you take the curtains down and put them back up?
  a: Yes. Takedown and rehang are part of the service. We remove hooks, rings and runners, count everything
    with you at the door, and refit the panels the same way they came down. You don't need to handle a
    ladder or a wet drape.
- q: My sheers look grey rather than dirty. Is that road dust?
  a: Along MG Road it usually is. Fine traffic soot settles evenly across a sheer, so it dulls the whole
    panel instead of leaving marks. It responds well to the right wash — the difference is easiest to
    see when the cleaned panel goes back next to an uncleaned one.
- q: We run a service apartment. Can you do all the blackout curtains as one set?
  a: Yes, and we'd recommend it. Blackouts age unevenly if you clean them piecemeal. Every order is packed
    separately from every other customer's order, so a whole apartment's set stays together and comes
    back together.
- q: Where do you park for pickup on MG Road?
  a: We book a slot with you rather than arriving unannounced, because kerbside stopping near the metro
    stations and the market frontage is restricted. Tell us the gate and the best window, and we'll work
    to it. Our Sector 43 store at Vyapar Kendra is close by, so scheduling the takedown and the rehang
    visit is straightforward.
