h1: Curtain Cleaning in Palam Vihar, Gurugram
lede: Palam Vihar is a township of independent houses, which means curtains by the dozen rather than by
  the room — and a takedown job that needs a ladder, not a chair.
body: |-
  Most of our Palam Vihar work is not one pair of curtains. It is a whole house at once: the drawing-room drapes with their bonded lining, the sheers on the front windows that face the road, blackouts in the bedrooms upstairs, and the stairwell panel nobody has taken down since it was hung. Plotted houses here run two and three floors with tall openings, so drops are longer and heavier than anything in a flat, and the hardware above them is often original — old brackets, wooden pelmets, rings that have seized on the rod.

  That is why we do the takedown ourselves rather than asking you to. Curtain cleaning includes free removal and reinstallation, and our team unhooks, labels and re-hangs each panel in the room it came from. Where a rod, bracket or fixture is already weak or damaged, we will show it to you before we touch it — we would rather reschedule than pull a fitting out of the plaster. Sheers, cotton, blackout linings and heavy drapes are separated and treated by what they actually are, not lumped together.

  Since we are already inside the house with a ladder, this is the sensible visit to hand over the rest of the household textiles too: sofa covers and cushion covers, winter blankets and quilts coming out of or going into storage, bedsheets and table linen. Everything is counted with you at the door, packed separately from every other customer's order, and acknowledged with a written receipt at pickup.

  Free pickup and delivery across Palam Vihar, from our Sector 43 and Sector 49 stores. *Ghar bhar ke parde* — the whole house's curtains — in one collection.
faqs:
- q: Do I have to take the curtains down myself before pickup?
  a: No. Curtain cleaning includes free removal and reinstallation. Our team comes with the equipment,
    unhooks and labels each panel, and re-hangs them where they belong. For the tall drawing-room and
    stairwell windows common in Palam Vihar houses, this is the part most people would rather not attempt
    on a stool.
- q: What if my curtain rods or brackets are old and loose?
  a: We check the fixtures before we start and point out anything already weak, cracked or pulling away
    from the wall. Wash4You is not responsible for rods, brackets or fixtures that were faulty or damaged
    before service, so we would rather flag it and let you get it fixed than force a panel down.
- q: Are blackout curtains and sheers cleaned the same way?
  a: No. Blackout linings, sheers, cotton panels and heavy lined drapes each behave differently in cleaning,
    so they are sorted and processed separately based on the care label, or on professional judgement
    where the label has worn off. Full stain removal is never guaranteed on any fabric, and we will tell
    you honestly if a mark looks set.
- q: Can you collect sofa covers, blankets and bedsheets on the same visit?
  a: Yes, and in Palam Vihar most households do exactly that. Since the team is already at your gate for
    the curtains, add the sofa and cushion covers, blankets, quilts and bed linen to the same order. Everything
    is counted with you at the door and listed on your receipt.
