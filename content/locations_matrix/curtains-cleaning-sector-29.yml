body: |-
  Sector 29 is the one part of Gurugram where the street stays awake. Flats, service apartments and older builder floors sit within a few hundred metres of the restaurant strip and Leisure Valley, and the curtains in those homes are doing real work — blocking light, dulling noise, and taking the brunt of everything the road throws up. That shows up in a very particular way. Blackout linings here are usually the first to go: the coated backing holds cooking smells and traffic grime, and because it never faces the room, most people don't notice until the panel is pulled down. Sheers along the road side grey off at the bottom third where the dust settles.

  Wash4You handles the whole job, not just the wash. We take the panels down ourselves, note the hook spacing and panel order before anything comes off the track, and count everything with you at the door — hooks, rings, tiebacks and weights included. Sheers, cotton drapes and lined blackout panels are treated separately, because the lining decides the method, not the face fabric. Your order stays packed apart from every other customer's, and you get a written receipt at pickup. Heavy interlined drapes and anything with a rubberised back are assessed before we accept them; our curtain cleaning policy page sets out what we will and won't take on.

  One local thing worth planning around: Sector 29 is close to impossible for a vehicle on Friday and Saturday evenings. Weekday mornings are the easy slot for both takedown and rehang, and we'll return and hang the panels rather than leaving you a bagged pile. Pickup and delivery are free across Gurugram, and our Sector 43 store at Vyapar Kendra is a short run from Sector 29.
faqs:
- q: Do you take the curtains down and put them back up?
  a: Yes. Takedown and rehang are part of the job in Sector 29. We photograph or note the hook spacing
    and panel order before removing anything, so the drape falls the same way when it goes back on the
    track.
- q: My blackout curtains smell of food from the street rather than looking dirty. Can that be treated?
  a: This is the most common curtain request we get from Sector 29. Odour usually sits in the blackout
    lining, not the face fabric, so we assess the lining first and treat accordingly. Bring it up at pickup
    and we will tell you honestly what the fabric will take.
- q: When can you collect from Sector 29?
  a: Weekday mornings are easiest. The area gets heavily congested on Friday and Saturday evenings and
    a vehicle carrying long panels is not practical then. Call or WhatsApp +91 63 67 600 500 and we will
    fix a slot that works.
- q: Will my windows be bare while the curtains are away?
  a: Yes, so it is worth planning for — especially on the road-facing side where light and street activity
    carry late into the night. Many customers in Sector 29 send one room at a time for this reason, and
    we are happy to work that way.
