body: |
  Sushant Lok Phase I is where our Vyapar Kendra store actually sits — Gate No. 3, Shop No. 180, GF Shushant, Sector 43. For curtains that matters more than it does for a shirt. Curtains are the one thing we clean that requires someone to come into your house twice: once with a ladder to take them down, once to put them back on the same hooks, in the same order, at the same drop. When the shop is inside the colony, that second visit is not a logistics problem.

  Most of the curtain work we see in Phases I to III comes from long-settled homes — builder floors and independent houses where the drapes were stitched to fit and have not come down in years. Road-facing rooms along the Vyapar Kendra stretch and the internal colony roads collect a grey film on the top third of the panel that people stop noticing until the curtain is on the floor next to a clean one. We handle sheers, cotton and blackout linings, and heavy lined drapes, each grouped by weight and colour rather than by which window they came from — and, like every Wash4You order, kept packed apart from every other customer's.

  Takedown and rehang are included, no separate charge. Our technician brings his own steps. One honest caution: older brackets and wooden rods in these houses are often held by plugs that have loosened over the years, and where a fixture is already weak or faulty we cannot take responsibility for it giving way — we will show you before we touch it. Scheduling depends on technician availability, so book the takedown slot rather than assuming same-day.

  *Ek baar utaar ke dekhiye* — the difference is usually visible on the hem first.
faqs:
- q: Do I have to take the curtains down myself before pickup?
  a: No. Removal and reinstallation are included free with curtain cleaning. Our technician comes with
    his own steps, takes the panels down, notes which window each set belongs to, and rehangs them after
    cleaning. From Sushant Lok Phase I it is a short run to and from the Vyapar Kendra store, so the two
    visits are easy to line up.
- q: My rods and brackets are quite old. Is that a problem?
  a: It is worth flagging before we start. In many of the older Sushant Lok houses the brackets are wall-plugged
    and have loosened over the years. Our technician will point out anything that looks weak and get your
    go-ahead first. Where a rod, bracket or fixture is already faulty or damaged before service, Wash4You
    cannot be held responsible if it gives way — that is set out in our curtain cleaning policy.
- q: Can sheers and heavy blackout drapes from the same room be done together?
  a: They are collected together and returned together, but they are not processed together. Sheers, cotton
    linings and heavy lined drapes take different handling, so we group by fabric weight and colour. Everything
    from your home stays packed separately from every other customer's order and comes back as one set.
- q: Can I just walk my curtains into the Sector 43 shop instead?
  a: Yes — plenty of Sushant Lok residents do, since the store is inside the colony at Gate No. 3, Shop
    No. 180, Vyapar Kendra Road. You will get a written receipt with the count at the counter. If you
    would rather not carry them down, call or WhatsApp +91 63 67 600 500 and we will send someone to take
    them off the rod instead.
