body: |-
  **The Cyber City laundry problem is a shirt problem.**

  Five office shirts a week, a couple of trousers, gym kit that comes off damp and sits in a bag until Sunday. Nobody in a Cyber City tower is running a colour wash on a Tuesday. The load builds through the week and then eats the weekend — which is exactly the time you didn't want to spend on it.

  Our wash-and-fold runs by weight for the everyday pile and by piece when you'd rather have shirts handled individually — collars and cuffs pre-treated, then pressed and hung rather than folded flat, because a shirt that arrives folded is a shirt you still have to iron before Monday. Deodorant marks under the arms, coffee down the front from the 11 a.m. run, sweat at the collar after a walk between towers in May: those are pre-treated before the wash, not after, which is when they set for good.

  **Timing is the real difference here.** A residential pickup slot at 11 a.m. is useless if you're at your desk from nine. We work Cyber City around office hours — a weekday collection before you leave or after you're back, or a handover at your building's reception or security desk if you'd rather not wait at the door. Tell us which on WhatsApp and the rider works to it.

  Your order is counted with you at handover, bagged separately from every other customer's — no shared drums, no mixed baskets — and you get a written receipt at pickup, so a missing shirt is a fact we can check rather than an argument. Detergents are eco-friendly and gentle enough for fine cotton and linen shirting.

  Pickup and delivery are free across Gurugram. Our Sushant Lok Phase I store in Sector 43 is the closest counter to Cyber City if you'd rather drop in yourself.
faqs:
- q: Can you collect from my office building instead of my flat?
  a: Yes. If you work in a Cyber City tower, we can collect and return at the reception or security desk
    rather than making you wait at a door. Message us on WhatsApp at +91 63 67 600 500 with the tower,
    floor and the window that suits you, and the rider will work to it.
- q: Will my office shirts come back folded or on hangers?
  a: Tell us and we'll do it your way. Most Cyber City customers ask for shirts pressed and hung so they
    go straight into the wardrobe ready to wear; the rest of the load — t-shirts, gym kit, innerwear,
    towels — comes back folded.
- q: Is my laundry washed together with other people's?
  a: No. Every order is counted with you at the door, kept and packed separately from every other customer's
    order, and acknowledged with a written receipt at pickup. Nothing goes into a shared basket.
- q: I travel for work and my pickup day keeps changing. Is that a problem?
  a: Not at all. There's no fixed subscription day — you message us when the pile is ready and we come.
    A lot of our Cyber City customers are on the road half the month and order in bursts rather than weekly.
