body: |-
  DLF Phase 3 runs on rented rooms. Builder floors let out room by room, PG accommodation, two and three people sharing a flat because the walk to Cyber City is short enough to do in office shoes. Almost none of that housing comes with a washing machine you actually control. There's one machine on the landing shared by six people, or none at all, and a balcony already full of somebody else's drying.

  That's what wash and fold is for here. Not delicate treatment of one precious garment — the weekly pile. Office shirts and chinos, gym kit that can't sit damp in a bag until Sunday, bedsheets and towels that a PG doesn't change for you. We collect it, wash it, dry it properly, fold it and bring it back to the same door.

  The part that matters most in shared housing is the boring part. Your load is counted with you at the door and you get a written receipt for it right then. It is then washed and packed separately from every other customer's order — nothing of yours goes into a drum with a stranger's clothes, and nothing comes back that isn't yours. Anyone who has lost a shirt to a flatmate's laundry heap knows why that's worth saying out loud.

  Phase 3 also moves. People shift blocks, change flats, change cities. Pickup and delivery are free across Gurugram, so when you move down the road you tell us the new floor and nothing else changes. And if the door is shut because you're still at the office, WhatsApp us on +91 63 67 600 500 and we'll fix a time that works — evenings included.

  Eco-friendly detergents, gentle on fabric, and clothes that come back ready to wear rather than ready to iron.
faqs:
- q: I share a flat in DLF Phase 3 with two other people. Can we send our clothes together?
  a: You can, but we'd suggest booking separately. Every order is counted with the customer at the door,
    given a written receipt and packed apart from every other order, so separate bookings mean nothing
    gets mixed up between flatmates on the way back.
- q: My PG doesn't allow delivery people past the gate. How does pickup work?
  a: That's common across Phase 3. Just tell us on WhatsApp and we'll meet you at the gate or the main
    door instead of coming up. We'll still count the load with you and hand you the receipt there.
- q: Do you take bedsheets and towels, not just clothes?
  a: Yes. Sheets, pillow covers and towels are a big part of what we collect in Phase 3, especially from
    PGs and shared flats where nobody's changing them for you.
- q: I'm moving to a different block within Phase 3 next month. Do I need to do anything?
  a: Just send us the new address on WhatsApp before your next pickup. Free pickup and delivery covers
    all of Gurugram, so a move within Phase 3 changes nothing else about your service.
