body: |-
  Wash and fold on Golf Course Road is rarely just wash and fold. A single bag from an Aralias, Magnolias, Park Place or Central Park flat usually holds three different things at once: gym and office cottons that only need a clean, kidswear that needs a proper hot handling, and one or two pieces that should never have gone in the bag at all — a sequinned kurta, a beaded dupatta, a silk-blend shirt, a hand-embroidered stole. Most of the damage we see in this corridor happens because those last few pieces travelled with the everyday load.

  So the sorting happens with you, at your door, before anything leaves. Your order is counted in front of you, embellished and delicate pieces are pulled out and routed to hand or specialist care instead of the volume wash, and you get a written receipt for what we took. Your load is then kept packed separately from every other customer's — which matters more than it sounds when four flats in the same tower are all sending laundry out on a Monday.

  The other Golf Course Road reality is the gate. Towers here run on concierge and gate-desk protocol, and residents are often in a Cyber City or Udyog Vihar meeting when the pickup window lands. We coordinate with the front desk or your house help, take the bag from wherever you have asked us to take it, and return it the same way — counted again, folded, and shelf-ready. No calls at eleven in the morning asking you to come down.

  Pickup and delivery are free across Gurugram. **Nazuk kapde, extra care** — the delicate things get treated as delicate things, and the everyday load gets on with being everyday. Eco-friendly detergents throughout, safe on fabric, and on time.
faqs:
- q: I have designer and embellished pieces mixed in with my regular laundry. Do I need to separate them
    myself?
  a: No. We sort with you at the door. When we count your order in front of you, anything embellished,
    beaded, sequinned or delicate is set aside and routed to specialist or hand care rather than the wash-and-fold
    load. If you would rather flag those pieces yourself, tell the pickup executive and we will note them
    on the receipt.
- q: Can you collect from the tower gate or concierge desk instead of my flat?
  a: Yes. Most Golf Course Road pickups run through the gate desk or with house help. Tell us on WhatsApp
    where the handover should happen and we will follow that for both pickup and return. The count and
    the written receipt still happen at handover, whoever is receiving on your behalf.
- q: How do I know my clothes are not mixed with someone else's from the same building?
  a: Every order is packed and processed separately from every other customer's, with no shared bundling.
    That holds whether your neighbours use us or not — your bag comes back as your bag.
- q: Where are you based, and do you cover the whole Golf Course Road stretch?
  a: Our stores are in Sushant Lok Phase I (Sector 43, Vyapar Kendra) and Unitech Arcadia (Sector 49)
    — both minutes from the corridor. Free pickup and delivery covers the full Golf Course Road stretch.
    Call or WhatsApp +91 63 67 600 500 to book.
