body: |-
  **Wash and fold on MG Road is mostly a space problem, not a cleaning problem.**

  The MG Road corridor is old Gurugram: established buildings put up long before anyone designed a utility balcony, plus a heavy layer of service apartments and shared flats around the metro stations and the retail stretch. A washer-dryer stack rarely fits. Where one does fit, the drying rack ends up in the living room. Kapde bahut, jagah kam — plenty of clothes, not much room to deal with them.

  So the everyday laundry here arrives in bags, not in ones and twos. Two weeks of office shirts and gym kit from someone on a company let. Bedsheets and towels from a household that changes linen weekly and simply cannot dry them indoors from July to September. Bath mats, curtains, kids' school clothes. Wash and fold by weight or by piece is built for exactly that: the volume load, washed properly, dried properly, folded and returned ready to put away.

  Two things matter more here than they do elsewhere in Gurugram. First, sorting. Shared flats and family households send mixed bags, and everything gets counted with you at the door and kept packed separately from every other customer's order — your receipt is written at pickup, so nothing floats between bags. Second, access. MG Road buildings mean older lifts, guard registers, and no real parking. Our team collects at your door rather than expecting you to carry a bag down, and we work around service-lift timings where a building has them.

  Free pickup and delivery, right across the corridor. Our Vyapar Kendra store at Sector 43 is the closer of our two Gurugram shops if you'd rather drop in and see how we handle things first.
faqs:
- q: I'm in a service apartment on MG Road for a few months. Can you do a regular weekly collection?
  a: Yes. Plenty of our MG Road wash-and-fold customers are on company lets or short stays and prefer
    a fixed weekly bag rather than booking each time. Tell us a day and a rough time on WhatsApp at +91
    63 67 600 500 and we'll keep collecting until you tell us to stop.
- q: Can you take bedsheets, towels and bath mats along with clothes, or do those go separately?
  a: They can go in the same collection, but we wash household linen separately from your wearables —
    different loads, different handling. It all comes back to you together, folded.
- q: My building has an old lift and the guard doesn't allow delivery staff past the gate. Does that work?
  a: It does. This is normal across the MG Road stretch. Our team will collect and return at whichever
    point your building allows, and count the order with you there so the handover is clear either way.
- q: How do I know a sock or a shirt hasn't ended up in someone else's bag?
  a: Every order is counted with you at the door and given a written receipt at pickup, and your clothes
    stay packed apart from every other customer's order through the whole process. If a count doesn't
    match at delivery, we'll sort it out.
