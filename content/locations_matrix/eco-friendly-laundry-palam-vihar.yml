body: |-
  Palam Vihar is houses, not towers. Two, three and four bedrooms on a plot, a terrace, a drawing room with heavy curtains, and cupboards that hold far more fabric than a builder flat ever does. That changes what a laundry pickup here actually looks like. In most of Gurugram the bag is shirts and trousers. In Palam Vihar it is just as often eight bedsheets, four sets of curtains taken down room by room, sofa covers, a stack of towels, and two blankets that have been folded away since March.

  Wash4You collects all of it in one go — poora ghar ek saath. Everyday clothes go through our wash-and-fold service and come back folded and sorted. Household textiles get handled for what they are: curtains checked for lining and hooks before they go in, blankets and quilts given the space they need rather than being crammed in with a family's clothes, bedsheets returned pressed flat and stacked by size so they go straight back into the almirah.

  Two things matter more on a bulk household load than on a small one. First, the count. Every order is counted with you at the door and you get a written receipt at pickup — with forty pieces going out, nobody should be relying on memory. Second, separation. Your load is washed and packed apart from every other customer's, so a neighbour's curtains never end up in your bundle.

  Palam Vihar sits on the far west side, away from our Sector 43 and Sector 49 stores, so collection here runs as a scheduled doorstep pickup rather than a counter drop-off. Tell us the block and house number, and pickup and delivery are free — same as everywhere else we cover in Gurugram.
faqs:
- q: Can you collect curtains and blankets along with our regular wash-and-fold load?
  a: Yes. That is the most common kind of pickup we do in Palam Vihar. Everyday clothes, bedsheets, towels,
    curtains, sofa covers and blankets can all go in one collection. They are counted together at your
    door, then processed separately according to what each item needs.
- q: Do I need to take the curtains down myself before pickup?
  a: Yes, please take them down and remove any hooks or rings you want kept. Our team collects at the
    door and does not go room to room in the house. Having them down and stacked also makes the count
    at pickup quick and accurate.
- q: How does pickup work in Palam Vihar when your stores are in Sector 43 and Sector 49?
  a: Palam Vihar is on the far west side, so we run it as a scheduled doorstep collection rather than
    expecting you to visit a store. Call or WhatsApp +91 63 67 600 500 with your block and house number
    and we will arrange free pickup and delivery.
- q: With a large household load, how do I know nothing goes missing?
  a: Every item is counted with you at the door before it leaves, and you get a written receipt at pickup.
    Your order is then packed and processed separately from every other customer's, so nothing gets mixed
    with a neighbour's load.
