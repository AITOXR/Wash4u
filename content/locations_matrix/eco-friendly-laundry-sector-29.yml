body: |-
  Sector 29 runs on a different clock to the rest of Gurugram. The restaurants and bars fill up from Thursday evening, and the flats in and around the sector empty out at roughly the same time. That rhythm shows up in the laundry bag. A typical Sector 29 load is not uniform: office shirts and gym tees at the bottom, and on top of them the going-out pile from the weekend, which carries restaurant kitchen smell, cigarette smoke from an open terrace, perfume, and the odd spill nobody noticed at the time.

  Our wash and fold handles that pile as a mixed load on purpose, but not blindly. When we count your bag with you at the door, we separate the things that only *look* like wash and fold. A sequinned kurta, a satin or viscose going-out shirt, an embellished top, anything with a delicate lining: these get pulled out and flagged before the bag leaves, not discovered halfway through a wash cycle. Nazuk kapde, extra care. The rest goes through a gentle cycle chosen for the load, comes back folded, and comes back smelling of nothing in particular, which is the whole point.

  Collection here is a timing question more than a distance one. The stretch around the Sector 29 market becomes very hard to park near once the evening crowd arrives, so we prefer daytime pickups and daytime returns for this pocket, and we confirm the slot with you rather than turning up. Your order is packed on its own, separately from every other customer's, and you get a written receipt at pickup so there is no argument later about what went in.

  Most people here settle into the same pattern: the bag goes out early in the week, and everything is back and folded before the next weekend starts.
faqs:
- q: Can you get restaurant and smoke smell out of clothes with a normal wash and fold?
  a: In most cases yes. Smoke and kitchen smell sits on the fibre rather than in it, and a proper gentle
    wash with the right cycle for the fabric clears it. If a garment is dry-clean only, or the smell is
    set into a lining or a jacket, we will tell you at the door and move it to dry cleaning instead of
    putting it through a wash.
- q: My going-out clothes are mixed into the same bag as everyday washing. Is that a problem?
  a: No. That is how nearly every Sector 29 bag arrives. We count the bag with you at pickup and separate
    anything embellished, sequinned, satin or otherwise delicate before it goes anywhere near a wash-and-fold
    load.
- q: Do you pick up in the evening in Sector 29?
  a: We prefer daytime slots for this sector because the roads around the market get very congested once
    the restaurants and bars fill up. We will agree a time with you when you book rather than arriving
    unannounced.
- q: Which nearby areas do you cover from here?
  a: We cover Sector 29 and the residential sectors around it as part of our free doorstep pickup and
    delivery across Gurugram. Our nearest stores are at Vyapar Kendra, Sushant Lok Phase I, Sector 43,
    and at Unitech Arcadia, Sector 49.
