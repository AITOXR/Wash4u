body: |-
  **The Arcadia store is in Sector 49.** AG-75, Ground Floor, Block-A, Unitech Arcadia — so if you live on the Sohna Road side, your wash-and-fold does not travel far. You can walk in with a bag yourself, or the rider collects from your flat, and either way the load stays on the shortest run we do.

  Sector 49 washing is condominium washing. Two- and three-bedroom flats in the mid- and high-rise blocks along the corridor, plenty of them rented — young couples, families with school-going kids, flatmates splitting a 2BHK. The common thread is that a week's clothes for three or four people will not dry on a condominium balcony, and in July it will not dry at all. So the pile builds up: uniforms, office shirts, gym sets, bedsheets, towels. That is what wash and fold is for. Roz ke kapde, done properly and returned folded, so you get your Sunday back instead of spending it at a drying rack.

  The honest worry with any by-weight laundry is simple: will my clothes come back mixed with somebody else's? Here is how we settle it. Your order is counted with you at your door before it leaves, you get a written receipt for that count at pickup, and your load is washed and packed separately from every other customer's — never pooled. Nothing is bulked with a neighbour's basket to save a cycle.

  We handle Sector 49 and the surrounding pockets off Sohna Road, including Uniworld Gardens and Nirvana Country. Pickup and delivery are free across Gurugram, tell us the tower and flat number and the rider comes up. Safe on fabric, eco-friendly detergents, on time — and if you would rather look us in the eye first, the shop is right there in Arcadia.
faqs:
- q: Where exactly is your Sector 49 store?
  a: AG-75, Ground Floor, Block-A, Unitech Arcadia, Sector 49, Gurugram, Haryana 122018. You are welcome
    to walk in and drop your bag rather than booking a pickup — many Sector 49 residents do.
- q: Will my clothes be washed together with other customers' laundry?
  a: No. Every order is washed and packed separately from every other customer's order. Nothing is pooled
    to fill a machine, which is the usual reason clothes go missing or come back with someone else's socks.
- q: How do I know all my items came back?
  a: The rider counts the order with you at your door before it leaves and you get a written receipt for
    that count at pickup. The same count is what comes back to you.
- q: Do you collect from the high-rise societies off Sohna Road?
  a: Yes — Sector 49 and the surrounding pockets including Uniworld Gardens and Nirvana Country. Pickup
    and delivery are free across Gurugram. Share your tower and flat number on WhatsApp at +91 63 67 600
    500 and the rider comes to your door, not the gate.
