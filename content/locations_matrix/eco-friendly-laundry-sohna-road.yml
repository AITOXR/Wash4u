body: |-
  **Wash and fold on Sohna Road is a volume problem, not a stain problem.** The corridor through Sectors 47, 48 and 49 is condominium living: dual-income households, tower blocks, a laundry pile that rebuilds itself every seven days. Gym kit, office shirts, kids' school clothes, bedsheets, towels. Nothing precious. Just a lot of it, and no free evening to deal with it.

  That volume is exactly where laundry goes wrong. On a single collection run we may pick up from several flats in the same tower — similar white shirts, similar school uniforms, similar bath towels. So the count happens at your door, with you, before the bag is sealed. You get a written receipt at pickup. Your load is then washed and packed separately from every other customer's load — no shared drum with your neighbour's clothes, no pooled folding table. It comes back as your bundle, folded, with the same count you agreed to. For a service billed by weight or by piece, an honest count is the whole product.

  Getting to you is straightforward here. Our Arcadia store sits at AG-75, Unitech Arcadia, Sector 49 — inside the same corridor, not across the city. Pickup and delivery are free, and the rider works to tower gates and lobbies rather than expecting you to come down to the main road. Tell us the gate, tower and flat when you book and the collection is logged that way.

  We'll also flag things that shouldn't be in a wash-and-fold bag before they go in — a silk kurta, a structured blazer, a woollen throw. Those move to dry cleaning or specialist care instead of being run through by weight.

  Roz ka dher — the everyday pile — is the part of laundry worth handing over first.
faqs:
- q: Do you collect from inside the condominium towers on Sohna Road, or only from the main gate?
  a: Our rider comes to your tower. Give us the gate number, tower and flat when you book and we'll log
    the pickup that way. In societies where the guard desk requires it, the rider registers at the gate
    first, so it helps if you inform security that a Wash4You pickup is expected.
- q: Several flats in my tower use Wash4You. How do I know I'm not getting someone else's clothes back?
  a: Every order is counted with you at your door before the bag is sealed, and you get a written receipt
    at pickup. Your load is washed and packed separately from every other customer's order — nothing is
    pooled, even when we've collected from the same building on the same run.
- q: Is wash and fold charged by weight or by piece?
  a: Both options exist. Bulk household loads — towels, bedsheets, everyday cottons — usually make more
    sense by weight. Items you want counted and handled individually, like office shirts, work better
    by piece. Tell us what's in the bag at pickup and we'll tell you which way suits it.
- q: What shouldn't go into a wash-and-fold bag?
  a: Silks, structured blazers, suits, woollens, embellished ethnic wear and anything you're worried about
    shrinking. If we spot those in your bag we'll flag them before processing and move them to dry cleaning
    or specialist care rather than running them through as bulk laundry.
