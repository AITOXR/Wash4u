body: |-
  **Our Vyapar Kendra store is inside Sushant Lok Phase I.** Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Road, Block C, Sector 43. If you live in Phase I, II or III, your laundry is not going across Gurugram and back — it is going down the road you already drive on for groceries.

  That closeness changes what wash and fold feels like here. You can hand the bag to our rider at your gate, or carry it in yourself and stand at the counter while it is counted. Either way the count happens in front of you, you get a written receipt, and your load is packed separately from every other customer's. Nothing goes into a shared drum with a stranger's gym clothes.

  Sushant Lok's washing is mostly volume washing. Builder floors here have balconies, not drying yards, and a week of towels, bedsheets and school uniforms does not fit on a rail — especially through the monsoon and the damp part of winter, when things dry stiff and smelling of the balcony. The older independent houses in Phase I bring us the opposite problem: heavy cotton bedlinen, dhurries, curtains and guest-room sets that a home machine simply cannot turn around. Both are wash-and-fold jobs. Both come back folded, sorted and ready to go straight into the almirah.

  You can send it by weight for the everyday pile, or by piece where items need to be handled individually — the counter will tell you which makes sense for what is in your bag. *Hafte bhar ka dher, ek baar mein* — the whole week's pile, in one go.

  Free pickup and delivery. Safe on fabric. Eco friendly. On time. 1000+ customers across Gurugram already send us theirs.
faqs:
- q: Where exactly is your Sushant Lok store?
  a: Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Rd, Block C, Sushant Lok Phase I, Sector 43,
    Gurugram 122009. You are welcome to walk in with your bag rather than book a pickup — many Phase I
    residents do.
- q: Do you cover Phase II and Phase III as well, or only Phase I?
  a: All three. The store sits in Phase I, so pickups and drops across Sushant Lok are short runs for
    our riders. Call or WhatsApp +91 63 67 600 500 to book a slot.
- q: Is wash and fold charged by weight or by piece?
  a: Both options exist. Bulk household washing — towels, bedsheets, everyday clothes — usually goes by
    weight, while items that need individual handling go by piece. Tell us what is in the bag and the
    counter will explain which applies before anything is washed.
- q: How do I know my clothes will not get mixed with someone else's?
  a: Your order is counted with you at the door or at the counter, you get a written receipt of that count,
    and your clothes are washed and packed separately from every other customer's order. If anything in
    the count looks off at delivery, the receipt settles it.
