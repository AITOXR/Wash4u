body: |-
  **Cyber City is not a residential pitch, and this page isn't one.** The dry cleaning demand here comes from wardrobes that get worn nine hours a day, five days a week: two-button wool blends, half a dozen formal shirts on rotation, a blazer that has to survive a client meeting, and the occasional saree or sherwani that comes out for a wedding and then sits in a bag until someone finally sends it out.

  What actually makes this area different is timing, not fabric. You are in a tower from morning till late evening, and the flat you're going back to may be a rented studio in a nearby sector with nobody home to hand anything over. So we do weekday pickups that fit around office hours — early, before you leave, or in the evening once you're back. Our Sushant Lok Phase I store on Vyapar Kendra Road is a short run from the Cyber City stretch, which is why weekday collection here is straightforward rather than a scheduling negotiation.

  The bulk-shirt reality matters too. When someone hands over eight or ten shirts at once, the risk isn't the cleaning, it's the mix-up. Every order is counted with you at the door and acknowledged with a written receipt, and your garments are packed separately from every other customer's — no shared bag, no wondering whose collar stay came back on your shirt.

  Suits, woollens, silk sarees, lehengas, embellished and designer pieces are handled as specialist work, not as a general wash. **Safe on Fabric — gentle care. Eco Friendly — safe for the planet. On Time Service — always on time. Free Pickup & Delivery — at your door.**

  Nazuk kapde, extra care — the delicate ones get treated as delicate. Trusted by 1000+ customers across Gurugram.
faqs:
- q: I'm in a Cyber City office all day — can you collect without me being at home?
  a: We schedule pickups around office hours rather than mid-day. Most Cyber City customers pick an early-morning
    slot before they leave, or an evening slot once they're back. Message us on WhatsApp at +91 63 67
    600 500 and we'll fix a window that works with your commute rather than against it.
- q: Do you handle large batches of formal shirts, not just one or two garments?
  a: Yes — bulk formal shirts are one of the most common orders we get from this area. The order is counted
    with you at the door, you get a written receipt, and your garments stay packed separately from every
    other customer's order so nothing gets mixed into someone else's batch.
- q: Which Wash4You store covers Cyber City?
  a: Our Vyapar Kendra store — Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Rd, Block C, Sushant
    Lok Phase I, Sector 43, Gurugram — is the nearest of our two Gurugram stores to the Cyber City stretch.
    Pickup and delivery are free at your door, so you don't need to visit unless you want to.
- q: Can you take suits, sarees and lehengas as well as office shirts?
  a: Yes. Suits, woollens, silk sarees, lehengas, sherwanis and embellished or designer wear are treated
    as specialist care, handled separately from routine laundry. Tell us about any embellishment, lining
    or existing stain when you hand the piece over so it's assessed before cleaning.
