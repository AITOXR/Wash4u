body: |-
  **Most dry cleaning in DLF Phase 3 arrives at our counter for one of two reasons: work, or a wedding.**

  The work half is straightforward. Cyber City is a ten-minute walk or a short auto ride from most of the lettered blocks, which is exactly why so many people rent here. That produces a very particular pile — blazers worn twice a week, formal trousers, a couple of suits kept for client days, and collars that pick up more from the walk than from the office. Those garments don't need washing. They need solvent cleaning, careful pressing at the shoulder and lapel, and returning on a hanger rather than folded into a bag.

  The wedding half is the one people worry about. Sarees, lehengas, sherwanis, embellished and designer pieces get worn once, packed away in a rented room with limited wardrobe space, and then discovered months later with a set fold-mark or a stain nobody noticed on the night. Zari, sequins, hand-work and beading each want a different approach, so we look at the piece before deciding anything, and tell you honestly if a mark has aged past the point of full removal.

  DLF Phase 3 also has more shared flats and PGs than almost anywhere in Gurugram, and that changes the pickup itself. Three flatmates, one address, one doorbell. So we count every order with you at the door, keep each person's garments packed entirely separately from everyone else's, and leave a written receipt at pickup — no arguments later about whose black blazer is whose.

  Builder floors here are mostly walk-ups. Tell us the floor when you book and we'll come up for it. **Nazuk kapde, extra care** — that part doesn't change with the address.
faqs:
- q: I share a flat in DLF Phase 3 with two other people. Can we send our clothes together?
  a: Yes, and this is very common here. We count each person's items separately with you at the door and
    give a written receipt at pickup. Every order is packed on its own, kept apart from every other customer's
    order, so three sets of formals from one address never get mixed up.
- q: My building is a four-storey builder floor with no lift. Will you still collect?
  a: Yes. Just mention the floor when you book on WhatsApp at +91 63 67 600 500 and our pickup person
    will come up to your door. Pickup and delivery are free across Gurugram, DLF Phase 3 included.
- q: I have a lehenga with heavy zari that has been packed away for a year. Can it still be cleaned?
  a: Usually, yes — but we won't promise a result before seeing it. Embellished occasion wear is assessed
    piece by piece, because zari, sequins and hand-work all react differently. If a fold-mark or stain
    has set beyond full removal, we will tell you that up front rather than after.
- q: I'm moving out at the end of my lease. Can I get my woollens and suits done before I pack?
  a: That is one of the most common requests we get from this area. Cleaning woollens and formals before
    they go into a suitcase or storage box is the right call — packing them soiled is what causes marks
    and odour to set. Book a collection for the day that suits your move.
