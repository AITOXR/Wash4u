body: |-
  The Sector 65–69 stretch is mostly towers that received possession fairly recently, and the households inside them tend to be two people who both go out to work. That shapes the wardrobe in a very particular way. There is the weekday half — suits, blazers, formal trousers, shirts worn four or five days a week — and then a shelf of occasion wear that comes out twice a year: a lehenga, a sherwani, sarees handed down in the family. Both halves need dry cleaning, for completely opposite reasons.

  The weekday half is about upkeep. This corridor is still building itself out, and fine construction and road dust settles on balcony railings and on anything hung outside to air. It shows on suit shoulders and dark woollens before anywhere else, and brushing it off only pushes it deeper into the weave. The occasion half is about storage. Most people put a lehenga or sherwani straight back in the wardrobe after one wearing because it looks clean. Invisible marks — a splash of drink, a bit of food oil — darken and set over months, and in a new flat where nothing has been through a full season yet, that damage is only discovered the next time the outfit is needed. Nazuk kapde, extra care: embellished and hand-worked pieces are handled separately from everything else.

  Our Sector 49 store at Unitech Arcadia sits at the top of this corridor, so collection along Golf Course Extension Road is straightforward. Pickup and delivery are free across Gurugram, and slots can be taken in the evening when someone is actually home. Every order is counted with you at your door, packed separately from every other customer's, and acknowledged with a written receipt before it leaves.
faqs:
- q: We have just moved into a new tower here. Can you collect from the flat door, or does it have to
    be the society gate?
  a: Whatever your society allows. Most towers along this stretch permit a gate pass to the flat door,
    which is what we prefer, because the order is counted item by item with you present and a written
    receipt handed over at that point. If your RWA only permits collection at the lobby or gate, we do
    the same counting there.
- q: My lehenga was worn once at a wedding and looks clean. Does it still need dry cleaning before I put
    it away?
  a: Yes. The marks that cause trouble are the ones you cannot see — drink splashes, food oil, perspiration
    at the underarm and waist. They oxidise into brown patches over months in a closed wardrobe and attract
    insects. Storing occasion wear clean is the single most useful thing you can do for it, especially
    in a flat that has not been through a full monsoon and winter yet.
- q: Do you handle zardozi, sequin and heavy hand-work, and old family sarees?
  a: Yes, these are handled as specialist care rather than as part of a general load. Embellished and
    hand-worked pieces are assessed and treated separately, and inherited silk sarees are dealt with on
    their own terms, since the fabric has usually aged differently from the zari on it.
- q: The flat is newly furnished. Can one pickup take the everyday laundry, the suits and the sofa cleaning?
  a: Garments and everyday laundry travel together in one pickup, kept separate from other customers'
    orders. Fabric sofa and upholstery cleaning is done in your home rather than collected, so it is booked
    as a separate visit on the same number — useful once a new flat has been lived in for a few months
    and the seating has started to show it.
