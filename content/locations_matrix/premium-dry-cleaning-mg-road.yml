body: |-
  **Two very different wardrobes sit on the same road.** MG Road runs through the oldest part of Gurugram, and the housing along it splits neatly in two. There are the service apartments and short-let flats near the metro corridor, where people posted here for a few months live out of one suitcase — four or five suits, a stack of formal shirts, one blazer that has to survive the whole stint. And there are the older, long-settled flats behind the retail stretch, where families have been in the same home for years and the almirah holds occasion wear that has outlived several renovations: heirloom silk sarees, a sherwani worn twice, lehengas with zardozi and mirror work, woollens that come out for six weeks and then go back into storage.

  Both need dry cleaning rather than laundry, for opposite reasons. The first wardrobe is small and worked hard — every garment is in rotation, so nothing can come back shrunk, shiny at the shoulders or smelling of solvent. The second is precious and rarely worn — the enemy is not daily wear but stored dust, old perspiration marks that have set into silk, and tarnish creeping along metallic thread. We treat embellished pieces by hand, spot-test before anything else touches the fabric, and protect stone, sequin and gota work rather than machine-finishing over it. Nazuk kapde, extra care.

  The practical bit matters here too. Older MG Road buildings mean gate security desks, shared lifts and no visitor parking, so we work to the resident's schedule rather than ours — evening handovers after the commute, or a clean handover at the gate. Your order is counted with you at the door, packed apart from every other customer's, and you get a written receipt at pickup. Both our stores, in Sector 43 and Sector 49, are a short run away.
faqs:
- q: I'm in a service apartment on MG Road for a few months and don't have much with me. Can you handle
    small, frequent orders?
  a: Yes. A lot of our MG Road collections are two suits and a few shirts rather than a big weekly bundle.
    Pickup and delivery are free across Gurugram, so a small order costs you nothing extra to send.
- q: My building has a security desk and no visitor parking. How does pickup work?
  a: That is normal for the older MG Road blocks. Tell us when you book and we will either come to your
    door or meet you at the gate — whichever your building prefers. Either way the items are counted with
    you before they leave and you keep a written receipt.
- q: I have a saree with zari and stone work that has been in storage for years. Is it safe to dry clean?
  a: Bring it in, or send us a photo first. Stored silk usually has set perspiration marks and dust rather
    than fresh stains, and metallic thread needs to be kept away from heat and harsh finishing. We spot-test,
    work embellished areas by hand, and will tell you honestly if something is too fragile to treat.
- q: Do you take woollens for off-season storage cleaning?
  a: Yes, and it is worth doing before they go away, not after they come out. Clothes moths are drawn
    to body oils left in the wool, so cleaning coats, shawls and jackets at the end of winter protects
    them through the months in the cupboard.
