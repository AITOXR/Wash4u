body: |-
  Sector 29 wardrobes have a particular problem: most of what needs dry cleaning here was worn out in the evening. A blazer over dinner, a silk saree at a family function, a georgette dress at a birthday party, a sherwani that only comes out for weddings. These clothes come back smelling of restaurant kitchens, cigarette smoke and other people's perfume, usually with something on them — oil from a shared plate, a splash of red drink, a smear of lipstick on a collar or a shoulder.

  That mix is why we don't treat everything the same. Smoke and food odour sit in the fibre and don't come out by simply pressing a garment; it needs proper cleaning, not a freshen-up. Sequins, zari, beadwork, stonework and thread embroidery get inspected and protected before anything else happens, because that is what fails first on a lehenga or a heavily worked kurta. Oil-based and drink stains are spotted individually by hand rather than sent through with the load, and we tell you honestly at pickup if something has set too long to come out fully. **Nazuk kapde, extra care** — that is the whole job on this street.

  Practically, Sector 29 runs late, so we collect at times that suit you rather than at nine in the morning. Pickup and delivery are free across Gurugram. Your items are counted with you at the door, written on a receipt you keep, and packed apart from every other customer's order — useful when a lehenga dupatta or one cufflink-cuffed shirt goes missing in a normal laundry system. Tell us the date you need something back for and we'll say straight away whether it fits. Our Vyapar Kendra store in Sector 43 is the nearer of our two counters if you'd rather drop in.
faqs:
- q: Can you get restaurant and smoke smell out of a jacket or saree?
  a: Yes, that is one of the most common requests we get from Sector 29. Odour from kitchens, smoke and
    perfume settles into the fibre, so it needs a proper clean rather than steaming or airing. Tell us
    at pickup that odour is the main issue and we will treat it as the priority, not just the visible
    marks.
- q: I have a lehenga with heavy sequin and stone work. Is it safe?
  a: Embellished pieces are inspected before cleaning so we know exactly what is on the garment — sequins,
    zari, beadwork, loose stones — and they are handled and finished accordingly. If something is already
    loose or damaged when it reaches us, we point it out to you at pickup rather than after.
- q: There is an oil or drink stain from dinner. Should I try anything at home first?
  a: 'Please don''t. Rubbing an oil or coloured drink stain on silk, georgette or a wool blend usually
    spreads it and can lift the colour. Leave it, tell us what it was and roughly when it happened, and
    we will spot treat it by hand. One of our customers told us plainly: "I tried at home and the stain
    didn''t go. Wash4You removed it completely."'
- q: I need something back for a specific evening. How does that work?
  a: Give us the date and occasion when you book. We will tell you straight away whether it fits, and
    if a particular stain or fabric needs longer we will say so rather than promise and disappoint. Call
    or WhatsApp +91 63 67 600 500 to arrange a collection time that suits you.
