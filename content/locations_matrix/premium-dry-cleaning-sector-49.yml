body: |-
  **Our Arcadia store is in Sector 49.** AG-75, Ground Floor, Block-A, Unitech Arcadia — so if you live in the condominiums along this stretch of the Sohna Road corridor, dry cleaning here does not have to be a leap of faith. You can walk in, put the lehenga on the counter, and watch someone actually look at it: check the zari, find the makeup on the inner neckline, point out the bead that is already loose before it goes anywhere. For a piece worth more than the rest of the wardrobe combined, that face-to-face handover is worth the ten-minute walk.

  Sector 49 is mostly flats — Uniworld Gardens, Nirvana Country and the towers around them — which means storage is the real problem. Sherwanis, banarasi sarees and winter coats live compressed in a loft box or the back of a shared wardrobe for eleven months of the year. That is where the damage happens: creases set hard, old perfume and body oils oxidise into yellow shadows nobody noticed at the time, and the piece comes out in wedding season looking older than it is. Most of the embellished work we handle from this sector arrives exactly like that, and it is handled dry, by hand, with the stonework and dori work protected rather than bulldozed.

  For the working crowd here, it is quieter and more regular — suits and blazers for the offices down Sohna Road, woollens in and out through the Gurugram winter.

  Free pickup and delivery runs across the sector as normal, and being the home store means the guard-gate handovers are short. Every order is counted with you at the door, packed separately from every other customer's, and you get a written receipt at pickup. *Nazuk kapde, extra care.*
faqs:
- q: Can I drop clothes off myself instead of booking a pickup?
  a: Yes. The Arcadia store is at AG-75, Ground Floor, Block-A, Unitech Arcadia, Sector 49 — it is our
    own counter, not a collection point. For heavily embellished or high-value pieces we would rather
    you came in, so we can inspect the garment with you and note anything already loose or stained before
    it is booked in.
- q: My saree has been in a loft box since the last wedding and has yellowed at the folds. Can that be
    fixed?
  a: Bring it in and let us see it. Fold-line yellowing from long storage is one of the most common things
    we get from Sector 49 flats, and a lot of it does come out. What we will not do is promise a result
    on zari or old silk before we have the piece in hand and have tested it.
- q: Do you collect from inside the condominiums here, or only at the gate?
  a: We come to your door. Sector 49 is our home sector, so pickups here are short runs and easy to schedule.
    Your order is counted with you at the door and you get a written receipt at that point.
- q: How do you keep my clothes from getting mixed with another flat's order?
  a: Every order is packed separately from every other customer's order, from the moment it is counted
    at your door to the moment it comes back. Nothing goes into a shared bag.
