body: |-
  **Most dry cleaning on the Sohna Road corridor is occasion wear that has been living in a flat.**

  Sectors 47, 48 and 49 are condominium country. A three-bedroom apartment gives you one wardrobe for a lehenga you will wear twice, a sherwani from a cousin's wedding, two suits for the office park, and the woollens that come out for eight weeks a year. There is no spare room to air anything, no terrace line for a heavy silk saree, and a closed balcony that goes damp through the monsoon. That is why the garments people hand us here are rarely dirty in the obvious sense. They are creased from being pressed against other clothes, faintly musty from storage, marked at the neckline and the underarm from one evening's wear, or carrying a spill that dried in months ago because the outfit went straight back into the cupboard after the function.

  Embellished and delicate pieces need handling that suits that history. Zari, sequins, hand-work and beading are checked and protected before cleaning, linings and interfacing on suits and sherwanis are treated so the shape survives, and woollens are finished so they come back the size they went in. Nazuk kapde, extra care is not a slogan for us, it is the reason these items get sorted by hand rather than run through with everything else.

  Our Unitech Arcadia store sits at AG-75, Sector 49, on this corridor. Your clothes do not travel across Gurugram to be cleaned. Pickup and delivery are free and come to your flat door, not the tower gate. Every order is counted with you at the door, packed separately from every other customer's order, and acknowledged with a written receipt.
faqs:
- q: Do you collect from inside the tower, or do I have to come down to the gate?
  a: We come to your flat door. Sohna Road societies vary in how they handle visitor entry, so tell us
    your tower and flat number when you book on WhatsApp at +91 63 67 600 500 and we will sort the gate
    entry ourselves. The count and receipt happen at your door, not in the lobby.
- q: My lehenga has been in the cupboard since the wedding and now smells musty. Is that fixable?
  a: Usually yes, and it is one of the most common things we see from the condominium belt. Storage odour
    and set-in creasing on stored occasion wear are treated differently from fresh soiling. Show us the
    piece first, either at the Sector 49 store or at pickup, and we will tell you honestly what will come
    out and what will not.
- q: Can you handle heavy zari, sequin and hand-embroidered work?
  a: Yes. Embellished pieces are inspected and the work is protected before cleaning, and they are handled
    separately rather than batched. If any beading or zari is already loose when it reaches us, we will
    flag it to you before we start rather than after.
- q: Which of your stores handles Sohna Road orders?
  a: Our Arcadia store, AG-75, Ground Floor, Block-A, Unitech Arcadia, Sector 49, Gurugram 122018. It
    is on the corridor itself, so garments from Sectors 47 to 49 stay local. You are welcome to walk in
    with an outfit rather than book a pickup.
