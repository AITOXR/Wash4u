body: |-
  **Our Vyapar Kendra store is in Sushant Lok.** Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Rd, Block C, Sushant Lok Phase I, Sector 43. That matters more here than anywhere else we work: dry cleaning in Sushant Lok is not a van route passing through, it is a counter you can walk to, hand a garment across, and ask questions at before you leave it with anyone.

  Sushant Lok is a settled colony. Families have been in Phases I to III long enough that wardrobes have accumulated properly: Banarasi and Kanjeevaram sarees kept for the next family wedding, sherwanis worn once a season, lehengas with zari, sequin and cutwork detailing, office suits, and the winter pile of shawls, pashminas and coats that comes out of the almirah in November and goes back in March. Very little of that belongs in a washing machine. Embellished and hand-worked pieces are inspected, spot-treated, and hand-finished rather than tumbled with everything else. Nazuk kapde, extra care.

  The other Sushant Lok specific is the buildings. Builder floors and independent houses, three or four storeys, often without a lift, and a lehenga or a stack of woollens is not something you want to carry down yourself. Our team comes to the floor. Free pickup and delivery across Gurugram, no different here. Every order is counted with you at the door before it leaves, packed separately from every other customer's order, and acknowledged with a written receipt so there is never a question about what went out.

  Or skip all of that, since you live minutes away. Bring it to the Vyapar Kendra counter, tell us what the stain is and what you already tried on it at home, and we will tell you honestly whether it will come out.
faqs:
- q: Where exactly is your Sushant Lok store?
  a: Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Rd, Block C, Sushant Lok Phase I, Sector 43,
    Gurugram 122009. You can walk in with your garments, or call +91 63 67 600 500 and we will collect
    from your home instead.
- q: I live on the third floor of a builder floor with no lift. Will someone come up?
  a: Yes. Our team collects from your door, not from the gate or the street. That is standard across Sushant
    Lok, and it is free.
- q: Do you handle heavily embellished lehengas and zari sarees?
  a: Yes, this is the bulk of what Sushant Lok sends us. Embellished, hand-worked and delicate pieces
    are inspected and treated individually, then hand-finished. If a piece has fragile beadwork or an
    older zari border that we think could be at risk, we will tell you before we begin.
- q: How do I know my clothes will not get mixed up with someone else's?
  a: Every order is counted with you at the door or across the counter, packed separately from every other
    customer's order, and you get a written receipt at pickup listing what we took.
