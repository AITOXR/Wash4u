body: |-
  **The sneakers in Cyber City live a harder life than most.**

  You walk in from the basement parking or the metro concourse in your Dunks or your Hokas, change into formals at the desk, then put the sneakers back on for the walk to dinner. That's two commutes, a lunch run and a coffee queue a day, on grey office carpet, wet lobby tiles and monsoon kerbs. Suede greys out. Midsoles yellow. By month four the shoe still fits perfectly and just looks finished.

  It isn't. Most of what we're asked to rescue in this district is cosmetic — the suede nap crushed flat rather than damaged, the sole discoloured rather than cracked. Suede and nubuck get a dry, brush-led clean with no soaking, because water is what actually ruins a Dunk. Leather and knit uppers are hand-cleaned. Outsoles and midsoles are treated separately for whitening, and the insole and lining are deodorised — which matters if the shoes have spent nine hours in an air-conditioned office and then gone to the gym.

  The logistics here are the other half of the job. Nobody in Cyber City is home for a pickup. So we collect at the tower — reception, security desk, or downstairs at whatever time your day allows, including the lunch window and after you log off. The count is done with you at the door, your pair is bagged separately from every other customer's, and you get a written receipt on the spot. If it's easier to hand them over near where you live, our Sector 43 and Sector 49 stores are a short drive out.

  Free pickup and delivery, both ways. *Naye jaise* is the standard we work to — and we'll tell you honestly before we start if a pair won't get there.
faqs:
- q: Can you collect from my office tower in Cyber City instead of my home?
  a: Yes — that's how most Cyber City orders work. We collect from the reception or security desk of your
    building, or you can hand the shoes over downstairs. Tell us the window that suits your workday, including
    lunchtime or after you finish for the day, and we'll come then. Free pickup and delivery, both ways.
- q: My suede sneakers have gone dull and grey. Can that be fixed?
  a: Usually, yes. On suede and nubuck the common problem isn't dirt in the material, it's the nap being
    crushed and greyed by wear. We clean these dry, with brushes rather than soaking, then re-raise the
    nap. We've done this on Nike SB Dunks and similar suede pairs — the before/after on those is our strongest
    proof. Water-based washing is what damages suede, so we avoid it.
- q: Do you do the yellowed white soles as well as the upper?
  a: Yes. Outsoles and midsoles are treated separately from the upper, because they need a different approach
    — the upper may only want a gentle clean while the sole needs whitening work. Cushioned running shoes
    like the Hoka Bondi, where there's a lot of exposed white foam, are a regular job for us.
- q: The shoes smell after the gym. Is that dealt with too?
  a: It's part of the standard clean. Insoles and linings are treated and deodorised, not just the outside
    of the shoe. If your pair goes from an air-conditioned office to the gym and back into a bag, that's
    the part that actually needs attention most.
