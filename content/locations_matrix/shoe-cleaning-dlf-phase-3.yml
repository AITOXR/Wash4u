body: |-
  **Most shoes we collect from DLF Phase 3 are walking shoes, not going-out shoes.** Phase 3 sits right up against Cyber City, so a lot of people here have deliberately chosen a ten-minute walk over a cab. That walk is fine in November. In July it is puddles and splash-back up the heel, and from February the construction dust off the lane settles into the mesh of every running shoe left on the rack outside the door. Sneakers here get worn five days a week and then asked to look presentable at the same time — which is a harder job than one big clean a year.

  So the work splits three ways. Suede and nubuck get brushed and cleaned dry-side-first, never soaked — our Nike SB Dunk before-and-after is suede, and that is the pair we point people to when they ask whether the nap will go patchy. Cushioned runners like the Hoka Bondi get midsole and outsole work, because on white foam the grey creep along the sidewall is what actually makes them look finished. And deodorising, which nobody puts in a search box but half of Phase 3 needs: shoes stored on a shared landing rack, worn without socks in summer, never given a day to dry.

  Collection here is its own thing. Builder floors, third and fourth floor, no lift, and often three flatmates who barely know each other sending shoes on the same pickup. We count every pair with you at the door, bag your pairs separately from every other customer's, and leave a written receipt — so when the bag comes back to a shared flat, there is no argument about whose Dunks are whose. Free pickup and delivery, and we work around office hours since most of Phase 3 isn't home at 2pm.
faqs:
- q: My suede sneakers have water stains from the monsoon walk to Cyber City. Can those come out?
  a: Usually yes. Water marks on suede are the nap drying unevenly rather than actual dirt, so they respond
    to dry brushing and controlled re-wetting of the whole panel, not spot cleaning. Send the pair as-is
    — please don't try a wet cloth at home first, because that is what sets the tidemark.
- q: The white foam midsoles on my running shoes have gone grey. Is that permanent?
  a: Not usually. Grey on EVA foam is embedded surface grime, and it lifts with sole-specific work. What
    we won't promise is factory white on a heavily creased or yellowed midsole — if the foam has oxidised,
    we'll tell you that when we count the pair in rather than after.
- q: I share a flat in Phase 3 and we all want shoes done. Will they get mixed up?
  a: No. Each person's pairs are counted separately at the door, bagged separately from every other order
    in the van, and each of you gets your own written receipt. It's the same process whether it's one
    pair or nine from one landing.
- q: Can you collect from a PG or a builder floor with no lift?
  a: Yes — that's most of what we do in Phase 3. Our person comes up to your door, counts with you there,
    and returns the same way. Tell us on WhatsApp if the guard needs a name at the gate or if evenings
    suit you better.
