body: |-
  Golf Course Extension Road is still being built around the people living on it. Between Sectors 65 and 69, service roads, tower podiums and half-finished plots throw up a fine construction dhool that settles on everything, and white midsoles are where it shows first. A pair worn for the walk to the cab pickup and back goes from white to a dull grey-beige in a couple of weeks. Suede is worse: the dust sits in the nap, the colour flattens, and brushing it dry at home only pushes it deeper.

  This is the service we have the most proof on. Nike SB Dunks in suede, where the dust film had killed the texture and the toe had scuffed. Hoka Bondis, the shoe half this corridor runs in, where the thick white midsole had gone grey along every crease and the inside had picked up an odour from being worn in the gym downstairs six days a week. Both were cleaned, the midsoles whitened back, the suede lifted and re-napped, and the insoles deodorised rather than perfumed over.

  The logistics here are their own problem. Most flats on this stretch have two people working and nobody home in the middle of the day, and the towers are big enough that a rider can lose twenty minutes finding the right lobby. So we collect at a time you name, usually evening, count the pairs with you at your door, and hand you a written receipt for exactly what has gone. Your shoes are bagged separately from every other customer's order, never tumbled together in a common lot, and come back to the same door. If a load of laundry or a sofa cover is going out in the same trip, it goes in one pickup.
faqs:
- q: My white soles keep going grey again within weeks. Is cleaning even worth it?
  a: On this corridor that is construction dust, not permanent staining, and it sits on the surface rather
    than in the rubber. Cleaning takes it back to white. What we tell customers here honestly is that
    a corridor still under construction will re-dust them, so most people on Sectors 65 to 69 send shoes
    with a regular laundry pickup rather than treating it as a one-off rescue.
- q: Do you clean suede? I have been told suede cannot be washed.
  a: It cannot be washed the way canvas or mesh can, which is why home attempts flatten it. Suede is cleaned
    dry-first, the nap lifted and reset afterwards. Our Nike SB Dunk before-and-afters are suede, and
    they are the results we are happiest to show you before you hand anything over.
- q: Can you pick up from the tower without me being home?
  a: We would rather you were. Every order is counted with the customer at the door and acknowledged with
    a written receipt, and with footwear that matters because pairs are easy to mix up. Give us an evening
    slot that suits you and we will work to it.
- q: Can shoes go along with our regular laundry?
  a: Yes, and in these newer flats that is how most of it moves. Shoes, weekly laundry, and things like
    sofa covers or curtains from a recently furnished flat can all go out in one free pickup. Each item
    type is handled separately and your whole order stays packed apart from everyone else's.
