body: |-
  **The shoe rack in a Golf Course Road tower is not an ordinary shoe rack**

  Along the DLF Aralias, Magnolias, Park Place and Central Park stretch, we see the same three shelves again and again. Suede and nubuck sneakers that were never meant to touch water. White leather and white-sole pairs worn once and now grey at the midsole. And mesh running shoes — the ones that come back damp and grey from morning loops around Leisure Valley and the Aravalli trails, then sit in a shoe cupboard inside an air-conditioned flat and start to smell. Below that, in wedding season, the beaded juttis, satin heels and embellished mojris that nobody wants to hand to a general laundry.

  Suede ho ya mesh, har jodi ka apna tareeka — every pair gets its own method. Suede and nubuck are dry-brushed and spot-treated by hand, never soaked; that is how the Nike SB Dunk pair in our before/after photos came back with the nap standing. Mesh uppers like the Hoka Bondi are worked separately from the midsole and outsole, then deodorised from the inside. White soles are cleaned back, not painted over. Beaded and stone-set uppers are hand-cleaned only, with every stone checked before and after.

  Collection here is the part people worry about. Towers mean visitor passes, gate registers and a lift lobby between our rider and your door. We still come to the door, count the pairs with you and leave a written receipt — we do not want your shoes handed over at a gate desk with nobody counting. Your pairs are then bagged and processed separately from every other customer's order. Pickup and delivery are free anywhere on the corridor. If you are at the office on weekdays, take an evening or weekend slot.
faqs:
- q: Can your rider collect from the tower gate or the concierge desk instead?
  a: We would rather not. Every order is counted with the customer and acknowledged with a written receipt,
    and that cannot happen properly at a gate register. If you cannot be home, we can hand over to a family
    member or house staff who is able to count the pairs with our rider. Just tell us on WhatsApp who
    to expect and we will clear the visitor pass with security in advance.
- q: Will suede sneakers lose their texture or colour?
  a: Not with the right method. Suede and nubuck are never submerged — they are dry-brushed, spot-treated
    and the nap is lifted back by hand. Our before/after set on a pair of Nike SB Dunks in suede is a
    real customer job, not a stock photo. If a pair is very badly discoloured we will tell you honestly
    what we expect to achieve before we take it.
- q: Do you handle designer, embellished or wedding footwear?
  a: Yes, and it is a large part of what we collect from this stretch. Beaded juttis, stone-set mojris
    and satin or fabric heels are cleaned by hand only, with the embellishment checked before work starts
    and again before packing. If something is already loose when it reaches us, we will send you a photo
    and ask before proceeding.
- q: Can grey or yellowed white soles actually be brought back?
  a: In most cases, yes. Midsoles and outsoles are treated separately from the upper so the whitening
    work does not touch suede, mesh or leather. We clean the sole back rather than coating it, because
    paint chips off within a few wears and leaves the shoe looking worse than before.
