body: |-
  MG Road is a walking corridor. Between the metro stairs, the covered walkways of the retail blocks and the older residential pockets sitting just behind them, people here put real mileage on one or two pairs of shoes every single day — the same white sneakers to the office, to dinner, back up the stairs at night. That daily grind is what we mostly see coming out of MG Road: midsoles going grey at the edges, uppers dulled by road dust off the corridor, and in monsoon, shoes that never fully dry because there is nowhere in a Sector 28-side flat or a service apartment to leave them in the sun.

  That last part matters more than people expect. A lot of MG Road residents are on short corporate stays or in older buildings without a usable balcony. Washing a pair at home means a damp bathroom, a half-dry shoe and a smell that sets in by day three. Deodorising is genuinely half the job we do here.

  The work itself is hands-on and pair-specific. Suede and nubuck get dry brushing and a controlled foam clean, never a soak — our clearest before/after result is a Nike SB Dunk in suede. Cushioned running shoes like the Hoka Bondi need midsole and outsole work without stressing the foam. White soles get whitened separately from the upper. Laces and insoles come out and are treated on their own.

  Collection on MG Road is deliberately kept simple, because parking near the metro end is not. We come to your gate or reception, count the pairs with you at the door, hand you a written receipt, and pack your shoes separately from every other customer's order. Free pickup and delivery, right across Gurugram.

  Nazuk cheezein, extra care — including the ones you walk in.
faqs:
- q: I live in a service apartment on MG Road with no balcony. Is that a problem?
  a: Not at all — it is one of the main reasons people here call us. Drying is the step that goes wrong
    at home. Your shoes are cleaned and dried properly at our end and come back to your door ready to
    wear, so nothing sits damp in your flat.
- q: My sneakers are suede. Can they be cleaned safely?
  a: Yes. Suede and nubuck are never soaked. We dry brush first, then use a controlled foam clean and
    re-nap the surface once dry. Our strongest before/after result to date is a Nike SB Dunk in suede,
    which is the kind of pair we would normally be asked not to touch.
- q: The soles of my white trainers have gone grey. Can that come back?
  a: Usually a good distance, yes. Sole whitening is done separately from the upper, so the fabric is
    not over-treated to fix a rubber problem. We will tell you honestly at pickup how much of the discolouration
    is surface dirt and how much is permanent staining in the material.
- q: How does pickup work near the metro end of MG Road?
  a: We come to your building gate or reception rather than asking you to find parking. Every pair is
    counted with you at the door, you get a written receipt on the spot, and your order is bagged separately
    from everyone else's. Call or WhatsApp +91 63 67 600 500 to book a slot.
