body: |-
  **A house has more shoes than a flat does.** That is the plain reason shoe cleaning works differently in Palam Vihar. In a plotted township, the rack sits inside the gate and it holds the whole family — school shoes worn five days a week, the running pair, the badminton and cricket shoes, the good sneakers kept for weekends, and someone's suede boots that have not been touched since last winter. Nobody sends one pair from a house like that. They send six.

  Being on the far west of Gurugram adds the second reason. Wide colony roads, open plots and construction dust on the outer blocks mean footwear here picks up a fine grey layer that a wipe at the door only pushes deeper into the mesh and the midsole seam. Then the monsoon arrives, water sits in the low-lying lanes, and leather and suede left in a closed rack come out smelling of damp.

  We clean by material, not by batch. Suede is brushed dry and treated without soaking — our Nike SB Dunk suede result is the one we point people to. Knit and mesh runners like the Hoka Bondi are handled so the foam does not yellow or collapse. Midsoles and white rubber are whitened separately from the upper. Insoles are deodorised rather than perfumed over.

  Collection is at your own gate, not a tower lobby, which makes the counting easy: we count every pair with you standing there, write it on the receipt, and each household's shoes are bagged apart from every other customer's. Ghar ke saare joote, ek hi baar mein — one collection, one receipt, one bag back. Same free pickup and delivery covers curtains, blankets and sofa covers if you want them out at the same time.
faqs:
- q: Can you take several pairs from one house in a single pickup?
  a: Yes, and in Palam Vihar that is the norm rather than the exception. Every pair is counted with you
    at the gate and listed on the written receipt, so a six-pair collection comes back as six pairs, matched
    and bagged as one household's order.
- q: My suede boots have gone musty sitting in the rack through the monsoon. Is that fixable?
  a: Usually, yes. Musty suede is a moisture-and-odour problem, not a stain problem, so it is treated
    dry — brushed, deodorised and dried properly rather than washed. Send it before the nap gets crushed
    and the odds are much better.
- q: The white soles on my running shoes have gone grey with road dust. Will they come back?
  a: Midsoles and rubber outsoles are whitened as a separate step from the upper, which is what gets that
    dust out of the seam where the sole meets the fabric. Our before and after photographs on the Hoka
    Bondi show what to expect.
- q: Do you actually come out to Palam Vihar, or only to the sectors near your stores?
  a: We collect and deliver free across Gurugram, including Palam Vihar. Our shops are in Sector 43 and
    Sector 49, but the pickup comes to your door. Call or WhatsApp +91 63 67 600 500 to fix a time.
