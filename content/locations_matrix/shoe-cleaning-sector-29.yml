body: |-
  Sector 29 is where Gurugram goes out, and going out is hard on shoes. A crowded floor at one of the Leisure Valley restaurants means someone stands on your toe, a drink goes over the side of a white midsole, and by the time you get home the suede has a dark patch and the whole shoe smells of the evening. Almost every pair that comes to us from this area has the same story behind it: worn out on a Friday, unwearable by Sunday.

  That is the work we know best. Suede and nubuck get dry-brushed and treated without soaking, which is what usually ruins them when people try at home. We have done this on Nike SB Dunks in suede and on Hoka Bondi runners, and the before/after photos are real customer pairs, not stock images. White rubber midsoles and outsoles get worked separately from the upper, because the grime that collects on a sole in a car park and on a dance floor does not lift with the same treatment as fabric. Insoles get deodorised rather than perfumed over.

  Collection around Sector 29 is simple if you plan around the traffic. Parking near the restaurant strip is unusable on weekend evenings, so we pick up from homes in the surrounding sectors, or from an office reception during the working day, rather than trying to reach you at nine at night. Our Sector 43 store at Vyapar Kendra is the closest counter if you would rather hand them over yourself.

  Every pair is counted with you at the door, kept apart from every other customer's order, and you get a written receipt at pickup. Tell us which evening you need them back for and we will tell you honestly whether it works.
faqs:
- q: My suede sneakers got a drink spilled on them in Sector 29. Is that fixable?
  a: Usually yes, and the most important thing is not to try washing it out at home first. Water spreads
    the stain and flattens the nap. Bag them, message us on WhatsApp at +91 63 67 600 500 with a photo,
    and we will tell you what we think before you send them.
- q: Can you collect from a restaurant or office in Sector 29 itself?
  a: We collect from offices and receptions during working hours. We avoid the restaurant strip on Friday
    and Saturday evenings because parking there is impossible, so for a weekend pair it is easier to collect
    from your home in one of the surrounding sectors.
- q: Will you whiten the soles without damaging the upper?
  a: The sole and the upper are treated separately. Whitening agents that work on rubber are too harsh
    for suede, mesh or knit, so those never touch the upper. That separation is the whole reason home
    cleaning tends to leave sneakers looking worse.
- q: Can you also take my going-out clothes in the same pickup?
  a: Yes. Party and festive wear, shirts and dresses can go in the same collection as the shoes. Each
    order is counted with you at the door and packed separately from every other customer's, so nothing
    gets mixed up between the two.
