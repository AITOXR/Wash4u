h1: Shoe Cleaning in Sector 49, Gurugram
lede: Our Arcadia store is in Sector 49 — AG-75, Ground Floor, Block-A, Unitech Arcadia. You can hand
  your shoes across the counter, or we'll collect them from your door for free.
body: |-
  Sector 49 is the one part of Gurugram where you don't have to describe your shoes over the phone. Our Arcadia store sits right here, at AG-75, Ground Floor, Block-A, Unitech Arcadia. Walk in with the pair, and we'll look at them with you before anything is decided — because suede, knit, leather and a foam midsole all want completely different treatment, and getting that wrong is how good shoes get ruined.

  That matters more here than most places. The Sohna Road corridor is full of mid- and high-rise condominiums, young families and tenants, and the shoe rack in those flats tends to hold two things: running shoes that get used properly, and sneakers people actually care about. We've cleaned both. A pair of Hoka Bondi that had absorbed months of road grit and a good deal of smell. Nike SB Dunks in suede, where the whole job is lifting dirt without flattening the nap or bleeding colour into the panels. Those before-and-afters are genuine, and we're happy to show you the pictures at the counter.

  The work itself is straightforward and unglamorous: hand cleaning matched to the material, midsole and outsole whitening on white pairs, laces done separately, and deodorising for gym and running shoes rather than just perfuming over the problem.

  Logistics are easy in Sector 49. Free pickup and delivery from your tower — useful if you're in an apartment where the guard won't let a rider up. Every pair is counted with you at the door, kept packed separately from every other customer's order, and you get a written receipt at pickup. Nazuk cheezein, extra care.
faqs:
- q: Where exactly is your Sector 49 store?
  a: AG-75, Ground Floor, Block-A, Unitech Arcadia, Sector 49, Gurugram, Haryana 122018. It's a ground-floor
    shop, so you can walk in with your shoes rather than booking a pickup if that's easier.
- q: Can you clean suede sneakers without damaging them?
  a: Yes. Suede is hand-cleaned dry-first, with the nap brushed back up afterwards, and no soaking. Our
    Nike SB Dunk suede before/after is one of the results we're most often asked about. Bring the pair
    in and we'll tell you honestly what can and can't be lifted.
- q: My running shoes smell more than they look dirty. Can that be fixed?
  a: That's a common ask from runners and gym-goers around Sohna Road. Odour usually lives in the insole
    and midsole foam, so those are treated separately from the upper. Deodorising is part of the clean,
    not a fragrance sprayed on at the end.
- q: Do you pick up from apartments in Sector 49 and nearby?
  a: Yes, free doorstep pickup and delivery across Gurugram, including the condominiums around Sector
    49 and Sohna Road. Your shoes are counted with you at the door, bagged separately from other orders,
    and you get a written receipt then and there. Call or WhatsApp +91 63 67 600 500.
