body: |-
  Most shoe cleaning requests we collect from the Sohna Road corridor come from three pairs sitting by the same shoe rack: running shoes worn on the service road and society loop, gym trainers that never quite dry out in an air-conditioned tower, and one good pair of sneakers the owner is nervous about washing.

  The running shoes are usually the worst of it. Foam-heavy road shoes — the Hoka Bondi we cleaned is the honest example — collect grey road film along the midsole wall, and after a wet week on Sohna Road that turns into slush caked into the outsole lugs. Wash them at home and the foam holds water for days and starts to smell. We flush the outsole, clean the midsole wall without soaking the foam through, treat the insole and lining separately for odour, and dry them slowly rather than in the sun, which is what yellows and warps a white midsole in the first place.

  Suede is the other regular. Our Nike SB Dunk before-and-after is the pair people ask about most: suede does not want water, so nap-lifting and spot work replace washing, and the panel is finished dry so the texture comes back instead of going flat and shiny. White soles and midsole edges get whitened as separate work from the upper.

  Logistically, Sector 49 is our own doorstep — our Arcadia store sits at AG-75, Unitech Arcadia, Block A. For condominium pickups we come to your flat door, not the guard desk. Shoes are counted with you, each pair bagged apart from every other customer's order, and you get a written receipt at pickup. Nazuk suede ho ya muddy trail runner, they never travel loose in a common sack.
faqs:
- q: Can you clean foam-midsole running shoes like a Hoka without ruining the cushioning?
  a: Yes. The midsole wall is cleaned on the surface rather than soaked, and the shoe is dried slowly
    and away from direct sun. Saturating and sun-drying thick EVA foam is what causes yellowing, stiffness
    and lingering damp smell, so we avoid both.
- q: My suede sneakers are scuffed, not dirty. Is that still shoe cleaning?
  a: That is exactly the suede work. Suede is handled dry with spot treatment and nap lifting instead
    of washing, so the texture is raised back rather than flattened. Our Nike SB Dunk before-and-after
    result was this kind of job.
- q: I live in a condominium off Sohna Road. Do I have to carry the shoes down to the gate?
  a: No. Free pickup and delivery comes to your flat door. We count the pairs with you there, bag them
    separately from every other order, and hand you a written receipt before we leave.
- q: Can I just drop the shoes off myself?
  a: Yes, and from the Sectors 47 to 49 stretch it is a short run. Our Arcadia store is at AG-75, Ground
    Floor, Block-A, Unitech Arcadia, Sector 49. You can also message +91 63 67 600 500 on WhatsApp with
    a photo first.
