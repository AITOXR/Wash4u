body: |-
  **Our shop is in your colony.** The Wash4You Vyapar Kendra store — Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Road, Block C, Sushant Lok Phase I — sits inside Sector 43, minutes from Phases I, II and III. For shoes, that matters more than it does for laundry. You can carry a pair down yourself, put them on the counter, and point at the exact scuff that is bothering you. We count the pair in front of you and hand you a written receipt. Nothing gets described over the phone and misunderstood.

  Sushant Lok is an older, settled colony, and the shoe pile here reflects that. Builder-floor households bring in the running shoes that come back from the morning loop caked in construction dust and park mud — cushioned foam trainers like the Hoka Bondi, where the midsole yellows and the upper mesh greys long before the shoe is worn out. Sneakerheads in the newer flats bring suede: Nike SB Dunks and similar, where one wrong soak permanently mats the nap. Independent houses send down school shoes and the household's everyday walkers, usually a batch of four or five pairs at once.

  We treat each of those differently. Suede is dry-brushed and spot-treated, never drowned. Foam midsoles and rubber outsoles get whitening work that lifts the grey without eating the glue line. Interiors are deodorised and dried properly, because a shoe that smells clean but is still damp inside will smell again in two days. Nazuk cheez hai — suede especially needs a light hand.

  If you would rather not walk over, free pickup and delivery covers all of Sushant Lok, and your pair is bagged separately from every other customer's order.
faqs:
- q: Can I drop my shoes off in person instead of booking a pickup?
  a: Yes. The Wash4You store is at Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Road, Block C,
    Sushant Lok Phase I, Sector 43. Walk in with the pair, show us the marks you want dealt with, and
    take a written receipt. Most Sushant Lok residents find this quicker than arranging a slot.
- q: Will suede sneakers get damaged?
  a: Suede is not washed the way canvas or mesh is. It is dry-brushed to lift dirt out of the nap and
    spot-treated only where needed. We have done this on Nike SB Dunk suede and can show you before/after
    results at the counter before you leave the shoes with us.
- q: My white running-shoe soles have gone yellow. Can that be reversed?
  a: Usually a good deal of it, yes. Foam midsoles and rubber outsoles are treated separately from the
    upper. How much comes back depends on the age of the foam and how deep the oxidation has gone, so
    we will tell you honestly what to expect when we see the pair rather than promise a result over WhatsApp.
- q: Can I send several pairs together?
  a: Yes, and many Sushant Lok households do — school shoes, walkers and one good pair in the same lot.
    Every pair is counted with you at handover and your order is packed separately from every other customer's,
    so nothing gets mixed up between families.
