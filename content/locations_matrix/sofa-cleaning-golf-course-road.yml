body: |-
  Golf Course Road work is almost entirely in-home work, and that single fact shapes everything. A three-piece sectional on the fourteenth floor of Aralias or Park Place is not coming downstairs. It was often craned or assembled in place, the lift is a service lift with a booking slot, and half the seating in these apartments is fixed-back or built into the joinery. So our team comes to you with the machine, and the sofa never leaves the flat.

  That means clearing the gate first. We send technician names and ID ahead of the visit so the concierge or gate desk has the entry logged, and we come up the service lift as building rules require. Floor protection goes down before anything else — these are marble and engineered-wood floors, and a wet job next to a rug you don't want touched is a real risk, so we sheet it.

  The method is dry vacuum, targeted pre-treatment on the arms and headrests where hair oil and hand grime concentrate, shampoo agitation, then hot-water extraction that pulls the moisture back out rather than leaving the foam soaked. That last part matters more here than anywhere else in Gurugram: these are sealed, air-conditioned apartments with limited cross-ventilation, so a sofa that is merely wet-scrubbed stays damp for days and starts to smell. Extraction is what makes in-home cleaning workable in a closed high-rise.

  Most calls come from three things — a pale linen or velvet three-seater that has quietly gone grey along the seat line, a pet who has claimed one corner, or a spill before people come over. Imported and delicate covers get a patch test on a hidden panel before we go further, and if a fabric shouldn't be wet-cleaned, we will tell you rather than risk it.

  Free pickup and delivery applies to your laundry and dry cleaning on the same visit. *Nazuk kapde, extra care* — same principle, bigger furniture.
faqs:
- q: Do you need building permission before coming to a Golf Course Road high-rise?
  a: Most towers along Golf Course Road require vendor entry to be logged at the gate and wet work to
    use the service lift. Tell us your tower and apartment when you book and we will share technician
    names and ID details in advance so the concierge or gate desk can clear entry before we arrive. If
    your RWA needs anything in writing, ask us and we will send it.
- q: Can you clean a sectional or a fixed-back sofa that can't be moved?
  a: Yes — that is the normal case here. The whole service is designed to happen inside your apartment.
    We work around the piece where it stands, lay floor protection over marble or wooden flooring, and
    only need enough clearance to get around the sides. Nothing is dismantled or taken out of the flat.
- q: How wet does the sofa get in a closed, air-conditioned apartment?
  a: Hot-water extraction pulls the water back out immediately, so the fabric is left damp rather than
    soaked. That matters in sealed high-rise flats with limited cross-ventilation, where a scrubbed-but-not-extracted
    sofa can stay wet and develop an odour. We will tell you when the piece is fit to use again based
    on the fabric and how heavy the job was.
- q: What about velvet, linen or imported upholstery?
  a: We patch-test on a hidden panel — under a cushion or behind the skirt — before treating the visible
    surface, and adjust the method to the fabric. If a cover shouldn't be wet-cleaned at all, we will
    say so on site instead of taking the risk. Detachable covers can also be taken back to our Sector
    43 or Sector 49 store and returned to you.
