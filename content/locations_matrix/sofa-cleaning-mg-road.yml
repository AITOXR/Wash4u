body: |-
  Most sofa cleaning enquiries we get from MG Road are not about a spill. They are about a handover. This stretch of old Gurugram runs on furnished rentals and service apartments — a flat is let with the sofa already in it, then let again two years later to someone else, and nobody has ever lifted the seat cushions in between. The call usually comes a week before a tenant moves in, or the morning after one moves out, when somebody finally sits on that three-seater and realises what it smells like.

  That is why we do this **in your flat**, not in a workshop. Nothing gets carried down. A lot of the housing along the MG Road spine is older stock — narrow lifts sized for two people and a suitcase, or third-floor builder units with no lift at all. Getting a bulky sofa out of one of those is how frames get cracked. We bring the shampoo and the hot-water extraction unit to the drawing room, mask the floor, work the fabric section by section, and pull the dirty water back out so the foam is left damp rather than soaked.

  The other MG Road factor is the road itself. Flats facing the arterial corridor take in a constant fine grey dust through balcony doors, and it settles into weave and buttoning long before anything looks stained. On light upholstery it shows first on the arms and headrest line.

  We patch-test the fabric before we touch the whole piece, and we tell you honestly if a stain has already set past what extraction will lift. Purana sofa, nayi jaan — but only where the fabric will actually take it. Our Sector 43 shop at Vyapar Kendra is the team that comes across.
faqs:
- q: I'm handing over a rented flat on MG Road next week. Can you clean the sofa in place?
  a: Yes — that is the most common reason people book us here. We work inside the flat, so nothing has
    to be moved out or stored. If the landlord or agent wants to inspect afterwards, we can do it while
    the flat is still empty, which is easier for everyone.
- q: My building has a small lift and a service-lift timing rule. Is that a problem?
  a: No. Because we clean in the flat, the lift only has to carry our extraction unit and the technician,
    not your furniture. Just tell us your RWA's service-lift window when you book and we will fit the
    visit inside it.
- q: How wet will the sofa be, and my flat faces the main road so I can't leave windows open?
  a: Extraction pulls most of the water back out, so the foam is left damp rather than soaked. With MG
    Road-facing flats we usually suggest running the ceiling fan in that room instead of opening balcony
    doors — it dries the fabric without pulling road dust straight back into it.
- q: The fabric is old and I don't know what it is. Will it survive?
  a: We patch-test on a hidden section — usually under the seat or behind the skirt — before doing the
    whole piece. Older upholstery on long-let flats can be sun-faded or already weak at the arms, and
    if that is the case we will tell you before we start rather than after.
