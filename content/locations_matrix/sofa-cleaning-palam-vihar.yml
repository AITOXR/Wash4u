body: |-
  Palam Vihar is a township of independent houses, and that changes what a sofa cleaning job actually looks like. A three-bedroom flat has one sofa set. A plotted house here usually has a drawing room set downstairs that guests see, a second, more-used sitting area upstairs, a diwan or floor seating, plus dining chairs with fabric seats. It adds up. Most of it has never been deep-cleaned, only wiped and covered.

  Ground-floor drawing rooms are also the reason the fabric gets dirty faster than people expect. Windows open straight onto the street and the front lawn, so fine dust settles into the weave and works its way down into the foam. Vacuuming lifts the top layer. It does not touch what is sitting two inches inside the cushion — which is why an old sofa smells faintly of dust even when it looks clean.

  We clean it where it stands. Dry vacuum first, then a fabric-appropriate shampoo worked into the upholstery, then hot-water extraction to pull the soil and the solution back out. It is done inside your house, so nothing gets carried away and nothing gets swapped. We check the fabric first: cotton, chenille, velvet, suede-finish and leatherette do not all take the same treatment, and cane or wooden-frame sofas with loose cushions are handled differently again.

  Palam Vihar makes this easier than most parts of Gurugram. No lift to book, no RWA clearance, no hauling equipment through a tower lobby — we park outside your gate and work off your own ground-floor power and tap. Ghar ka sofa, ghar mein hi saaf.

  Since we are already at your door, curtains, blankets and bedsheets can go back with us on the same visit — pickup and delivery across Gurugram is free, and every piece is counted with you and given a written receipt.
faqs:
- q: Do you take the sofa away to your store?
  a: No. Sofa and upholstery cleaning is done in your home. The set stays exactly where it is, we bring
    the machine and the water we need, and nothing leaves your house. If you want curtains, blankets or
    bedsheets washed as well, those we do collect — counted with you at the door and returned against
    a written receipt.
- q: My house has a lawn and open windows on the front. Will the sofa just get dusty again?
  a: It will pick up surface dust again, as everything does. What extraction removes is the embedded soil
    deep in the cushion foam and the weave, which is what causes the dull colour and the stale smell.
    That does not come back in a fortnight. Keeping the front windows shut on windy afternoons buys you
    a good deal more time.
- q: Some of our upholstery is old and the colour is not what it used to be. Is it safe?
  a: We patch-test on a hidden section — usually the back or under a cushion — before touching the visible
    area, and we match the method to the fabric. Velvet, chenille, cotton weave and suede-finish all behave
    differently. If a fabric is too fragile or the dye is unstable, we will tell you before we start rather
    than risk it.
- q: Can you do curtains and sofas in the same visit?
  a: Yes, and in Palam Vihar that is usually the sensible way to do it. Houses here often have tall or
    double-height windows with heavy curtains that are a nuisance to take down twice. We clean the sofas
    in place and take the curtains, blankets and bedsheets with us at the same time. Call or WhatsApp
    +91 63 67 600 500 to fix a slot.
