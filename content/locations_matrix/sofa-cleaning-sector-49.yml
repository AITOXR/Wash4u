body: |-
  **Our Arcadia store is in Sector 49.** AG-75, Ground Floor, Block-A, Unitech Arcadia. That matters more for sofa cleaning than for anything else we do, because a sofa cannot be sent anywhere — the work happens in your living room, and the team walking in is coming from a shop a few minutes away, not across Gurugram.

  Sector 49 and the Sohna Road stretch around it is condominium country. Uniworld Gardens, Nirvana Country and the towers in between are full of three-seater fabric sofas in living rooms that double as the children's play area and the dining table. The calls we get here are seasonal and predictable: after a birthday party, before family arrives, and — constantly — at the end of a tenancy. A lot of flats here change hands. Tenants want the upholstery looking right before the handover inspection; landlords want it done before the next family sees it.

  We shampoo and hot-water extract in place. The team brings equipment and water handling, works on one seat at a time, and lifts out what has soaked into the foam rather than just brightening the surface. Fabric type, colourfastness and the age of the stain decide the approach, so we look before we commit. Leather and rexine are treated differently again — tell us which you have when you book.

  Practical bits for Sector 49 towers: give your society gate our name in advance, and let us know if the flat is above the floor your service lift reaches. We work around your furniture layout, and we tell you honestly if a stain has set permanently instead of promising a miracle.

  Same team, same standard as the laundry counter at Arcadia. Har daag ka perfect care.
faqs:
- q: Do you clean the sofa at my flat or take it away?
  a: At your flat. Nothing leaves your home. We bring the shampooing and extraction equipment to you,
    work seat by seat, and clean up after ourselves. For Sector 49 flats that means no lift wrangling
    and no gap where you have nowhere to sit.
- q: I'm moving out of a rented flat in Sector 49. Can you do it before the handover?
  a: Yes — this is a large part of what we do here. Book it once your furniture is settled or before the
    final inspection, whichever suits. We give a written acknowledgement of the job, which is often useful
    to show a landlord or agent.
- q: Will the sofa be wet and unusable afterwards?
  a: Extraction pulls most of the moisture back out, so it is damp rather than soaked. Drying time depends
    on the fabric, foam thickness and airflow in the room. We'll tell you on site what to expect and to
    keep windows or the fan on until it's fully dry — we don't guarantee a fixed number of hours.
- q: Can you remove a stain I've already tried to clean myself?
  a: Often, yes — customers regularly tell us a stain they'd attacked at home came out with us. But home
    attempts can set some stains, and old ones on light fabric may not fully lift. We'll look first and
    say honestly what we think is achievable before we start.
