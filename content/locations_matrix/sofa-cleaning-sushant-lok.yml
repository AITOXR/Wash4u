body: |-
  **Our Vyapar Kendra shop is inside Sushant Lok.** Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Road, Block C, Sushant Lok Phase I, Sector 43. That matters more for sofa cleaning than for anything else we do, because a sofa never leaves your house. Our team walks or drives a few minutes with the machine, does the work in your drawing room, and packs up. No van waiting on the road for an hour, no negotiating with the RWA gate about a pickup vehicle.

  Sushant Lok is an old colony by Gurugram standards, and it shows in the furniture. Phases I to III are full of large L-shaped fabric sets and heavy teak-frame sofas from the nineties and two-thousands — the kind that were bought once, reupholstered once, and have not moved since. In a builder floor on a narrow staircase, that sofa is not going anywhere. In-home shampoo and hot-water extraction is the only honest option: we work the cleaning solution into the fabric, then pull the loosened dirt and the water back out, so the foam underneath is not left soaking.

  What we usually find here is not one dramatic stain. It is years of body oil on the headrest and armrests, dust that has settled deep because the colony sits on busy internal roads, and the grandchildren's chapter — juice, chocolate, pen. Households with older residents often also want the dining chairs and the bedroom headboard done in the same visit, and that is easier for us here than anywhere else in Gurugram.

  Ek hi ghar, ek hi visit. We will tell you honestly beforehand if a fabric is likely to keep a watermark or if the colour is already gone — better that than a surprise after the sofa has dried.

  Call or WhatsApp **+91 63 67 600 500**, or write to **care@wash4you.in**.
faqs:
- q: Do you take the sofa away to your shop?
  a: No. Sofa and upholstery cleaning is done entirely inside your home. We bring the shampooing and extraction
    equipment to you, work in your drawing room, and clear up afterwards. Nothing gets loaded into a vehicle,
    which is exactly why this suits Sushant Lok builder floors with narrow staircases and no lift.
- q: How close is your shop to Sushant Lok?
  a: It is in Sushant Lok. Our Vyapar Kendra store is at Gate No. 3, Shop No. 180, GF Shushant, Vyapar
    Kendra Road, Block C, Sushant Lok Phase I, Sector 43. If you want to see us in person before letting
    a team into your house, walk in and talk to us first.
- q: Will the sofa be soaking wet afterwards?
  a: The extraction step exists precisely to avoid that. After the shampoo has lifted the soil, the machine
    pulls the water and dirt back out, so the fabric is left damp rather than wet and the foam inside
    is not waterlogged. We will tell you how long to leave it before sitting on it, based on the fabric
    and the weather that day.
- q: Can you also do dining chairs, headboards and other upholstery in the same visit?
  a: Yes, and most Sushant Lok households ask for it. Dining chair seats, bed headboards, ottomans and
    cushioned window seats all take the same treatment. Tell us what you want covered when you call so
    we bring the right heads and plan enough time.
