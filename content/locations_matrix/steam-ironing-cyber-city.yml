body: |-
  **Cyber City runs on shirts.** Five days a week, five shirts minimum, plus the trousers and the jacket that comes out when a client visit lands in the calendar. Most of it isn't dirty — it's clean, folded, and creased from sitting in a wardrobe or a suitcase. That's what press-only steam ironing is for: no wash cycle, no detergent, just steam and shape.

  It matters more here than in a family neighbourhood because of what's hanging in Cyber City wardrobes. Poly-cotton and blended formal shirts scorch and go shiny under a dry hotel iron. Wool-blend suit trousers need their crease put back in one line, not flattened at the seat. Linen shirts in the Gurugram summer want relaxing, not baking. Steam does that; a borrowed iron on a bedsheet does not.

  The logistics are the other half. Building security will not send a rider to your floor, and nobody wants to argue with a lobby desk at 9.40am. So we agree a point and a time on WhatsApp — your flat in the towers nearby, the tower reception, or the gate — and we work around office hours rather than through them. Evening handovers are normal for us here.

  Volume is the reason we count in front of you. Twelve shirts and four trousers is a genuinely easy pile to get wrong, so your order is counted with you at the door, written on a receipt you keep, and kept packed separately from every other customer's order. Nothing gets merged into a common lot.

  Everything comes back from a real counter — our Sector 43 store at Vyapar Kendra or our Sector 49 store at Unitech Arcadia. Pickup and delivery across Gurugram is free. Nazuk kapde, extra care — delicate fabrics get the gentler setting, and we tell you before, not after.
faqs:
- q: I only need pressing, not washing. Is that a separate service?
  a: Yes. Steam ironing is press-only, for clothes that are already clean. Send us the shirts and trousers
    straight from your wardrobe or suitcase and we press them without putting them through a wash cycle.
- q: Can you collect from my office in Cyber City?
  a: We collect wherever you can actually receive us — your flat, the tower reception, or the gate. Building
    security rarely allows a rider up to a working floor, so message us on WhatsApp at +91 63 67 600 500
    and we will fix a point and a time that works around your office hours, including evenings.
- q: Will you press a suit jacket and formal trousers, or only shirts?
  a: Both. Jackets are steamed to hold their shape rather than pressed flat, and trousers are creased
    along the existing line. Tell us if a garment is wool-blend or has an unusual finish and we will set
    the steam accordingly.
- q: I am sending fifteen shirts at once. How do I know nothing goes missing?
  a: Your order is counted with you at the point of pickup and you get a written receipt on the spot.
    Every customer's clothes are packed and processed separately from every other order, so a large shirt
    bundle never gets mixed into someone else's lot.
