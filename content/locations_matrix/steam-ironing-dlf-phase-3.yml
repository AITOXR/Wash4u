body: |-
  **Most steam ironing in DLF Phase 3 starts with a suitcase or a shared washing machine.** The area sits a walk or a short auto ride from Cyber City, and a large share of its housing is builder floors, PGs and flats split between two or three working professionals. That means plenty of people here own a full week of office wear and no iron at all — or own an iron with nowhere to set up a board in a room shared with a flatmate. Washing gets handled somehow. Pressing is the part that doesn't. This service is press-only: you send clothes that are already clean, we steam press them and return them on hangers or folded, whichever way you actually store them.

  What we collect in Phase 3 is fairly predictable — cotton and linen office shirts, chinos and formal trousers, kurtas, salwar suits, dupattas that crease the moment they're put away. And the unpacking pile. Tenant turnover here is high enough that we regularly collect from someone who moved in that same week, with an entire wardrobe that has been folded flat in a bag for a fortnight. Steam relaxes those creases without the shine and scorch marks a dry hot plate leaves on synthetic office blends.

  Collections mean guard-gate entries, narrow internal lanes and third-floor walk-ups with no lift. Our rider comes to your door on your floor, not to the gate. Where flatmates send clothes on the same slot, each person's garments are counted with them separately, packed separately and receipted separately, so nobody's shirts end up in the wrong room. Pickup and delivery are free across Gurugram. Nazuk kapde, extra care — silk, chiffon and anything beaded is pressed at lower heat through a cloth barrier.
faqs:
- q: I wash my clothes at home. Can you only iron them?
  a: Yes. This is a press-only service. Send clothes that are already clean and dry, and we steam press
    them and return them ready to wear. If something needs washing or dry cleaning first, tell us at pickup
    and we will keep it separate.
- q: Three of us share a flat in DLF Phase 3. Can we send our clothes in one pickup?
  a: Yes, and each person is treated as a separate order. Your garments are counted with you at the door,
    packed in their own bag and given their own written receipt, so shared-flat and PG orders never get
    mixed up on return.
- q: Can you collect from a PG or a builder floor without a lift?
  a: Yes. Our rider comes up to your floor and to your door. If your building or gate needs a name at
    the register or a call before entry, just tell us when you book on WhatsApp at +91 63 67 600 500.
- q: I have just moved in and everything has been packed for weeks. Will steam fix deep fold creases?
  a: Usually, yes. Steam relaxes set-in fold lines far better than a dry iron, and it does it without
    leaving shine or scorch marks on polyester office blends. Send the whole unpacking pile in one go
    rather than piece by piece.
