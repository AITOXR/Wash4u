body: |-
  Wardrobes along Golf Course Road have a particular problem: a lot of what hangs in them is already clean and still unwearable. A silk saree folded away since the last wedding. A linen jacket back from the tailor. Six outfits pulled out the evening before a function, every one of them creased along the fold lines. None of it needs washing. It needs pressing — and most of it should never touch a hot iron plate directly.

  That is what steam ironing is for. Steam relaxes the fibre so the crease drops out, rather than crushing it flat under a heated plate. On chiffon, georgette, tussar and heavy silk that avoids the shine marks and iron-shaped patches a domestic iron leaves behind. On zardozi, sequin, mirror and dori work we steam **around** the embellishment rather than over it, so nothing melts, lifts or flattens and the handwork stays sitting proud of the cloth. Structured pieces — suit jackets, sherwanis, pleated trousers — keep their shape instead of gaining a pressed-in seam line down the shoulder.

  Because it is press-only, garments must come to us already clean. If we spot a mark, we flag it and stop; heat sets a stain permanently, and that is not a call we make on your behalf.

  Collection in this corridor runs through the tower gate. Tell us the tower and we coordinate with the guard or concierge desk — our staff carry ID and use the service lift, so nobody is standing in your lobby. Everything is counted with you at the door, acknowledged with a written receipt, and packed separately from every other customer's order. Nazuk kapde, extra care — your clothes never share a bundle with anyone else's.
faqs:
- q: Can you steam iron a lehenga or saree with zardozi, sequin or mirror work?
  a: Yes — this is most of what we press on Golf Course Road. We steam around the embellished panels rather
    than running an iron over them, so sequins do not melt, mirrors do not loosen and zardozi keeps its
    raised finish. The plain ground fabric, borders and lining get the crease taken out properly.
- q: Can your staff collect from the gate desk instead of coming up to the flat?
  a: Yes. Give us your tower and we coordinate the handover with the guard or concierge desk. If you would
    rather we come to the door, our staff carry ID and use the service lift. Either way the count happens
    in front of you or your household staff, with a written receipt at pickup.
- q: My outfit is clean but has one faint mark. Will you press it?
  a: We will call you first. Steam ironing is a press-only service, and heat drives a mark permanently
    into the fibre — once pressed, it is far harder to remove. We would rather flag it and let you decide
    between dry cleaning it first or having it pressed as is.
- q: I have a whole set of outfits to press before a wedding. Can you handle a bulk lot?
  a: Yes, and it is worth sending them together — a single lot stays as one order, is counted once with
    you, and comes back packed separately from every other customer's clothes. Tell us which pieces are
    embellished or delicate when you hand them over so they are separated for hover-steaming.
