body: |-
  Most laundry work on MG Road never leaves the house. Washing machines sit in kitchen balconies across the older Sushant Lok and DLF blocks along the spine, domestic help runs a load most mornings, and the clothes come out clean. What they don't come out is pressed. The iron stays in a cupboard, the board doesn't fit anywhere sensible in a 1990s two-bedroom, and the old press-wallah cart that used to park under the metro line is a lot harder to find than it was.

  That is the whole reason this service exists. You wash. We press. Nothing more.

  Send us shirts and trousers that are already clean, and they come back on hangers with proper steam — collars flat, cuffs sharp, pleats where the garment intends them, and no shine burned into dark wool trousers by a dry iron pushed too hard. Cottons, linens, silk kurtas and dupattas, saree pleats, blazers that have been folded in a suitcase, uniforms and formal wear for the retail and office crowd working the mall stretch. Anything with a coating, sequin work or an unusual finish gets pressed with a cloth or from the reverse, not straight onto the face of the fabric.

  Collection along MG Road is planned around how the road actually works. The service lanes under the metro viaduct are one-way in stretches and there is nowhere to stand a vehicle, so our rider parks properly and comes to your gate or lobby. In the older gated blocks and the service apartments, where the guard desk is the only way in, we call before arriving. Your pieces are counted with you at the door, packed apart from every other customer's order, and you get a written receipt at pickup. Our Sushant Lok Phase I store is minutes away, so MG Road is one of our shortest runs.

  Free pickup and delivery, as always.
faqs:
- q: Do you take clothes that are already clean, or must you wash them first?
  a: Already clean is exactly what this service is for. Bring us washed and dried garments and we press
    them only — no wash, no charge for one. If something turns out to be stained or carrying odour, we
    will tell you before pressing and you can decide whether to send it through laundry or dry cleaning
    instead.
- q: Can you press a saree, dupatta or a heavily worked kurta?
  a: Yes. Sarees are pleated and pressed by hand, dupattas are steamed rather than crushed under a hot
    plate, and anything with zari, sequins, mirror work or a printed coating is pressed from the reverse
    or through a cloth so the surface is not flattened or scorched.
- q: How does pickup work if I live in one of the older gated blocks off MG Road?
  a: Our rider calls you before he reaches, parks off the service lane, and comes to your gate or building
    lobby rather than expecting you to come down to the road. In buildings where entry is guard-desk-only,
    including the service apartments, we collect and hand back at the desk if you prefer — the count and
    the receipt still happen with you present.
- q: I only have four or five shirts. Is that worth a pickup?
  a: Yes. MG Road is one of our shortest runs from the Sushant Lok Phase I store, so small press-only
    lots are normal here and pickup and delivery are free. Many customers on this stretch send a weekly
    bundle of office shirts and nothing else.
