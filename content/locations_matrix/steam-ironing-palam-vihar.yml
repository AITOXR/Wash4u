body: |-
  Most Palam Vihar homes already wash at home. It's the ironing that piles up — and in a plotted township of independent houses, the pile is a whole house's worth, not one flat's. Three floors, several bedrooms, one board and one iron, usually on a Sunday. Our steam ironing service is press-only: you send us what's already clean, we return it finished.

  Where this matters most in Palam Vihar is household textiles. Independent houses have far more curtain fabric than apartments do — stairwell windows, long drops, heavy panels that simply will not fit on a domestic board, and which come back from a home wash creased down every fold. Steam relaxes those creases without pressing a shine into synthetic and blended curtain fabric, which is exactly what a hot dry iron does to it. The same applies to bedsheets and quilt covers from a house with four or five beds, to blankets and razais lifted out of storage in October with hard box-folds set into them, and to loose sofa and cushion covers that have been washed at home before guests arrive. Nazuk kapde, extra care — sarees, suit sets and anything sheer are steamed, not scorched.

  Collection works the way it does everywhere we go in Gurugram, and it suits gate-to-gate houses well: we count the order with you at your door, pack it separately from every other customer's, and hand you a written receipt before we leave. Bulky curtain and bedding loads are logged piece by piece so nothing gets lost in the volume. If we open something and find a stain, we tell you rather than pressing over it — it can go for washing or dry cleaning at Sector 43 or Sector 49 instead.
faqs:
- q: Can you steam iron long curtains that don't fit on a home ironing board?
  a: Yes — full-length curtain panels from independent-house windows and stairwells are a large part of
    what we press for Palam Vihar customers. They are steamed flat rather than run over with a hot dry
    iron, so blended and synthetic fabrics don't come back with shine marks along the folds.
- q: Do the clothes and linen need to be washed before I send them?
  a: Yes. Steam ironing is press-only, for items that are already clean. If we spot a stain or a soiled
    patch while pressing, we'll flag it to you instead of ironing over it, and you can decide whether
    it goes for washing or dry cleaning at our Sector 43 or Sector 49 store.
- q: Will bedsheets and blankets come back folded or on hangers?
  a: Whatever suits the item. Bedsheets, quilt covers, blankets and sofa covers are pressed and flat-folded
    so they go straight into the almirah. Shirts, kurtas, suit sets and sarees are returned on hangers
    so the press holds until you wear them.
- q: Is pickup available in Palam Vihar, and how does it work for an independent house?
  a: Free doorstep pickup and delivery covers Palam Vihar. Message or call +91 63 67 600 500 to fix a
    collection time; our team comes to your gate, counts the order with you there, packs it separately
    and leaves a written receipt — no lobby drop-offs or handing bags to a guard.
