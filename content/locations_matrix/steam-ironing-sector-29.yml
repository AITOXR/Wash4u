body: |-
  Most steam ironing requests we get from Sector 29 are not for everyday office shirts. They are for clothes that live on a hanger for weeks and then have to look perfect for one evening — the satin slip dress, the sequinned kurta, the linen shirt that came out of the wardrobe with a hard fold line down the sleeve, the saree that was folded after the last function and has kept the crease ever since.

  That is a different job from pressing a clean cotton shirt. Steam ironing is press-only: the garment is already clean, and it just needs the fabric relaxed rather than flattened. On chiffon, georgette, satin, viscose and anything with sequins, beadwork or foil print, a hot plate pressed straight onto the surface is what leaves shine marks and melts embellishment. Steam does the work instead, with the iron kept off the delicate face of the cloth and pressing done from the reverse where the fabric asks for it. Nazuk kapde, extra care — that is the whole of this service.

  Timing is the other Sector 29 specific. Demand here clusters at the end of the week, before dinners, birthdays and the wedding season, so it helps to hand over party wear earlier in the week rather than on the evening you need it. Our Sector 43 store at Vyapar Kendra is a short run from the Sector 29 block, and pickup is free at your door across Gurugram.

  Everything is counted with you at the door and you get a written receipt, so a borrowed lehenga or a rented blazer is never in doubt. Your order is packed separately from every other customer's. Pressed garments come back on hangers, not folded flat — folding a freshly steamed dress before you wear it undoes the entire point.
faqs:
- q: Do you steam iron party wear with sequins, beads or zari?
  a: Yes. Embellished garments are pressed with steam and the iron kept off the decorated face, working
    from the reverse where the fabric allows. Tell us at pickup if a piece has loose beadwork or a rented
    tag so it can be handled accordingly.
- q: My clothes are clean, I only need them pressed. Is that allowed?
  a: That is exactly what this service is. Steam ironing is press-only for already-clean clothes. If something
    also has a mark on it, mention it and we will tell you honestly whether it needs cleaning first rather
    than pressing a stain in.
- q: Can you collect from Sector 29 in the evening?
  a: We collect across Gurugram, but the restaurant and club strip is at its busiest after dark. Daytime
    slots are usually smoother for both pickup and delivery, so we suggest booking party wear earlier
    in the week rather than the night you need it.
- q: How do the clothes come back?
  a: On hangers, so the press holds. Your order is counted with you at the door, packed separately from
    every other customer's order, and acknowledged with a written receipt at pickup.
