body: |-
  **Most Sector 49 flats have a washing machine. Almost none have a proper ironing set-up.**

  That is the honest reason this service exists here. In the condominiums along the Sohna Road corridor — Uniworld Gardens, Nirvana Country and the towers around them — clothes get washed at home, often by household help, and then sit folded and creased because nobody has the board, the space in a 2BHK, or the twenty minutes on a weekday morning. Steam ironing is press-only: you send clothes that are already clean, we press them, and they come back on hangers ready to wear.

  Our Arcadia store is inside your sector — AG-75, Ground Floor, Block-A, Unitech Arcadia, Sector 49. That changes the logistics. You can hand over a stack at the counter yourself on the way past, or book free pickup from your tower and skip the trip entirely. Either way the count is done with you, your clothes are bagged separately from every other customer's, and you get a written receipt at pickup.

  What we actually see from Sector 49 is fairly predictable: shirts and trousers for the Golf Course Extension and Cyber Hub commute, kurtas and salwar sets before a function, school uniforms in a Sunday-night bundle, and the linen or cotton shirts that come out of a home dryer looking defeated. Each of those wants different heat. Linen and cotton take real steam. Georgette, chiffon, silk-blend kurtas and anything with sequins or zari get pressed cool, with a cloth between iron and fabric — nazuk kapde, extra care. We check the care label rather than guessing.

  Press-only also means we will tell you when ironing is not the answer. If a garment has a stain or an odour, pressing sets it in. Send it for laundry or dry cleaning first, and the press after that will actually hold.
faqs:
- q: Do I have to send my clothes for washing too, or can I get ironing alone?
  a: Ironing alone is fine — that is exactly what this service is. Send clothes that are already clean
    and washed at home, and we press them only. If something is stained or smells, tell us, because pressing
    will lock it in; that garment is better sent for laundry or dry cleaning first.
- q: Can I just walk into the Sector 49 store instead of booking a pickup?
  a: Yes. Our Arcadia store is at AG-75, Ground Floor, Block-A, Unitech Arcadia, Sector 49 — inside the
    sector itself. Many residents drop a stack at the counter and collect it themselves. If you would
    rather not carry it, free doorstep pickup and delivery from your tower is available across Gurugram,
    including all of Sector 49.
- q: Will you press delicate kurtas, sarees and embellished clothes?
  a: Yes, but not the same way as a cotton shirt. Georgette, chiffon, silk blends and anything with sequins,
    zari or beadwork are pressed at low heat with a protective cloth in between, and embellished areas
    are worked around rather than pressed flat. We follow the care label on the garment.
- q: How do I know my clothes will not get mixed up with someone else's?
  a: Every order is counted with you at the door or at the counter, packed separately from every other
    customer's order, and acknowledged with a written receipt at pickup. Nothing goes into a shared pile,
    so what you hand over is what comes back.
