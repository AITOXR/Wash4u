body: |-
  **You wash it. We press it.** That is the whole of steam ironing — no detergent, no wash cycle, just heat, steam and a proper finish on clothes that are already clean.

  Along the Sohna Road corridor, Sectors 47, 48 and 49, almost every flat has its own machine, and most households wash at home on a Sunday. The washing is rarely the problem. The problem is the pile that comes out of the drum on Sunday evening and still has to be worn on Monday morning — office shirts, formal trousers, cotton kurtas, linen that creases if you look at it, plus school uniforms that need a crisp collar five days a week. Sending a weekly batch for pressing is a far more sensible use of money than sending clean clothes for a full wash they do not need.

  The logistics here work in your favour. Our Arcadia counter sits at AG-75, Block-A, Unitech Arcadia, Sector 49 — right on this stretch, so a press-only batch does not travel far. Because condominium handovers happen at your door and not at the guard desk, every piece is counted with you before it leaves the flat, your bundle is kept packed separately from every other customer's, and you get a written receipt at pickup. With forty shirts going out and forty coming back, that count is the whole point.

  One honest limit: heat sets stains. If we find a mark on something you have sent for pressing — collar grime, an oil spot, a curry splash that survived the home wash — we will set that piece aside and tell you rather than iron the stain permanently into the fabric. You can then send it through a proper wash or stain treatment instead.

  Free doorstep pickup and delivery across Gurugram. WhatsApp +91 63 67 600 500 to book a batch.
faqs:
- q: Do you wash the clothes I send for steam ironing?
  a: No. Steam ironing is a press-only service for clothes that are already clean. If you want washing
    as well, tell us at pickup and we will book it as a laundry order instead.
- q: What happens if you find a stain on a garment sent only for pressing?
  a: We set it aside and tell you. Ironing over a stain drives it into the fibre with heat and makes it
    much harder to remove later, so we would rather return that one piece unpressed and let you decide
    whether to send it for a wash or stain treatment.
- q: How do you handle pickup from a gated condominium on Sohna Road?
  a: Our rider comes to your door, not the guard desk. Every piece is counted with you before the bag
    leaves the flat, and you get a written receipt at that moment. Delivery is counted back the same way.
- q: Which Wash4You store covers the Sectors 47–49 stretch?
  a: Our Arcadia store — AG-75, Ground Floor, Block-A, Unitech Arcadia, Sector 49, Gurugram 122018. You
    are welcome to drop clothes there yourself, or use the free pickup and delivery.
