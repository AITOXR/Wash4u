body: |-
  **The Vyapar Kendra store is in Sushant Lok Phase I.** Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Road, Block C, Sector 43. If you live in Phase I, II or III, this is not a van that visits your colony — it is the counter your clothes are actually pressed at. You can walk in with a bundle, or ask for free doorstep pickup and we will come across the block.

  Steam ironing here is press-only: clothes you have already washed at home, or had washed, that just need finishing. That is most of what Sushant Lok sends us. Builder floors and independent houses with a washing machine and no one to press ten shirts on a Sunday night. Cotton sarees and starched kurtas that a dry plate iron flattens instead of finishing. School uniforms in a stack every week. Linen and viscose that scorch or shine under direct heat but come back soft under steam.

  Steam works differently from a hot plate. The heat goes through the fabric with moisture rather than pressing down on it, so pleats fall properly, synthetics do not glaze, and embroidery and sequins are worked around rather than driven flat. Nazuk kapde, extra care — the fragile pieces are handled by hand, not run under a machine.

  Collection in an older colony like this is straightforward and we keep it that way. Your bundle is counted with you at the door, so we both agree on the number before it leaves. Your clothes are packed separately from every other customer's — nothing shared, nothing mixed. You get a written receipt at pickup. Eco-friendly through and through, and safe on fabric, which for press-only work is the whole job. Over 1000 customers across Gurugram already use us; a good number of them are a five-minute walk from the counter.
faqs:
- q: Do you press clothes I have already washed at home?
  a: Yes — that is exactly what this service is. Steam ironing is press-only, for clean clothes that just
    need finishing. No washing charge is added because nothing is washed.
- q: Can I drop my clothes at the Sushant Lok store myself?
  a: Yes. The Vyapar Kendra store is at Gate No. 3, Shop No. 180, GF Shushant, Vyapar Kendra Road, Block
    C, Sushant Lok Phase I, Sector 43. Walk in with your bundle, or call +91 63 67 600 500 and we will
    collect from your door free of charge.
- q: Will steam ironing damage a cotton saree or an embroidered kurta?
  a: Steam finishes fabric using moisture rather than pressing a hot plate onto it, so pleats set properly
    and delicate weaves are not glazed or flattened. Embroidery, sequins and fragile pieces are handled
    by hand. Tell us at pickup if a garment needs special attention.
- q: How do I know my clothes will not get mixed up with someone else's?
  a: Every order is counted with you at the door, packed separately from every other customer's order,
    and acknowledged with a written receipt at pickup. Nothing goes into a shared bundle.
