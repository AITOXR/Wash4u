lede: The small things that finish an outfit are the ones an ordinary wash ruins. We clean them one at
  a time, by hand, with free pickup and delivery anywhere in Gurugram.
body: |-
  ## What actually happens to a tie

  A necktie is not one piece of fabric. It is an outer shell, a wool or cotton interlining that gives the knot its body, a tipping fabric at both ends, and a single slip stitch running the length of the back that lets the whole thing stretch and recover every time you tie it. Put that in water and the layers shrink at different rates. The shell ripples, the interlining twists, and nothing brings it back. So ties go through solvent cleaning, spotted by hand first, then finished over a shaped form so the edges stay softly rolled. A tie that comes back with hard, knife-flat edges has been ironed, not finished.

  ## Caps: check the brim before you hand it over

  Press the peak of your cap between finger and thumb. If it feels papery and holds a crease, the stiffener inside is cardboard, and that cap can never be wet washed — the brim buckles and stays buckled. Plastic-stiffened peaks spring back and will take a controlled hand clean. The other thing we look at is the sweatband. That grey-white tide line is two problems in one: salt, which dissolves in water, and sebum, which does not, so a cap needs both an aqueous and a solvent step to shift it. Sweat that has sat through a Gurugram summer oxidises into the cotton and yellows it. We can usually lighten that. We cannot always erase it, and we will tell you which one you are getting before we start.

  ## Scarves, stoles and dupattas

  Pashmina, cashmere and fine wool are washed by hand with no agitation and dried flat, because a wet knit stretches under its own weight the moment you hang it. Fringes are combed straight while still damp; left alone they dry into knots that then have to be worked loose dry, which sheds fibre. Block-printed and bandhani dupattas get tested hardest, since a lot of hand-printed dye is unfixed, and one bleed test on a seam allowance is what stands between a beautiful dupatta and a pink haze across the white ground. Real zari is metal wrapped around a thread core: it tarnishes and it hates heat, so anything with zari, gota or sequins is pressed on the reverse, through a cloth, at low temperature.

  ## What cannot be saved

  Turmeric on silk usually leaves a yellow ghost — curcumin is a dye, and it bonds to protein fibre. Perfume or attar sprayed straight onto a silk tie or scarf strips colour where it landed, and that pale patch is permanent. So is the faded line along the fold of a scarf that has hung in one position in a wardrobe for years; that is sunlight, not soil. Ink and paan are judged item by item. And if a tie has thinned at the knot after years of the same four-in-hand, cleaning will make that visible. It did not cause it.

  ## Before you hand the item over

  Tell us what the stain is and roughly how old it is — that one sentence changes the chemistry we start with. Tell us if you have already tried something at home, because lemon, vinegar, toothpaste and hairspray all leave residues we have to work around. Take off brooches, tie pins and cap badges. Nazuk kapde, extra care — delicate things, handled slowly, and counted with you at the door before they leave.
what_we_clean:
- item: Silk and printed neckties
  detail: Solvent-cleaned and finished over a form so the edges stay softly rolled. Bow ties and cravats
    too.
- item: Caps and hats
  detail: Baseball caps, bucket hats and knitted beanies. Brim stiffener and sweatband checked first,
    since a cardboard-stiffened peak cannot go anywhere near water.
- item: Scarves, stoles and pashminas
  detail: Washed without agitation, dried flat, fringes combed straight while damp so they do not set
    into knots.
- item: Dupattas with zari, gota or sequins
  detail: Bleed-tested on a seam allowance, then pressed on the reverse through a cloth at low heat to
    protect the metal thread.
- item: Pocket squares and handkerchiefs
  detail: Hand-rolled hems kept rounded rather than flattened, which is what lets a pocket square sit
    up in the pocket.
- item: Fabric belts, sashes and kamarbandh
  detail: Cleaned flat and reshaped. Buckles and hooks are masked so nothing marks the cloth.
- item: Bandanas, headbands and safa cloth
  detail: Long turban cloth is handled full-length and returned folded to length, not creased into a small
    square.
- item: Mufflers, gloves and knitted accessories
  detail: Wool and acrylic knits only here. Leather belts, gloves and straps go to our leather care instead.
process:
- step: Counted with you at the door
  detail: Small items are the easiest to lose, so every accessory is counted and logged in front of you
    at pickup and acknowledged on a written receipt.
- step: Construction check
  detail: 'We look at what the item is actually made of and how it is built: tie interlining, cap brim
    stiffener, hidden zari, glued trims, loose stitching. Accessories often carry no useful care label,
    so this is done by hand and eye.'
- step: Colourfastness test
  detail: A damp test on a hidden edge or seam allowance before anything else. Hand-block prints, bandhani
    and deep reds on white grounds are the ones that move.
- step: Spotting, one stain at a time
  detail: Stains are worked individually with the right agent for the stain type, not a general pre-soak.
    Oil, pigment and dye stains each need a different first move, and makeup on a scarf edge is usually
    two of them at once.
- step: The cleaning method matched to the item
  detail: Solvent for ties and structured silk, gentle hand washing for knits and cottons. The item decides,
    not the queue.
- step: Drying and reshaping
  detail: Knits flat, caps shaped so the crown does not collapse, fringes combed out. Nothing hangs while
    it is heavy with water.
- step: Finishing and separate packing
  detail: Low-heat pressing where the item allows it, then packed on its own. Your order never shares
    a bag with anyone else's.
faqs:
- q: Can you clean my baseball cap without wrecking the shape?
  a: 'Usually, but it depends on the peak. Press it between your finger and thumb: if it feels like stiff
    card and holds a crease, the stiffener is cardboard and water will buckle it permanently, so we will
    hand-clean only the crown and sweatband and leave the brim dry. If the peak springs back, it is plastic
    and the whole cap can take a controlled hand clean and be dried on a former so the crown keeps its
    shape.'
- q: I spilt something on my silk tie and dabbed it with water. Have I made it worse?
  a: Possibly, and it is the most common thing customers do. Water on silk moves the sizing outward and
    dries into a ring, so you can end up with a watermark that is larger than the original stain. Stop
    there. Do not rub, do not use soap, do not hold it under a tap. Let it dry, bring it in as it is,
    and tell us what the spill was.
- q: Will you clean a heavy dupatta with zari and sequins on it?
  a: Yes. Zari is real metal wound on a thread core, so it tarnishes with harsh chemistry and distorts
    with heat. We clean around it, press on the reverse through a cloth at low temperature, and never
    put a hot iron directly on the work. If sequins are glued rather than stitched, we will point that
    out before starting, because glue can soften.
- q: Can accessories come along with my regular laundry pickup?
  a: Yes, and it is the easiest way to send them. Just tell the person at the door which items are accessories
    so they are logged and bagged separately rather than counted in with your shirts. They follow their
    own process and are packed on their own for return.
- q: My scarf has an old stain and I have no idea what it was. Is it still worth sending?
  a: Send it. Unknown stains are normal on accessories and we will still test and work it. What we will
    not do is promise a result we cannot see yet. After inspection we will tell you honestly whether we
    expect full removal, a visible improvement, or very little, and you decide from there.
- q: Do you clean leather belts, gloves and watch straps here?
  a: Those go to our leather care rather than accessories cleaning, because leather needs pH-balanced
    cleaning and conditioning instead of fabric chemistry. Send them anyway and we will route them correctly.
    Fabric belts, sashes and knitted gloves stay with accessories.
- q: How should I store a tie or scarf between wears?
  a: Roll a tie loosely and lay it in a drawer rather than hanging it folded over a rail, which sets a
    crease and stresses the bias. Store silk scarves flat or loosely rolled, and refold them along a different
    line now and then, since a scarf left in one fold for years fades along that line and no cleaning
    brings the colour back. We return ties rolled for exactly this reason.
