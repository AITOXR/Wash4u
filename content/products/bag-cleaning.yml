process:
- step: Assessment, tagging and your approval
  detail: 'We check the construction before anything else: is the shell leather, coated canvas, PU or
    nylon; is the lining glued or loose; is the edge paint cracking; is the coating lifting anywhere.
    The bag is tagged to your order, existing damage is photographed and sent to you, and we start only
    once you approve — nothing is disputed later.'
- step: Emptied, stripped and masked
  detail: Pockets emptied and the contents returned to you, detachable straps and charms removed and bagged
    separately. Metal hardware is masked before any cleaning agent goes near it, because plating on lighter
    bags is thin and disappears under repeated polishing.
- step: Patch test on a hidden panel
  detail: Every material gets a test on the underside or inside a gusset before the visible panels are
    touched. Dyed suede, unlined canvas and low-cost PU all behave differently, and this is where we find
    out that a bag will bleed colour before it does so on the front.
- step: Interior worked first
  detail: Lining, seams and the base — where crumbs, coin grease and cosmetic residue collect — are cleaned
    in place with controlled moisture. Corners and the seam channels are worked out with a brush rather
    than flooded, so the glue behind the lining is never softened.
- step: Exterior, panel by panel
  detail: Each panel is cleaned seam to seam rather than spot-treated, so you don't end up with a clean
    patch on a dull face. Suede and nubuck are worked dry first with brush and abrasion; smooth leather
    is cleaned wet and then re-conditioned, because cleaning also removes some of the surface oils.
- step: Stain work, within limits
  detail: Ink, dye transfer from dark denim, oil and old water rings are each treated differently, and
    each is attempted only as far as the material takes it safely. Where a mark will not fully clear,
    we stop and tell you rather than push the fabric until it thins.
- step: Reshaped and dried slowly
  detail: The bag is stuffed to its own shape and dried away from heat and direct sun over as long as
    it takes — foam-backed backpacks take the longest. Rushing this is how a bag comes back stiff, misshapen
    or smelling of damp.
- step: Final check and separate packing
  detail: Hardware unmasked and buffed, straps and charms reattached, then packed on its own. Your order
    never shares a bag with another customer's, and it comes back to your door on the schedule we agreed.
what_we_clean:
- item: Leather handbags and slings
  detail: Cleaned panel by panel and re-conditioned afterwards, because cleaning removes surface oils
    along with the dirt. Untreated tan handles are flagged before we start — they darken with use and
    won't return to factory pale.
- item: Coated canvas and monogram totes
  detail: The coating cleans up well and takes handling. The two things we check first are the fold lines
    at the base corners, where a cracked coating cannot be re-laid, and any exposed leather trim, which
    needs a different treatment from the canvas beside it.
- item: Suede and nubuck bags
  detail: Worked dry with brush and abrasion before any liquid comes near them, to lift the nap without
    flattening it. Oil that has already soaked into the nap is the one thing suede rarely gives back.
- item: Laptop backpacks and office totes
  detail: 'The daily Gurugram commuter bag: dust in the outer weave, grit in the base seam, and a foam
    back panel that has absorbed months of sweat. Most of the job is the interior and the drying, not
    the outside.'
- item: School bags and children's backpacks
  detail: Food spills, ink, and grit packed into the wheel housings and base seams. Cleaned with the same
    non-toxic products we use on children's toys, and dried right through before they come back.
- item: Gym and sports bags
  detail: Odour lives in the lining and the padding, not on the shell, so surface wiping never fixes it.
    These are cleaned inside-out and dried fully, which is the only thing that actually clears the smell.
- item: Hard-shell and soft-sided luggage
  detail: Belt scuffs on a hard shell are mostly transferred rubber from other cases and lift off; deep
    gouges don't. On soft luggage we clean the shell, the interior lining and any spill inside, and remove
    old airline sticker adhesive where the surface allows.
- item: Canvas, jute and fabric totes
  detail: Straightforward to clean but easy to shrink or distort. Washed at a controlled temperature and
    dried flat and stuffed so the base stays square and printed panels don't crack.
- item: Clutches and occasion bags
  detail: Beading, sequins, zari and thread work are cleaned by hand around the embellishment rather than
    through it. Loose beadwork is pointed out to you first, since cleaning can finish off a thread that
    was already going.
- item: Diaper and baby bags
  detail: Milk, food and wipe residue in every compartment. Cleaned with non-toxic, biodegradable products
    and dried thoroughly, because a damp insulated pocket is where the smell starts again.
