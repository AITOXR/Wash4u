process:
- step: Opened out and inspected with you
  detail: The cover comes off and the quilt is laid flat. We check the fill type, the quilting and seams,
    whether the fill has already migrated, and any moth holes, old repairs or hidden stains. Everything
    found is counted and noted with you at the door.
- step: Method chosen by fill, and written down
  detail: Cotton batting goes to solvent, down and feather goes to a gentle wash, polyester and microfibre
    go to water. This is decided once and recorded on the docket, so it is not left to whoever handles
    the item next.
- step: Colour test and stain identification
  detail: 'A hidden corner is tested for colourfastness, because dark razai and duvet covers bleed more
    often than people expect. Stains are identified by type first: oil-based and water-based marks need
    opposite treatments, and guessing sets the stain.'
- step: Repairs and pre-treatment
  detail: Split seams and small holes are stitched closed before the item moves, since agitation turns
    a two-inch split into a fill explosion. Spot treatment is worked in by hand around the stitching,
    not sprayed over the whole piece.
- step: Cleaning with room to move
  detail: The item is loaded so it can actually tumble. A quilt crammed into a drum that is too small
    simply gets pressed against the wall and comes out no cleaner than it went in, which is the single
    commonest reason home washing fails on bedding.
- step: Dried to the core, not the surface
  detail: Long, low heat with the item taken out partway so the fill can be broken up and redistributed
    by hand, then returned. Repeated until the middle is dry, because a duvet that goes home with a damp
    core will smell within the week.
- step: Loft, nap and packing
  detail: Down and fibre fill are shaken back out to full loft, plush and mink surfaces are brushed so
    the nap stands up again, and the item is folded and packed to breathe rather than sealed in plastic
    where it would sweat on the way back to you.
what_we_clean:
- item: Hand-stitched cotton razai
  detail: The traditional loose-cotton razai, handled flat and cleaned with solvent rather than soaked,
    so the batting cannot swell and set into ridges at one end.
- item: Down and feather duvets
  detail: Washed rather than solvent-cleaned, because solvent strips the natural oil from down. The long,
    staged drying afterwards is what brings the loft back.
- item: Polyester and microfibre comforters
  detail: The most forgiving of the lot. We check the quilting stitch and baffles first, since a broken
    stitch line lets the fill shift the moment it hits water.
- item: Woollen and Solapur blankets
  detail: Low agitation and controlled heat throughout. Wool felts and shrinks permanently if either is
    pushed too far, and a felted blanket cannot be brought back.
- item: Mink and plush blankets
  detail: Cleaned gently to avoid shedding, then the nap is brushed back up so the surface does not come
    home flattened and patchy.
- item: Dohars, baby quilts and cot bedding
  detail: Extra rinsing so no detergent residue sits against a child's skin, and a close look for the
    milk and food stains that hide in the folds.
- item: Duvet, quilt and razai covers
  detail: Sent in with the filling and cleaned as a set, so the two come back matched and we can see whether
    a dark cover has been bleeding dye into the fill.
