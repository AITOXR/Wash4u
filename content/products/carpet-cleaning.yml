process:
- step: Inspection and fibre test
  detail: 'Before anything else we identify the fibre from the underside or a stray fringe thread — wool,
    silk, viscose, cotton, jute or synthetic. This decides the entire method. We also note existing damage
    with you: worn fringe, curling edges, old pet spots, sun fade, prior repairs.'
- step: Colour bleed test
  detail: Every colour in the rug is tested with a damp white cloth. Reds and indigos in older hand-knotted
    pieces are the usual risk. Anything unstable is treated so the dye holds through the wash instead
    of migrating into the ivory ground.
- step: Dry soil removal
  detail: The rug is dusted from the reverse, repeatedly, until nothing more falls out. Dry grit at the
    base of the pile must leave before water arrives, otherwise it becomes mud in the foundation. This
    stage takes longer than people expect and matters more than any other.
- step: Spot pre-treatment
  detail: Individual spots are worked on their own chemistry — protein, tannin, oil and dye-type spills
    each need a different approach. We do this before the general wash so we are not fighting a wet rug
    and a stubborn spot at the same time.
- step: Washing
  detail: Method follows fibre. Durable wool and cotton pieces take a full wash and flush; silk, viscose
    and unstable-dye rugs get a controlled low-moisture treatment instead. Machine-made synthetics take
    hot water extraction. Fitted wall-to-wall carpet is cleaned in your home.
- step: Rinse and pH balance
  detail: Detergent left behind attracts soil and makes the rug re-dirty faster than before, so the rinse
    is a real stage, not an afterthought. Wool is finished slightly acidic, which is the condition the
    fibre and its dyes are happiest in.
- step: Controlled drying
  detail: The rug is dried fast and evenly, with air moving through it. This is where rugs get ruined
    in Gurugram — wool held damp in monsoon humidity picks up odour and browning within a day, and a cotton
    foundation that dries unevenly will shrink out of square.
- step: Grooming, finishing and return
  detail: The pile is groomed back into its natural direction, fringes are finished, and the rug gets
    a final inspection against the notes taken at pickup. It is wrapped, packed on its own away from every
    other customer's order, and delivered back to your door.
what_we_clean:
- item: Hand-knotted wool rugs
  detail: Persian, Kashmiri, Bhadohi and Jaipur pieces. Washed and rinsed properly rather than surface-shampooed,
    with dye testing first because older reds and indigos are often unfixed.
- item: Silk and silk-blend rugs
  detail: A protein fibre with almost no wet strength and dyes that move easily. These get a controlled
    low-moisture treatment, never a soak, and are dried flat and fast.
- item: Viscose and art-silk rugs
  detail: Also sold as banana silk or faux silk. We clean them, but we tell you first what viscose realistically
    does when wet — it is the one fibre where honest expectations matter more than technique.
- item: Machine-made polypropylene and nylon rugs
  detail: Tough, stain-resistant and forgiving of a proper hot water extraction. Colour comes back well.
    Crushed pile in the walking lane is heat-set damage and will not lift.
- item: Cotton dhurries and flatweaves
  detail: No pile to hide soil, so they show every mark. The risks here are shrinkage and edge distortion,
    which is a drying problem rather than a washing one.
- item: Jute, sisal and natural-fibre rugs
  detail: These fibres brown and shrink readily with water, so they are treated dry or very low-moisture.
    Water rings on jute are usually permanent, and we will say so before starting.
- item: Shaggy and high-pile rugs
  detail: Long pile traps an enormous amount of dry soil at the base and hides it completely. Most of
    the work is dusting; the wash is the easy half.
- item: Fitted wall-to-wall carpet
  detail: Cleaned in your home with pre-spray, agitation, extraction and controlled drying. The failure
    to avoid is over-wetting, which leaves the underlay damp and brings stains wicking back up two days
    later.
