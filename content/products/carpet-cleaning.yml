body: |-
  ## The dry soil comes out before any water goes in

  A rug that has spent two years on a Gurugram floor is holding more dry grit than most people expect — NCR road dust, construction fines from the tower next door, and whatever the balcony door lets in through the winter. That grit sits at the base of the pile, below the level you can see or feel, and it is abrasive. Every footstep grinds it against the wool and shortens the life of the rug.

  It also has to leave before anything wet arrives, because water turns dry soil into mud and drives it into the foundation. So the first stage of a proper rug wash is purely mechanical: the rug is dusted from the reverse, repeatedly, until nothing more falls out. This is the single biggest difference between a rug that is washed and a rug that has been shampooed where it lay. The shampoo-only job looks good for a fortnight and then goes flat.

  ## Fibre identification decides the method, not the price

  Wool, silk, cotton, jute and polypropylene all behave differently in water, so we identify the fibre before we commit to a method. The one to be careful about is viscose — sold as art silk, banana silk or faux silk, and very common in rugs bought off a showroom floor. Viscose is regenerated cellulose. It loses a large part of its strength when wet, the pile can dry stiff and yellowed, and once it browns the colour is inside the fibre rather than on it. If your rug is viscose we will tell you the realistic outcome before we take it, not after.

  ## Dye stability

  Hand-knotted Persian, Kashmiri and Indian pieces often carry reds and indigos that were never fully fixed. Every colour is tested with a damp white cloth before washing, and unstable dyes are held with an acidic rinse. Bleeding that has already happened in an earlier wash — the pink halo around a red medallion — can sometimes be reduced. It cannot always be removed.

  ## What cannot be brought back

  Bleach spots and sun fade are dye loss, not soil. No cleaning process puts colour back into a fibre; that is a re-dyeing job for a weaver. Pile crush in the traffic lane of a machine-made polypropylene rug is heat-set fibre — the colour will lift, the pile height will not. Moth damage: washing kills larvae and removes the keratin they feed on, but bare patches stay bare.

  And on wool, be realistic about spills that are themselves dyes. Wool is a protein fibre and accepts acid dyes readily, which is exactly what children's fruit drinks, food colouring, Holi colour and some red wines are. They bond the way dye is meant to. We usually improve them substantially. We do not promise to erase them.

  ## Pet urine is chemistry, not a stain

  The odour lives in the foundation and backing, not in the pile, which is why topical sprays only postpone it. It has to be flushed and rinsed right through. Urine is also alkaline enough to strip dye out of wool permanently — that yellow or orange patch left behind is dye damage, and cleaning will not reverse it.

  ## Drying is where rugs are actually ruined

  Wool held damp in Gurugram monsoon humidity develops odour and cellulosic browning within a day. Cotton foundations shrink unevenly when one end dries faster than the other, and the rug comes back wavy and out of square. Controlled, even, fast drying matters more than the wash itself.
faqs:
- q: How do I know whether my rug is real silk or viscose?
  a: 'Real silk is a protein fibre and viscose is cellulose, so they behave differently in water — which
    matters a great deal before washing. Two rough home checks: viscose feels cool and slightly slippery
    and its pile often looks unnaturally shiny in one direction only, and a viscose rug will usually feel
    much heavier than a silk rug of the same size. We test a stray fibre from the underside or fringe
    before we commit to a method, and we will show you what we found. If it turns out to be viscose, we
    will explain what a realistic result looks like before starting.'
- q: Can you remove pet urine odour completely?
  a: Usually yes, if it is flushed and rinsed rather than sprayed. The odour lives in the foundation and
    backing, so topical treatment only masks it for a few weeks. What we cannot reverse is the dye damage
    — urine is alkaline enough to pull colour out of wool permanently, and the yellow or orange patch
    left behind is a re-dyeing job, not a cleaning one. If there are old spots you already know about,
    point them out at pickup so we can look at them before we quote.
- q: Will the colours run?
  a: That is the exact question we ask before touching the rug. Every colour is tested with a damp white
    cloth first, and unstable dyes are held with an acidic rinse during washing. Older hand-knotted Persian,
    Kashmiri and Indian pieces are the ones most likely to have unfixed reds and indigos. If a rug has
    already bled in a previous wash, we can often reduce the halo, but we will tell you honestly whether
    it will fully clear.
- q: Do you clean fitted wall-to-wall carpet at home, or does it have to come to you?
  a: Fitted carpet is cleaned in your home — it cannot come off the floor. Loose rugs are collected and
    washed properly off site, which is the only way to do the dusting and rinsing stages that fitted carpet
    cannot receive. We handle both, and we take the rug away and bring it back ourselves as part of free
    pickup and delivery across Gurugram.
- q: My carpet looked clean, then a stain reappeared two days later. Why?
  a: That is wicking, and it means the previous cleaning put in more water than it took out. The stain
    was never only on the surface — it had soaked down into the backing and the underlay. As the carpet
    dries, moisture travels upward and carries the residue back to the tips of the pile. The fix is thorough
    extraction and controlled drying rather than more cleaning solution. If this has happened to your
    carpet before, tell us, because it changes how we approach it.
- q: Can washing get rid of carpet moths?
  a: Washing kills larvae and eggs and removes the soiling and keratin they feed on, which breaks the
    cycle. What it cannot do is regrow the pile they have already eaten — bare or thin patches need a
    weaver, not a cleaner. Check the underside and the areas under furniture, because moth damage almost
    always starts in the parts of the rug nobody walks on or sees.
- q: What should I check before handing my rug over?
  a: 'Walk the rug with our team at pickup and look for four things: loose or unravelling fringe, curling
    or split edges, existing pale patches under furniture, and any earlier repairs. Photograph anything
    you are unsure about. Every item is counted with you at the door and you get a written receipt of
    exactly what was collected, so the condition noted at pickup is on record for both sides.'
