body: |-
  ## Dry soil first, water later

  The most important step happens before anything gets wet. A curtain that has hung for a year in Gurugram holds a surprising amount of dry soil: construction dust from the tower next door, road grit, and in kitchen-facing rooms a fine oily film that the dust sticks to. Put that straight into water and the dust turns to mud and drives deeper into the weave instead of lifting out. So every panel is dry-soil cleared first: heaviest at the header, and along the bottom 20 cm, always the dirtiest part of a floor-length curtain.

  If your curtains look faintly striped once they are down, that is not fading. Dust only lands on the outward face of each pleat, so a pleated panel soils in vertical bands. It comes out.

  ## What actually decides the method

  The care label matters less than what is inside the panel. We check three things at your window: whether the lining is detachable or sewn in, whether there is an interlining (the soft bump layer inside heavy drapes), and what kind of blackout you have. Coated three-pass blackout and a separate blackout lining behave nothing alike in water. Interlined drapes we do not wet clean at all, because the inner layer shifts and bunches inside the panel and there is no getting it flat again.

  Cotton and linen shrink. Lined cotton shrinks unevenly, because face fabric and lining move at different rates, and you end up with a rippled hem and a drop that is suddenly short of the floor. That is why a lot of curtain work is dry cleaned rather than washed, even when the label says washable.

  ## What cannot be saved

  Better you know before we take them down.

  - **Sun rot.** UV degrades the fibre itself, worst on the leading vertical edge and the top few inches. The cloth looks fine, then tears like wet paper. Nothing reverses it, and cleaning is usually what exposes it, so we pinch-test suspect panels with you standing there.
  - **Perished blackout coating.** Once the rubberised backing has gone tacky or chalky with age and heat, it sheds during cleaning. It cannot be re-coated.
  - **Old mildew spotting** on linings, from monsoon damp or condensation near a split AC. The mould has stained the fibre, and bleaching it out would take the cloth with it.
  - **Heat-set yellowing on polyester sheers.** Optical whiteners work on cotton. They do very little for oxidised polyester.

  ## Before we arrive

  Clear the sill and the pelmet, and tell us if any rod or bracket feels loose. Plastic wall plugs in drywall let go easily, and our terms exclude fixtures that were already weak. We would far rather flag it than discover it.

  One thing people regret skipping: poore room ke parde ek saath, clean every panel in a room and not only the marked one. A freshly cleaned panel hanging beside one that was left will not match, and you cannot unsee it.

  Hooks, rings and hem weights come off, counted and logged with you at the door like any other order, on a written receipt. On rehang we dress the pleats by hand and tie them loosely so the folds set.
faqs:
- q: Do I have to take the curtains down myself?
  a: No. Removal and reinstallation are included free with curtain cleaning. Our team brings a ladder,
    takes the panels off the rod, removes the hooks and rings, and puts everything back and dresses the
    pleats when the curtains return. You do not need to do anything except clear the sill and point us
    at the windows.
- q: How long will my windows be bare?
  a: Curtain cleaning takes longer than garment work because of the drying and pressing involved, and
    heavy lined drapes take the longest. We will give you the expected return date at pickup, before anything
    leaves the house, so you can plan around it. If you have a bedroom you cannot leave uncovered, tell
    us and we can schedule that room separately from the rest.
- q: Will my curtains shrink?
  a: Cotton, linen and unlined cotton-blend curtains carry a real risk, especially if they have never
    been cleaned since they were stitched. Lined panels are the trickier case, because the face fabric
    and the lining shrink at different rates and the hem ripples. Where that risk is present we will normally
    recommend dry cleaning instead of washing, even if the care label says the fabric is washable, and
    we will tell you at pickup rather than after.
- q: Can you steam-clean the curtains on the rod without taking them down?
  a: Steaming in place freshens the look and relaxes creases, but it does not remove embedded dust from
    inside the weave, and it does nothing for the lining, which is usually the dirtier layer. We would
    rather not sell it as a substitute for a proper clean. If the panels are genuinely only a season old,
    it can buy you time.
- q: One of my rods is loose. Will you fix it?
  a: We are cleaners, not carpenters, so we will not re-drill or replug a fixture. What we will do is
    check the rods and brackets before we touch them and tell you if something is unsafe. Our published
    curtain cleaning policy is explicit that weak or already-damaged rods, brackets and fixtures are not
    our responsibility, which is exactly why we flag them first rather than pulling and hoping.
- q: My curtains looked darker before. Did cleaning fade them?
  a: Almost always no. Dust settles evenly across a hanging panel and masks fading that has already happened
    underneath it, so the colour looks deeper than it really is. Take the dust away and you see the true,
    sun-lightened fabric for the first time. It is one of the most common misunderstandings in this job,
    which is why we point out visible fading at the window before we take anything down.
- q: What happens if something goes wrong with my curtains?
  a: Be aware that curtains, like carpets and leather, sit outside the compensation cap in our terms and
    conditions. We would rather say that plainly than bury it. It is the reason we inspect at the window,
    pinch-test anything that looks sun-weakened, photograph the panels before takedown, and decline work
    where we think the fabric will not survive the process. Turning a job down is cheaper for everyone
    than ruining a pair of drapes.
