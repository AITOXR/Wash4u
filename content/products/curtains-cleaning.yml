process:
- step: Survey at the window
  detail: Before anything comes down we look at the lining, the header tape, the weights and the state
    of the rod, and pinch-test any panel that looks sun-weakened. Anything we think will not survive cleaning
    gets flagged there and then, with you present.
- step: Takedown and logging
  detail: Panels come off the rod, hooks and rings are removed and bagged, and every piece is counted
    with you at the door. You get a written receipt of exactly what was collected. Your order is packed
    on its own and never shares a load with another household's.
- step: Dry soil removal
  detail: Dust is lifted out dry before any liquid touches the fabric, working the header and the bottom
    hem hardest. Wetting a dusty curtain simply turns the soil to mud and pushes it into the weave.
- step: Fabric and colour testing
  detail: Lining and face fabric are tested separately, because they are often different fibres with different
    tolerances. Printed cottons are checked for dye bleed on a hidden seam allowance before the main clean.
- step: Cleaning to suit the construction
  detail: Washable panels are cleaned gently in water; dry-clean-only fabrics, interlined drapes and coated
    blackout go the solvent route. Spot work on marks such as water tidemarks and hem soiling is done
    by hand before the main process, not after.
- step: Drying and finishing
  detail: Panels are dried in a controlled way to hold the drop, then pressed flat with the header tape
    and the hem given particular attention. Pleats are re-formed rather than left to fall as they will.
- step: Rehang and dressing
  detail: Hooks go back at the same spacing, panels go back on the same rods, and the pleats are dressed
    by hand into even folds and tied loosely so they set. We do not leave a bundle of curtains at your
    door for you to sort out.
what_we_clean:
- item: Sheers, voiles and nets
  detail: Light polyester voile cleans well and comes back crisp. Older cotton or silk sheers that have
    hung in direct sun are the single most fragile thing we handle, and we will test before accepting
    them.
- item: Blackout curtains
  detail: Handled differently depending on whether the blackout is a coated three-pass fabric or a separate
    lining sewn behind the face cloth. Coated blackout that has started to feel tacky or chalky is already
    past saving.
- item: Heavy lined and interlined drapes
  detail: Velvets, jacquards and thick cotton drapes with a lining or a bump interlining. These are dry
    cleaned rather than washed, because water moves the layers against each other and they will not sit
    flat again.
- item: Cotton and linen curtains
  detail: The ones most likely to shrink, particularly if they have never been cleaned since stitching.
    We choose the method around the shrinkage risk, not around the label.
- item: Roman blinds
  detail: Dowels and cords are removed and reinserted after cleaning, and the fold spacing is set again
    on rehang so the blind stacks evenly.
- item: Valances, pelmets and tiebacks
  detail: Cleaned alongside the main panels so they finish at the same shade. Padded or buckram-stiffened
    pelmets are assessed individually, as the stiffener can collapse.
- item: Door curtains and partition drapes
  detail: The heaviest-handled fabric in most homes, with soiling concentrated at hand height on the leading
    edge. That edge gets hand attention before the main clean.
