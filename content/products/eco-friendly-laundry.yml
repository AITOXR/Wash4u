h1: Gurgaon & Delhi NCR’s Most Eco-Friendly Laundry Service
lede: 'Wash and fold is our volume service: shirts, tees, trousers, kurtas, towels and bedsheets, the
  roz ke kapde that have piled up by Thursday. Free pickup and delivery anywhere in Gurugram, with your
  order counted in front of you before it leaves.'
body: |-
  ## Sorting is most of the job

  Almost everything that goes wrong in a wash is decided before the machine starts. We sort your order three ways: by colour, by fabric weight, and by how soiled it is. Colour matters most on anything new. Unwashed dark denim, maroon and deep red cotton, and cheap black tees shed loose dye for the first three or four washes, and once that dye has been through heat it is fixed for good. Tell us if a piece has never been washed and it goes in separately. Fabric weight matters because a bath towel tumbling against a fine cotton shirt will abrade the shirt. Soil level matters because kitchen clothes and gym wear need a longer main wash than a shirt worn for four hours in an air-conditioned office.

  ## Gurugram water, and why whites go grey

  Much of Gurugram runs on hard groundwater. Calcium and magnesium react with detergent and leave a film that builds up wash after wash: whites turn a dull grey, towels stiffen and stop absorbing, dark cottons pick up a chalky cast. Adding more detergent makes it worse, because the undissolved detergent is the residue. We dose to the load and the water and run an extra rinse rather than a bigger scoop. If your whites have already greyed over years of home washing we can lift them noticeably, but we cannot return them to day-one white, and anyone promising that is selling optical brightener, which washes straight back out.

  ## What we cannot save

  Underarm yellowing on white shirts is aluminium from antiperspirant bonded into the fibre along with body protein. We reduce it; we do not erase it. Bleach marks from toilet cleaner or hair dye splash are missing colour rather than added dirt, and nothing cleans colour back in. A stain that has already been ironed or tumble-dried is usually permanent, because heat sets oil and protein alike. Most common of all: a stain scrubbed hard at home with bar soap and a brush leaves a fuzzy, faded patch where the fibre has broken, and that damage is done before we ever see the garment. So leave the stain alone and tell us what caused it. The treatment for oil is the opposite of the treatment for blood, milk or egg, and hot water on a protein stain sets it permanently.

  ## Before you hand the bag over

  Empty every pocket. One ballpoint pen can mark a whole load and one tissue will coat it in lint. Close zips and fasten hooks so they do not snag knitwear. Count your own socks, hankies and innerwear, since small items are what people notice missing. Keep out anything embellished: sequins, mirror work, beaded kurtas, silk, wool and suits belong in dry cleaning, not in a wash-and-fold load.

  ## What comes back

  Your order is counted with you at the door, written on a receipt you keep, bagged on its own and washed as its own load. It never shares a drum with another household's clothes. It comes back dried at a controlled temperature, folded and packed. Wash and fold means clean and neatly folded, not pressed. If you want crisp collars and sharp trousers, ask for wash with steam ironing instead. One last thing: don't leave the sealed pack in a damp cupboard through the monsoon. Open it and let the clothes breathe.
what_we_clean:
- item: Shirts, t-shirts and everyday tops
  detail: Cotton, linen and cotton blends worn for work or at home. Collars and cuffs get a separate pre-treat
    before the main wash, because that is where body oil and Gurugram dust collect first.
- item: Trousers, jeans and shorts
  detail: Denim is washed inside out and cool to slow fading. New dark jeans go in on their own for the
    first few washes so the indigo does not travel.
- item: Cotton kurtas, salwars and everyday ethnic wear
  detail: Plain and lightly printed cotton and cotton-blend ethnic wear. Anything with zari, sequins,
    mirror work or a silk lining is moved to dry cleaning instead, and we will tell you if we spot it
    at sorting.
- item: Towels, bedsheets and pillow covers
  detail: Washed apart from clothing because towel lint transfers onto everything else. Towels get an
    extra rinse and no fabric softener, since softener is what leaves them water-repellent and flat.
- item: Innerwear, socks and hankies
  detail: Small items are the ones that go missing, so they are washed in mesh and counted back against
    the pickup receipt. Count them yourself before handover too.
- item: Gym, sports and activewear
  detail: Synthetic performance fabric holds odour in the fibre rather than on it. It needs a cool wash
    and a proper rinse; hot water and heavy softener are what make gym clothes smell again the moment
    you sweat.
- item: School uniforms and children's clothes
  detail: Frequent, gentle washing rather than aggressive chemistry, so name tapes, printed logos and
    elastic survive the term.
process:
- step: Pickup and count at your door
  detail: Every piece is counted with you before the bag leaves. You keep a written acknowledgement of
    exactly what was collected. Weighing, where the order is charged by weight, is done dry and in front
    of you, never after washing.
- step: Inspection and stain flagging
  detail: Each piece is checked for existing damage, loose buttons, open seams, thin patches and stains.
    If we think a stain will not fully come out, or a garment is too fragile for a wash-and-fold load,
    we tell you before we start rather than after.
- step: Sorting
  detail: Split by colour, by fabric weight and by soil level. New or unwashed dark colours are isolated.
    Towels are kept away from clothing to stop lint transfer.
- step: Wash
  detail: Your order runs as its own load and is never combined with another customer's clothes. Detergent
    is dosed to the load and to Gurugram's hard water, with wash temperature set by fabric rather than
    by habit, and an extra rinse to clear residue.
- step: Controlled drying
  detail: Dried at a temperature chosen for the fabric, so cotton does not shrink and synthetics do not
    glaze. This also avoids the dust and sun-fade that balcony drying leaves on darks, and the mildew
    smell clothes pick up when they never quite dry during the monsoon.
- step: Fold, pack and deliver
  detail: Folded, checked back against the pickup count, packed as your order alone and delivered to your
    door across Gurugram.
faqs:
- q: Are my clothes washed together with other people's laundry?
  a: No. Every order is bagged on its own at pickup and washed as its own load. It is counted with you
    at the door, acknowledged in writing, kept separate through the wash, and counted again before delivery.
    This is the question we get asked most, and it is the reason we built the process this way.
- q: Will my clothes come back ironed?
  a: Not with wash and fold. This service returns your clothes clean, dry and neatly folded, which is
    what most people want for everyday wear, bedding and towels. If you want crease-free shirts and pressed
    trousers, ask for wash with steam ironing at the time of pickup and we will book it that way.
- q: Do you charge by weight or by piece?
  a: Both are available, and you can choose whichever suits the load. Bulk everyday clothing usually works
    out by weight; a few specific garments are simpler by piece. Weighing is always done dry, before washing,
    and in front of you. See our pricing page for current rates, or ask when you book.
- q: I already tried removing a stain at home and it did not come out. Can you still do anything?
  a: Often yes. One customer told us, "I tried at home and the stain didn't go. Wash4You removed it completely."
    But it depends entirely on what the stain is and what was already done to it. If it has been ironed,
    tumble-dried or scrubbed with a brush, your odds drop sharply. Point it out at pickup and tell us
    what caused it, and we will give you an honest read before we start.
- q: Will new dark clothes bleed onto the rest of my order?
  a: Not if we know about them. Tell us at pickup which pieces are new or have never been washed, and
    those go in on their own. New dark denim, deep reds and maroons, and inexpensive black tees release
    loose dye for the first several washes. Once that dye has transferred and gone through heat, it is
    permanent, so this is a five-second conversation worth having at the door.
- q: Do you take laundry for a short stay or a few weeks only?
  a: Yes. We regularly handle laundry for people staying in Gurugram short term, including guests and
    visitors who have no washing machine to use. One customer visiting from Ahmedabad took our service
    for a 15-day stay. Call or WhatsApp +91 63 67 600 500 and we will arrange pickup for as long as you
    need it.
- q: Is the detergent safe for children's clothes and sensitive skin?
  a: We use biodegradable, non-toxic detergents and run an extra rinse cycle, which matters more than
    most people realise. Detergent residue left in the fabric is a common cause of itching and irritation,
    particularly with hard water. If someone in the house has eczema or reacts to fragrance, say so when
    you book and we will keep the order fragrance-free.
- q: Where can I drop clothes off instead of a pickup?
  a: Either of our two Gurugram stores. Vyapar Kendra is at Gate No. 3, Shop No. 180, GF Shushant, Vyapar
    Kendra Road, Block C, Sushant Lok Phase I, Sector 43. Arcadia is at AG-75, Ground Floor, Block-A,
    Unitech Arcadia, Sector 49. Pickup and delivery are free across Gurugram if you would rather not travel.
