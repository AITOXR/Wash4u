body: |-
  ## Leather is a skin, not a fabric

  Every hide that becomes a jacket or a bag is packed with fats during tanning. Those fats sit between the fibres and let them slide past each other, which is the whole reason good leather drapes instead of behaving like cardboard. Any cleaning that lifts soil also takes some of that fat with it. So cleaning and reconditioning are one job here, not two: leather cleaned and handed straight back, unfed, will stiffen within a season. It is also why leather never goes through water immersion the way a shirt does.

  ## The finish decides everything

  Before anything touches your item, we work out what the surface actually is. A drop of water on pigmented leather beads and sits; on aniline it darkens and sinks within seconds. Pigmented leather, which covers most jackets and most branded handbags, carries a thin coloured topcoat and takes a proper surface clean well. Aniline and semi-aniline are dyed through with little or no topcoat, so they absorb whatever touches them and usually have to be worked panel by panel rather than spot by spot, because evening out the whole panel is the only way to avoid leaving a halo around the mark. Suede and nubuck have no topcoat at all and are brushed, blocked and re-napped dry, never shampooed. Guessing wrong at this first step is what ruins leather, and it is usually where a home attempt has already gone wrong before the item reaches us.

  ## What cannot be saved, and we say so first

  - **Ballpoint ink on unfinished leather.** The ink dye has already travelled into the fibre. Anything strong enough to lift it lifts the leather's own colour with it.
  - **Sun fading.** That is lost dye, not dirt, so cleaning does nothing for it. Recolouring is a separate job and it changes how the leather feels in the hand.
  - **Splits in the grain.** Conditioning softens the leather around a crack and makes it much less obvious. The crack itself does not close.
  - **Bonded or PU "leather" that has begun peeling.** Nothing puts a delaminated coating back down.
  - **Old oil, ghee and food grease.** Months-old fat has bonded with the leather's own oils. We can usually reduce it to a faint shadow, and you should be sceptical of anyone promising more.
  - **Deep monsoon mould.** Surface growth comes off. Where it has pitted the grain, the pitting stays and sometimes the smell does too.

  ## Before you hand it over

  Empty every pocket, twice. A forgotten pen inside a jacket sleeve or bag lining is the most common way a good leather piece is lost for good. Tell us what the stain is and, honestly, what you already tried at home, because coconut oil, baby wipes and shoe polish all change what we are able to do next. Detach fur trims, remove keyrings and charms, and point out existing cracks or scuffs while we count the order with you at your door, so we are both looking at the same item from the start.
faqs:
- q: Can a leather jacket go through normal dry cleaning?
  a: No. A standard dry cleaning cycle is built for woven fabric, and the tumbling and solvent exposure
    strip the fats out of a hide far faster than they lift the soil. Leather is worked by hand, surface
    by surface, and then reconditioned. If a leather jacket has a fabric lining, the lining is treated
    as its own job, because sweat salts around the collar and underarms need a different approach from
    the outer skin.
- q: My light-coloured bag has denim colour rubbed onto one side. Will it come off?
  a: Often, on smooth pigmented leather, because the indigo has transferred onto the topcoat rather than
    into the hide. On light suede or nubuck it is much harder, since the dye sits down in the nap with
    nothing sealing the surface. We will look at the panel and tell you honestly whether we expect a full
    lift or only a reduction before we start.
- q: Will cleaning change the colour of my leather?
  a: Conditioning usually deepens the tone very slightly, which most people read as the item looking richer.
    The real risk is patchiness, and that comes from spot-treating an aniline or suede item. We avoid
    it by working the whole panel rather than just the mark. If your item is already faded in places,
    cleaning will make that unevenness easier to see, not less, and we will point that out at the door
    rather than after.
- q: My leather jacket has been shut in the wardrobe since last winter and smells damp. Can that be fixed?
  a: Usually yes. Gurugram's monsoon humidity in a closed wardrobe is the single most common reason leather
    comes to us in September and October. Surface mould and the musty smell that goes with it can be cleaned
    off and the leather refed. Where the growth has been sitting long enough to pit the grain, the pitting
    is permanent and a trace of odour can remain, so bring it in as soon as you notice it rather than
    waiting for the cold.
- q: What happens to zips, buckles and chains?
  a: Metal is cleaned and masked off so conditioner does not sit on it, and hardware is polished where
    polishing helps. What we cannot do is put plating back. Once brass or gold-tone plating has worn through
    on a handle ring or a buckle edge, that is a re-plating job with a metal workshop, not a cleaning
    one. We will show you where the wear is instead of quietly working around it.
- q: How do you dry leather?
  a: Slowly, at room temperature, away from sunlight, heaters and fans blowing hot air. Bags are stuffed
    and shaped so the panels do not collapse while they lose moisture, and shoes are treed or packed for
    the same reason. Fast heat drying is exactly what shrinks a hide and makes it hard, and it is why
    a jacket dried on a balcony after rain never feels the same again.
- q: Do you collect from home?
  a: Yes. Free pickup and delivery across Gurugram, or drop the item at our Sector 43 store on Vyapar
    Kendra Road or the Sector 49 store at Unitech Arcadia. Every item is counted with you at the door,
    your order is packed separately from every other customer's, and you get a written receipt of what
    was collected. For leather that matters, because a one-off jacket or bag is not something you want
    going into a shared pile.
