process:
- step: Counted and inspected at your door
  detail: We count every piece with you before it leaves, note the cracks, scuffs and hardware wear that
    are already there, and give you a written receipt of exactly what was collected.
- step: Finish test before anything else
  detail: A water drop in a hidden spot tells us whether the surface is pigmented, aniline, semi-aniline,
    suede or nubuck. Everything after this point is decided by that answer, so we never skip it.
- step: Hardware masked, lining separated
  detail: Zips, buckles, chains and clasps are protected so no product sits on the metal. Jacket linings
    and bag interiors are handled as their own job, because sweat and crumbs need a different treatment
    from the hide.
- step: Clean, matched to the surface
  detail: Finished leather is cleaned panel by panel by hand. Suede and nubuck are worked dry with brushes
    and a rubber block, then re-napped. Nothing is soaked, tumbled or put through a machine cycle.
- step: Recondition
  detail: The fats that cleaning removed are replaced so the fibres stay flexible. This is the step that
    decides whether your jacket still moves properly next winter, which is why we treat it as part of
    the clean rather than an add-on.
- step: Shaped and dried slowly
  detail: Bags are stuffed, shoes are packed, and everything dries at room temperature away from sun and
    heat. Fast drying is what shrinks and hardens leather, so this stage is not rushed.
- step: Final check and delivery
  detail: We look over the item against the notes we took at pickup, tell you what lifted and what did
    not, and deliver it back to your door, packed on its own.
what_we_clean:
- item: Leather jackets and coats
  detail: Outer hide cleaned by finish type, collar and cuff grime worked separately, and the inner lining
    treated on its own because that is where sweat salts and deodorant actually sit. Shearling and detachable
    fur trims are removed and handled apart from the shell.
- item: Handbags, totes and slings
  detail: Handles and the base corners take the most punishment, from hand oils on one end and being set
    down on floors at the other. Bags are cleaned panel by panel, then stuffed and shaped while they dry
    so the sides do not sag. Interiors are vacuumed and spot-treated.
- item: Leather and suede shoes
  detail: Uppers, welt line and sole edge cleaned, insoles and linings deodorised, then conditioned and
    re-napped where the material calls for it. Our before and after work on suede is on the sneaker side
    too, including the Nike SB Dunk water-staining job in our results.
- item: Wallets, belts and small leather goods
  detail: Small items pick up pocket lint, coin transfer and body oil in ways that are hard to see until
    the leather is cleaned. Belts crack first at the buckle holes and around the fold, so those areas
    get extra conditioning attention.
- item: Laptop bags, briefcases and luggage
  detail: Daily-carry items that collect commute dust, strap wear and desk grime. Cleaned, reconditioned,
    and the interior compartments cleared out and treated, with hardware masked so nothing greasy ends
    up on the zips.
- item: Nubuck and suede pieces of any kind
  detail: Napped leather has no protective topcoat, so it is never shampooed. It is brushed, blocked,
    worked on the shiny compacted patches, then re-napped to bring the texture back. Water rings are usually
    evened across the whole panel rather than spotted.
- item: Leather trims on fabric garments
  detail: Jackets with leather sleeves or panels, and garments with leather piping and patches. The two
    materials need opposite handling, so they are treated as a combined job rather than run through a
    single fabric process.
