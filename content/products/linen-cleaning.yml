process:
- step: Free pickup and count at your door
  detail: Every sheet, pillowcase, towel and napkin is counted with you before it leaves, and you get
    a written receipt of exactly what was collected. Nothing goes into a van uncounted.
- step: Inspection and sorting
  detail: Whites, colours, unwashed dark prints and towels are separated. We check hems, corners and fitted-sheet
    elastic for existing damage, and note any stain you have already treated at home, because that changes
    how we approach it.
- step: Targeted pre-treatment
  detail: The oil band along the top hem, sebum on pillowcases, and food, wine or grease marks on table
    linen are treated by stain type with proper dwell time. This happens before the wash, not during it,
    which is the whole difference.
- step: Washed by fabric, on its own
  detail: Percale, sateen, flax linen and terry towelling need different agitation, temperature and rinse.
    Your order is washed separately from every other customer's, never combined into a shared load.
- step: Descale, not soften
  detail: Sheets get a conditioning rinse for hand-feel. Towels get an acidic descaling rinse instead
    of softener, because softener is what kills absorbency and hard water is what makes them stiff in
    the first place.
- step: Controlled drying and pressing
  detail: Flat linen is pressed while still slightly damp so the weave lies flat and the finish holds
    in the almirah. Towels are dried without over-baking, which is what turns a soft pile brittle.
- step: Folded in sets and delivered back
  detail: Sheets, matching pillowcases and covers come back folded together as sets rather than as a loose
    pile, delivered free anywhere we collect in Gurugram.
what_we_clean:
- item: Bedsheets, single and double
  detail: The most-handled fabric in the house and the one that hides oil best. Washed with room to move,
    which a domestic drum cannot give a double sheet.
- item: Fitted sheets
  detail: The elastic is the weak point. Hot water and chlorine perish it, so we wash cooler and dry without
    over-heating the corners, and we flag elastic that has already gone slack.
- item: Pillowcases and bolster covers
  detail: 'These carry the heaviest oil load of any linen in the home: hair oil, night cream, face products.
    Pre-treated separately from the sheet they came with.'
- item: Duvet, quilt and comforter covers
  detail: Turned inside out and fastened before washing, so the cover does not swallow smaller pieces
    and come back clean only on one side.
- item: Bath, hand and face towels
  detail: Descaling rinse instead of fabric softener. Terry loops trap hard-water minerals and softener
    residue, and both have to go for absorbency to return.
- item: Kitchen and tea towels
  detail: Cooking oil, haldi and masala staining, handled apart from bedroom linen so nothing transfers
    between the two.
- item: 'Table linen: tablecloths, runners and napkins'
  detail: Wine, gravy, candle wax and oil are treated by type. Damask and self-textured cloth is pressed
    damp so the weave regains body rather than lying limp.
- item: Mattress protectors
  detail: Waterproof-backed protectors cannot take high heat without the backing delaminating, so these
    are washed and dried on a low, controlled cycle.
