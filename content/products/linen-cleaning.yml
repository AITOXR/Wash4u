body: |-
  ## What linen actually gets dirty with

  Most bedsheets are not dirty the way a shirt is dirty. The soil is body oil: sebum, hair oil, night cream, dried sweat, spread thinly across the whole sheet and concentrated in a band along the top hem and on the pillowcases. It stays invisible for months, then one day the pillowcase looks yellow-grey and no amount of detergent shifts it. Oil does not come out with detergent alone at the temperature a domestic machine runs. It needs an alkaline pre-soak and an enzyme stage with real contact time before the wash even begins. That is the step a home wash skips, and it is where we start.

  The second problem is local. Water across most of Gurugram is hard, and calcium binds to both the cotton and the soap, leaving a mineral film in towel loops and inside the weave of sheets. That film is what makes towels stiff, scratchy and slow to absorb. It is not age. An acidic descaling rinse takes it out, while adding more detergent makes it worse. If your towels have gone crunchy despite regular washing, this is almost always the reason.

  ## What can and cannot be saved

  Hair oil, sebum yellowing, sweat, tea, coffee and cooking grease on table linen usually come out, often completely. Haldi on white cotton normally reduces to nothing, but on polyester or poly-cotton the turmeric bonds to the fibre and can leave a faint yellow shadow, so we tell you which fabric you have before promising anything.

  Some things genuinely cannot be recovered. Benzoyl peroxide from acne creams and face washes, hair colour, and bleach splashes are not stains at all. They have stripped the dye out of the fabric, and nothing puts colour back. Mildew from linen packed away slightly damp through the monsoon can often be lightened, but mildew feeds on cotton, so where it has been sitting a while the fibre is already weak and small holes may open during washing. We point that out before we wash. Rust from a leaking iron or a rusty drying rack needs an acidic reducer and never chlorine, and it does not always clear fully.

  ## Before you hand it over

  Check hems and corners for small tears, because agitation turns a two-inch split into a six-inch one. Empty duvet covers; socks and phone chargers arrive inside them more often than you would expect. Tell us what you have already tried at home, and whether the piece has been ironed since the stain happened, because heat sets oil and protein into the fibre and changes what is still possible. Mention any new or dark set that has not been washed before, since indigo and maroon prints bleed on the first few washes and we will run those on their own.

  One last thing worth knowing: a double bedsheet in a domestic machine has nowhere to tumble, so most of the load gets almost no mechanical action. That is the quiet reason home-washed sheets stay dull however good the detergent is.
faqs:
- q: My white pillowcases have gone yellow even though I wash them every week. Can that be reversed?
  a: Usually yes. That yellowing is oxidised body oil and hair oil that a normal wash never lifted, so
    it built up layer by layer. It responds to an alkaline pre-soak plus enzyme treatment with proper
    contact time, which is what a domestic cycle cannot give it. The exception is a pillowcase that has
    been ironed many times over the same soiling, because heat drives oil deeper into the fibre. Those
    come back much lighter but not always perfectly white, and we will say so when we see them.
- q: Will my towels actually come back soft?
  a: 'Softer, and more absorbent, but through a different route than you might expect. We do not use fabric
    softener on towels because it coats the loops and is the main reason towels stop soaking up water.
    Instead we use an acidic descaling rinse that strips out the hard-water mineral film Gurugram supply
    leaves behind, which is what makes towels feel like cardboard. Honest limit: a towel whose pile has
    genuinely worn flat over years will feel clean and absorbent again, but it will not be new.'
- q: There is a haldi mark on my tablecloth. Is it coming out?
  a: It depends entirely on the fibre, not on how old the mark is. On white or light cotton, turmeric
    almost always reduces to nothing. On polyester or a poly-cotton blend it bonds to the fibre and a
    faint yellow shadow often stays permanently. We check the composition first and tell you which situation
    you are in before we treat it, so you are not paying in hope.
- q: Do my sheets get washed with other people's laundry?
  a: No. Every order is bagged on its own and stays separate from every other customer's order through
    the whole process. Your bedsheets, pillowcases and towels are counted with you at the door before
    they leave, and you get a written receipt of exactly what was collected. When the order comes back,
    count it again against that receipt.
- q: I have a brand new dark bedsheet set. Should I wash it once at home before sending it?
  a: Please do not. Send it as it is and tell us it is new. Deep indigo, maroon and traditional block
    prints release loose dye for the first few washes, and a home wash is where that dye usually transfers
    onto something else in the load. We run new and unwashed dark sets on their own and test for bleed
    before committing the full cycle.
- q: Can you clean the quilt or duvet itself, not just the cover?
  a: The cover comes under linen cleaning. The filled quilt, duvet, comforter or blanket is handled by
    our blanket and quilt cleaning service, which uses a different process for bulk and drying. Send both
    together and we will route them correctly; they will still be counted and returned as one order.
- q: How do I book, and do you collect from my area?
  a: 'Free pickup and delivery covers Gurugram. Call or WhatsApp +91 63 67 600 500, or email care@wash4you.in,
    and tell us roughly how many sheets, pillowcases, towels and table pieces you have so the collection
    is counted quickly at the door. You can also drop things at either store: Sector 43 near Vyapar Kendra
    in Sushant Lok Phase I, or Unitech Arcadia in Sector 49.'
