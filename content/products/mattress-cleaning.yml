process:
- step: Inspection with you in the room
  detail: 'We check the care label, the ticking, the seams and the underside, and look for anything that
    changes the plan: a zip-off cover, a do-not-wet-clean marking, damp patches, or black speckling that
    means mould has already reached the foam. You hear the honest verdict here, not at the end.'
- step: Dry HEPA vacuuming and agitation
  detail: An agitating head loosens skin, hair and grit from the top fibres while a HEPA vacuum draws
    it out. Seams, piping, buttons and both faces are done. This stage removes the bulk of the mite matter
    and it happens before any liquid is used, because wetting dry soil turns it into mud.
- step: Spot identification and pre-treatment
  detail: Sweat haloes, urine, blood and food spills each need different chemistry, and the wrong one
    sets the stain permanently. Blood is worked cold. Urine gets an enzyme with proper dwell time. Sweat
    and body oil are pre-sprayed and left to break down before anything is extracted.
- step: Low-moisture extraction and sanitising
  detail: Controlled application, high vacuum recovery, and a surface pass to lift what has been loosened.
    On coir, dense cotton or any mattress labelled do not wet clean, we stay dry and use surface steam
    only rather than force a method the material cannot take.
- step: Forced drying and hand check
  detail: Airflow across the surface until it is dry to the hand, checked at the head, the middle and
    the sides. Damp seams are the usual cause of that musty smell a week after a bad clean, so they get
    particular attention.
- step: Handover and aftercare
  detail: We tell you what came out, what did not and why, and how long to leave the bed unmade before
    you put fresh sheets on. If a protector or rotation would keep it in better condition, we will say
    so. No upselling.
what_we_clean:
- item: Pocket-spring and Bonnell mattresses
  detail: The most forgiving type to work on. Open coil construction breathes, so extraction recovers
    well and drying is quicker. We pay attention to the quilted top panel and the side piping, where dust
    collects and vacuum heads usually skip.
- item: Memory foam and hybrid mattresses
  detail: Foam holds water and does not release it, so these get the lowest moisture of anything we handle,
    a milder solution and a longer drying stage. If a memory foam mattress has been soaked at any point
    in the past, tell us; the damage may already be inside.
- item: Latex mattresses
  detail: Natural latex reacts badly to strong alkaline cleaners and to prolonged wetness, both of which
    break the material down over time. We keep to a pH-appropriate solution and surface work only, which
    is enough for allergen removal and safe for the core.
- item: Coir and cotton-filled mattresses
  detail: Common in Indian homes and the hardest to wet clean sensibly, because dense cotton batting soaks
    like a sponge and takes far too long to dry. We treat these dry, with HEPA extraction and surface
    steam, and we are upfront that heavy staining in this type often will not shift.
- item: Pillow-tops, euro-tops and mattress toppers
  detail: The pillow-top layer is where sweat and skin concentrate, so it takes the most work. Separate
    toppers can come back to the store to be cleaned properly rather than treated on the bed, which usually
    gives a better result.
- item: Cot and children's mattresses
  detail: Small, and almost always the ones with urine history. These get enzyme treatment for uric acid,
    a gentle formulation, and thorough drying, since a child's mattress sits low with poor airflow underneath
    and holds damp longer than you would think.
- item: Divan bases, box springs and fabric headboards
  detail: There is little point cleaning the mattress and leaving the base beneath it loaded with the
    same dust. Upholstered bases and fabric headboards are vacuumed and treated to match, and they are
    almost always dirtier than the owner expects.
- item: Mattress protectors, bedding and pillows
  detail: The washable layers do not need in-home treatment. Send them with our pickup service instead
    and they come back laundered at a temperature that actually kills mites, counted and packed separately
    from every other customer's order.
