process:
- step: Inspection, tagging and your approval
  detail: We look at every shoe for sole separation, hydrolysed foam, cracked topcoat under the dirt,
    previous home treatments and any re-dye or custom paint, then tag it to your order. Photos of the
    shoe and any existing damage are sent to you, and we start work only once you approve — not after
    you leave.
- step: Strip and dry-clear
  detail: Laces and removable insoles come out and are treated separately. Loose grit is brushed off dry
    and stones are pulled from the tread — wetting a shoe with grit still in it just grinds that grit
    into the material.
- step: Material-matched cleaning
  detail: Knit and mesh, canvas, smooth leather, suede and nubuck each get their own solution, brush stiffness
    and moisture level. Suede is worked a whole panel at a time so it dries evenly and no tide line forms.
- step: Targeted stain work
  detail: Grass, mud, ink, kerbside grease and turf rubber are each approached differently. Anything that
    risks the dye or the finish is tested on a hidden area first — the tongue lining or the inside heel.
- step: Midsole and outsole
  detail: Foam and rubber are cleaned separately from the upper, and detergent is fully neutralised and
    rinsed out. Leftover alkaline residue is the reason home-washed shoes turn yellow days later.
- step: Deodorising from the insole up
  detail: Odour is bacterial and it sits in the footbed. Insoles are cleaned and dried on their own; fixed
    footbeds get an antibacterial treatment rather than a masking fragrance.
- step: Slow shade drying, shape supported
  detail: Shoes are dried out of direct sun with the toe box supported so it does not collapse. Sun and
    heat are what yellow midsoles, shrink glue lines and warp uppers — this is the step people skip at
    home.
- step: Reassemble, final check, separate packing
  detail: Laces back in, nap re-brushed on suede, leather conditioned where needed. Your order is packed
    on its own, never mixed with anyone else's, and returned to your door with the receipt you signed
    at pickup.
what_we_clean:
- item: Sneakers and streetwear silhouettes
  detail: Leather, canvas and mixed-panel sneakers, including pairs with contrast panels where dye migration
    is a real risk. Cleaned by hand so white and coloured sections are never wet at the same time in a
    way that lets colour run.
- item: Suede and nubuck
  detail: Worked panel by panel with brass and rubber brushes and the nap re-raised at the end. Water
    tide marks and general greying come back well; oil and grease that has soaked in usually will not.
- item: Running and training shoes
  detail: Knit and engineered mesh uppers with foam midsoles — the Hoka, ASICS, Nike and adidas category.
    Grass, trail grime and sweat salt are the usual problems, and the foam needs cleaning separately from
    the upper.
- item: White soles and gum soles
  detail: Midsole and outsole cleaning with the detergent properly neutralised so the sole does not yellow
    again a week later. Long-term UV oxidation can be lightened but not fully reversed, and we say so
    upfront.
- item: Formal leather shoes, loafers and boots
  detail: Cleaned and conditioned rather than washed, so the leather keeps its oils. Includes Chelsea
    boots, brogues, monk straps and leather sandals. Creasing is softened; cracked finish cannot be filled
    in.
- item: Football boots, turf shoes and cricket spikes
  detail: Studded and turf soles hold packed mud and rubber crumb that has to be cleared before any wet
    work. Synthetic uppers are cleaned without the heat that lifts the printed and welded panels.
- item: Kids' school shoes and canvas
  detail: The everyday workhorses — school blacks, white PT shoes and canvas slip-ons. Straightforward
    material, and usually the pairs where deodorising matters more than the cleaning.
- item: Insoles, laces and footbeds
  detail: Always removed and treated separately where they come out. This is where odour actually lives,
    and cleaning the upper alone is why shoes smell again within days.
- item: Birkenstocks and Crocs
  detail: Cork-and-jute footbeds and EVA clogs need their own handling, not a sneaker cycle — the cork
    is cleaned dry wherever possible so it does not delaminate, and Crocs are washed and deodorised without
    the heat that warps the foam.
