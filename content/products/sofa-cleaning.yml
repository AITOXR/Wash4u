process:
- step: Inspection and fabric test
  detail: We check the cleaning code where a label survives, and where it does not we go by weave, backing
    and feel. Seams, piping and existing tears get pointed out to you before anything begins, because
    extraction on weak stitching will open it. A hidden patch is tested for colour bleed.
- step: Dry soil removal
  detail: The deck, crevices, skirt and area under the cushions are vacuumed thoroughly before a drop
    of liquid goes near the fabric. Wetting dry grit turns it into mud in the base of the fibre, which
    is the single most common reason a DIY clean looks worse a week later.
- step: Pre-spray and dwell
  detail: A cleaning solution is applied evenly and left to work on the oil and soil binding the fibres.
    Dwell time does most of the lifting. Rushing this stage means compensating with scrubbing, which is
    what crushes pile and leaves shiny patches on the arms.
- step: Gentle agitation
  detail: A soft upholstery brush moves the solution through the pile rather than leaving it sitting on
    the surface. Direction matters on velvet and chenille, and we keep it consistent so the nap lies the
    same way when it dries.
- step: Hot water extraction
  detail: An upholstery tool rinses and vacuums in the same pass, pulling the soil and the solution back
    out instead of leaving detergent behind. Leftover detergent is a soil magnet, which is why sofas cleaned
    with a home steam mop get dirty again so quickly.
- step: Moisture control and drying
  detail: Repeated dry passes take out as much water as the machine will lift, cushions are stood on edge
    and airflow is set across the piece. This is what stops frame and backing tannins wicking to the surface
    and appearing as brown rings the next day.
- step: Walkthrough before we leave
  detail: We go over the piece with you, flag anything that has lightened rather than gone completely,
    and tell you how long to stay off it and what to avoid putting back on it while it dries.
what_we_clean:
- item: Fabric sofas, two-seater to L-shaped sectionals
  detail: The core job. Seat cushions, backrests, arms, side panels and the deck underneath, cleaned in
    place. Sectionals are worked section by section so the parts you use every day get the attention,
    not just the visible front.
- item: Sofa-cum-beds and daybeds
  detail: Cleaned with the mechanism folded and unfolded so the panel that hides inside gets treated too.
    That hidden fold is usually where trapped dust and odour sit.
- item: Recliners and motorised sofas
  detail: Fabric panels cleaned around the mechanism, with motors, wiring and control pods kept dry and
    the unit unplugged. We work the chair through its positions first so no soiled panel gets missed in
    the closed position.
- item: Dining chairs, bar stools and bench seating
  detail: Small seat pads take concentrated food and oil soil in one spot. These are cleaned as a set
    so the whole dining set matches afterwards rather than one clean chair standing out against seven
    others.
- item: Mattresses and fabric headboards
  detail: 'Surface extraction for dust, sweat and body oil, with the sides and the top panel done. We
    are honest here: this treats the surface. Anything that has soaked deep into a spring or foam core
    is beyond what surface cleaning reaches.'
- item: Ottomans, pouffes and footstools
  detail: Frequently the dirtiest thing in a living room, because feet, bags and dinner plates all land
    on it. Small enough to clean quickly alongside the main sofa.
- item: Home office and study chairs
  detail: Fabric task chairs pick up back and arm oil fast with daily use. Cleaned with the base and castors
    kept clear of moisture.
- item: Loose covers, cushion covers and throws
  detail: These come off and go to the workshop rather than being cleaned on the frame, which gives a
    better result on a washable cover. Collected and returned with our free doorstep pickup and delivery.
- item: Leather and rexine seating
  detail: Handled differently, not by extraction. Leather is cleaned and conditioned by hand with pH-balanced
    products. Rexine gets a surface clean, and if the coating is already flaking we will tell you cleaning
    will make the peeling worse.
