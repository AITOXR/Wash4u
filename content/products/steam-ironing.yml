body: |-
  ## What a press actually does

  Steam ironing is not a household iron pushed harder. A press works with three things at once — moisture, heat and pressure. Steam relaxes the fibre so the old crease lets go, the head applies even pressure across the whole panel to set the new shape, and the moisture is drawn back out so the garment leaves the table dry rather than damp.

  The part most people miss is the last one: cloth sets its shape as it cools, not while it is hot. A shirt that goes straight from the press into a bag will arrive with fresh creases no matter how well it was pressed. Everything here is hung or laid flat and allowed to cool before it is packed.

  ## Heat is decided by the fibre, not by the item

  Cotton and linen take high heat and direct contact. Polyester, nylon and most viscose blends do not. Put a hot head straight onto polyester and you get glazing — a permanent shine, usually on shoulders, lapels and the seat of trousers, that no amount of re-pressing will lift. Those pieces go through steam and a press cloth instead of bare metal. Silk is worked at low heat and kept away from wet steam, because a single droplet condensing on silk leaves a ring you can see across a room. Wool is steamed and brushed back up rather than crushed flat.

  ## Nazuk kapde, extra care

  Delicate work fails before the fabric does. Plastic sequins melt, hot-fix stones lift off their adhesive, and zari darkens under direct heat. Embellished kurtas, sherwanis and lehengas are pressed from the reverse under a cover cloth, or finished on a form so nothing bears the weight of the press head. Rubber and plastisol prints on T-shirts are turned inside out first — a print that touches a hot plate sticks to it. Saree and skirt pleats are set by hand, not squashed.

  ## What a press genuinely cannot fix

  Heat sets stains. Pressing is the fastest way to make a faint tea, sweat or deodorant mark permanent, so anything with a visible mark should be washed or dry cleaned first — if we spot one at sorting, we will call you before it goes on the table. Bubbling or rippling along a shirt collar or cuff is the interlining adhesive failing; heat makes that worse, not better, and it cannot be pressed out. Shine on the seat of well-worn wool trousers can be softened with steam and a brush but not reversed once the fibres are flattened. Fold lines that have sat under weight in viscose or rayon for months often will not drop fully. And linen will never come back looking like cotton — a soft crease is simply what the fibre does.

  ## Before you hand it over

  Empty every pocket: pens, coins, blister packs, notes. Make sure nothing has been stored damp, because heat locks that musty smell in. Point out loose or cracked buttons — thin resin buttons can split under pressure, and we would rather work around them than replace them. Tell us if you want formal wear returned on hangers instead of folded. Every piece is counted with you at the door, written on your receipt, and bagged on its own.
what_we_clean:
- item: Shirts and cotton trousers
  detail: Pressed panel by panel — yoke, sleeves, placket, collar — with the front placket done from the
    reverse so buttons do not print through onto the face of the shirt.
- item: Suits, blazers and formal jackets
  detail: Steam-finished rather than flattened, so the roll of the lapel and the shape at the shoulder
    and chest survive. Structured jackets are never given a hard crease down the sleeve.
- item: Sarees
  detail: Pallu and body pressed at a heat set for the base fabric, with zari, gota and mirror work covered
    and worked from the reverse. Returned folded along its own existing folds, or rolled on request.
- item: Kurtas, sherwanis and Indo-western sets
  detail: Heavy neck and cuff embroidery is pressed around, not over. Sherwanis are finished on a form
    and hung to cool so the front stays flat rather than bowing.
- item: Lehengas and heavy ethnic wear
  detail: Skirt panels and dupatta handled separately; net and organza get low heat only, since these
    fabrics shrivel almost instantly if the setting is wrong.
- item: Sweaters and knitwear
  detail: Steamed and eased back into shape by hand. Knit is never pressed flat under weight — that stretches
    the loops and leaves the garment wider than it went in.
- item: Dresses, chiffon and pleated skirts
  detail: Pleats are re-set individually and pinned before steaming. Georgette and chiffon are steamed
    off the surface rather than touched with the head.
- item: Bed linen, table linen and curtains
  detail: Pressed on the long table for full-width sheets and panels. Curtains come back on the fold they
    hang in, with the heading tape flattened so the pleats sit right when rehung.
process:
- step: Pickup and count at your door
  detail: Book on WhatsApp or by phone. Every piece is counted out with you before it leaves, and you
    get a written receipt of exactly what was collected.
- step: Sorting by fibre and heat tolerance
  detail: Items are grouped by what they can take — cottons and linens together, synthetics and blends
    separately, silk and embellished work set aside for hand finishing.
- step: Pre-press inspection
  detail: We check for stains, damp storage smell, missing or cracked buttons, open seams and collar delamination.
    Anything that heat would make worse gets flagged to you first.
- step: Pressing
  detail: Flat garments go on the press with steam and vacuum. Structured, knitted and embellished pieces
    are finished on a form or by hand with a cover cloth.
- step: Cooling and setting
  detail: Everything cools hung or laid flat before it is touched again. This is where the press actually
    holds — packing warm undoes the work.
- step: Separate packing
  detail: Your order is bagged on its own, never mixed with another customer's. Formal wear goes back
    on hangers under a cover if you have asked for it.
- step: Doorstep delivery
  detail: Delivered back free anywhere we cover in Gurugram, counted against the same receipt you signed
    at pickup.
faqs:
- q: Do the clothes need to be washed before I send them for steam ironing?
  a: Yes. This is a press-only service — nothing is washed or dry cleaned in it. Send clean, fully dry
    garments. If you want washing and pressing together, ask for laundry or dry cleaning instead and the
    pressing is part of that job.
- q: Will steam ironing remove a stain?
  a: No, and it will usually make it worse. Heat sets most stains permanently, especially tea, coffee,
    sweat and deodorant residue. If we find a mark during the pre-press check we will contact you rather
    than press over it, and suggest cleaning it first.
- q: Is it safe for a sequinned lehenga or a zari saree?
  a: Yes, because those are not pressed the way a shirt is. Embellished pieces are worked from the reverse
    under a cover cloth, or finished on a form, so the press head never rests on sequins, stones or zari.
    If a piece has loose or already-lifting work, we will point it out before starting.
- q: My shirt collar has gone bubbly and uneven. Can pressing fix it?
  a: Unfortunately not. That is the fused interlining inside the collar separating from the cloth, and
    applying more heat tends to accelerate it. We can press the rest of the shirt properly, but the collar
    will not return to flat. Best to be told this honestly than to pay and be disappointed.
- q: Can you press curtains and bed sheets, or is it only clothes?
  a: Both. Full-width sheets and curtain panels are done on the long table, and curtains are folded back
    the way they hang so the heading pleats sit correctly when you rehang them. Tell us at pickup if you
    want them on a roll instead of folded.
- q: Will my clothes come back on hangers?
  a: Formal wear — suits, blazers, shirts, sherwanis — can be returned on hangers with a cover if you
    ask when booking. Everyday items are folded by default because folded packs travel better and stack
    in a wardrobe without slipping.
- q: Do you pick up from my sector, and is pickup charged?
  a: Pickup and delivery are free across the areas we cover in Gurugram, run from our Sushant Lok Phase
    I (Sector 43) and Unitech Arcadia (Sector 49) stores. Message the list on WhatsApp at +91 63 67 600
    500 and we will confirm what applies to your items before we collect.
