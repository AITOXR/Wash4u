  detail: The metre-tall bears that no home machine will take. These need the longest drying of anything
    we handle, because the core sits so far from the surface.
- item: Bean and pellet-filled toys
  detail: Pellets and foam chips hold water and can stretch the outer fabric out of shape. We either surface-clean
