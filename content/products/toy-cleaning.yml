process:
- step: Inspection and honest verdict
  detail: We look at fading, matting, ink, old stains and existing damage, and tell you what will improve
    and what will not. If we think a toy will not survive cleaning, we say so and hand it back.
- step: Internal check
  detail: Seams are felt through to identify the filling and to find squeakers, music boxes, battery pouches
    or wire armature. This decides everything that follows.
- step: Colourfastness test
  detail: A hidden seam is tested before the toy goes anywhere near water. Felt tongues, printed cheeks
    and dyed ribbon are the usual culprits for bleeding onto light plush.
- step: Pre-treatment
  detail: Stains are worked individually. Food, milk and saliva marks are treated separately from general
    soiling, and we avoid anything aggressive on a toy a child puts in their mouth.
- step: Cleaning
  detail: Full immersion for fibrefill toys; controlled surface cleaning where the filling or the hardware
    rules out a wet clean. Extra rinses either way, so no residue is left in the pile.
- step: Controlled drying
  detail: Long and low, with movement, so the stuffing redistributes rather than setting into lumps. We
    dry to the core, not to the surface, because a damp centre is what causes the sour smell later.
- step: Finishing and separate packing
  detail: Pile brushed back up, shape restored, seams checked and any that opened restitched. The toy
    is packed on its own and returned to your door.
faqs:
- q: My son's teddy has a music box inside. Can it still be cleaned?
  a: Usually yes. If the unit is reachable, we open a seam, remove it, clean the toy fully and restitch.
    If it is sealed inside a moulded pocket we cannot reach, we clean the toy without immersion instead.
    That gets the surface and a fair bit of the smell, but not the whole core, and we will tell you that
    before you leave it with us rather than after.
- q: The toy is about eight years old and the fur has gone flat and rough. Will it look new again?
  a: No, and anyone who says otherwise is guessing. Matted pile is fibre that has been physically crushed
    and felted by years of hugging and washing. Cleaning removes the grime, and brushing lifts the pile
    as far as it will go, but the softness of new plush does not return. What you will get is a genuinely
    clean, fresh-smelling toy with the same texture.
- q: Is the cleaning safe for a baby who chews the toy?
  a: That is the reason we run extra rinses rather than a single one. The concern with a chewed toy is
    not the cleaning agent so much as what is left behind in the pile afterwards, so rinsing thoroughly
    is the point. We also keep harsh chlorine bleach away from children's items entirely, which is why
    heavily yellowed white plush stays slightly off-white with us.
- q: My daughter was sick on her toy a few days ago. Can you get the smell out?
  a: Usually, if it has not already been hot-washed. Vomit and milk are protein soils and heat sets them
    permanently, so a hot home machine cycle is what makes them unrecoverable. Send it as it is, tell
    us what happened and roughly when, and let us treat it. Do not try to sanitise it with hot water first.
- q: Do you take giant soft toys?
  a: Yes, and they are one of the main reasons people call us for this, since nothing that size fits a
    domestic machine. The thing to know is that a large toy takes considerably longer than a small one,
    almost entirely because of drying. Rushing a big toy out half-dry is how it develops mould at the
    centre, so we do not do it.
- q: A seam has already come open and stuffing is showing. Should I still send it?
  a: Send it, and point out the opening when we count the item at your door. We would rather stitch a
    weak seam closed before cleaning than have it burst mid-process. Small repairs like this are part
    of handling the toy properly, not an obstacle to it.
- q: Where do you collect from, and how does it work?
  a: 'Free pickup and delivery across Gurugram, or you can drop items at either store: Vyapar Kendra in
    Sushant Lok Phase I, Sector 43, or Unitech Arcadia in Sector 49. Call or WhatsApp +91 63 67 600 500.
    Whatever you send is counted with you at the door and acknowledged with a written receipt.'
