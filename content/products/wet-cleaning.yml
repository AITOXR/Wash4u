process:
- step: Counted at your door
  detail: Every piece is counted and logged with you at pickup, and you get a written receipt of exactly
    what was collected before anything leaves your building.
- step: Inspection and fibre check
  detail: 'We identify the fibre, read the construction (canvassed or fused, stitched or glued trims)
    and photograph any existing damage: seam splits, moth holes, prior colour loss, home stain-removal
    attempts.'
- step: Colourfastness test
  detail: A damp white swab on an inside seam allowance tells us whether the dye will bleed. Bandhani,
    hand-block prints, deep indigo and rich reds get tested every single time, not just the first time
    we see them.
- step: Stain-specific pre-spotting
  detail: Each mark is treated by what caused it, not by how it looks. Protein, tannin, sugar, oil and
    pigment all need different chemistry, and applying the wrong one first can set a stain permanently.
- step: Programmed wash
  detail: Water temperature, drum speed, reversal interval, water level and extraction are all set for
    that specific fibre and garment weight. Wool and silk run near-neutral pH with minimal mechanical
    action.
- step: Controlled drying
  detail: Items come out damp on purpose. Nothing that can shrink is dried to completion in a tumbler,
    because heat plus dryness is what pulls wool and viscose out of shape.
- step: Tensioned finishing
  detail: The last of the moisture leaves on form finishers and steam presses that hold the garment at
    its cut dimensions while it dries, restoring shoulder line, sleeve shape and hem length.
- step: Final check and separate packing
  detail: Each order is checked, then bagged on its own. Your clothes are never packed or handled together
    with another customer's order.
what_we_clean:
- item: Wool and cashmere knitwear
  detail: Jumpers, cardigans and shawls that felt and shrink in a home machine. Fibre-matched pH and near-zero
    agitation, then dried flat under tension rather than tumbled.
- item: Everyday shirts and cotton trousers
  detail: Collar and cuff soil is sweat, sebum and salt, which is exactly what solvent cannot touch. Wet
    cleaning is the better process for office wear worn in a Gurugram summer.
- item: Silk and viscose that tests safe
  detail: Plain-dyed silks and viscose blends that pass the dye-bleed test come out softer than they would
    from solvent. Silk taffeta, dupion and anything with real zari are excluded, since water can flatten
    the crispness or tarnish the thread.
- item: Baby and toddler clothing
  detail: No solvent means no residue against a child's skin. Milk, food and nappy soiling are all water-soluble
    and come out properly rather than being masked.
- item: Gym and sportswear
  detail: Odour in synthetics is bacteria feeding on trapped body oils and salts. Solvent removes the
    oil but leaves the salts; water removes both, which is why the smell comes back after a dry clean
    and not after a wet clean.
- item: Down jackets and puffers
  detail: Solvent strips the natural oils from down clusters and the jacket never regains its loft. Wet
    cleaning preserves the fill, followed by a long low-heat cycle to break the clumps back open.
- item: Cotton and linen ethnic wear
  detail: Kurtas, salwars and unlined cotton suits. Hand-block prints, bandhani and unfixed dyes are always
    swab-tested first, and anything that bleeds is redirected or returned to you unwashed.
- item: Table linen and napkins
  detail: Wine, coffee, gravy and turmeric are food soils, and food soils are water's territory. Turmeric
    in particular needs careful pH handling, because an alkaline treatment turns it red instead of removing
    it.
- item: Canvassed tailoring
  detail: Jackets and blazers with a stitched-in chest piece, plus suit trousers, which almost always
    wet clean well even when the matching jacket is fused and has to go to solvent.
