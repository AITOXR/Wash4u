{% extends "base.html" %}

{% block content %}
<section class="page-hero">
  <div class="container">
    <h1 class="page-hero__title">{{ policy.title }}</h1>
  </div>
</section>

<section class="section section-light">
  <div class="container">
    <article class="policy-section reveal">
      {% for section in policy.sections %}
      <h3>{{ section.heading }}</h3>
      <p>{{ section.content }}</p>
      {% endfor %}
    </article>
  </div>
</section>
{% endblock %}
