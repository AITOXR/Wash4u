{# Section type: page_header — see schemas/sections/page_header.yml #}
<section class="page-hero">
  <div class="wrap wrap--narrow">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="{{ root_path }}">Home</a>
      <span aria-hidden="true">/</span>
      <span>{{ page.title }}</span>
    </nav>
    {% if section.props.eyebrow %}<p class="eyebrow">{{ section.props.eyebrow }}</p>{% endif %}
    <h1>{{ section.props.heading }}</h1>
    {% if section.props.subheading %}<p class="lede">{{ section.props.subheading }}</p>{% endif %}
  </div>
</section>
