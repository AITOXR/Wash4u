<section class="section">
  <div class="wrap wrap--narrow">
    {% if section.props.heading %}<h2>{{ section.props.heading }}</h2>{% endif %}
    <div style="position:relative;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden">
      <iframe src="https://www.youtube-nocookie.com/embed/{{ section.props.youtube_id }}"
              style="position:absolute;inset:0;width:100%;height:100%;border:0"
              loading="lazy" allowfullscreen title="{{ section.props.heading or 'Video' }}"></iframe>
    </div>
  </div>
</section>
